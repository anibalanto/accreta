java\",\n    ]);\n    run_in(&root, &[\"index\", \"build\"]);\n\n    let (stdout, _, ok) = run_in(&root, &[\"index\", \"status\"]);\n    assert!(ok, \"index status should exit 0 when OK\");\n    assert!(stdout.contains(\"OK\"), \"expected OK in status output:\\n{stdout}\");\n}","start_line":369,"lang":"rust","xi":1,"yi":23},{"id":"crates/bilinker/src/accept.rs@subsystems/bilinker/.stratum/impl#L1","label":"crates/bilinker/src/accept.rs","file_group_id":"fg_crates_bilinker_src_accept_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/accept.rs","content":"use std::path::Path;\nuse anyhow::{bail, Context, Result};\nuse chrono::Utc;\n\nuse crate::bilink::BiLinkFile;\nuse crate::chain::resolve_layer_link;\nuse crate::git::try_head_commit_for_file;\nuse crate::grammar;\nuse crate::hash;\nuse crate::link::{EndpointState, LinkEndpoint};\nuse crate::query;\nuse crate::task::resolve_task_path;\n\npub struct AcceptResult {\n    pub uuid: String,\n    pub n: u8,\n    pub hash: String,\n    pub commit: String,\n}\n\n/// Accept endpoint `n` of the bilink at `bilink_path`, establishing its hash baseline.\n///\n/// Sets `hash.N`, `commit.N`, `state.N = OK`, and `resolved_at` in the file.\npub fn accept(\n    bilink_path: &Path,\n    n: u8,\n    hash_override: Option<&str>,\n    commit_override: Option<&str>,\n) -> Result<AcceptResult> {\n    if n > 1 {\n        bail!(\"endpoint index must be 0 or 1, got {n}\");\n    }\n\n    let mut bl = BiLinkFile::load(bilink_path)?;\n\n    let layer_root = bilink_path\n        .parent().and_then(|p| p.parent())\n        .unwrap_or(bilink_path);\n\n    let endpoint = if n == 0 { &bl.link0 } else { &bl.link1 };\n\n    let (h, c) = compute_hash_and_commit(\n        layer_root, endpoint, &bl.uuid, hash_override, commit_override,\n    )?;\n\n    if n == 0 {\n        bl.hash0   = Some(h.clone());\n        bl.commit0 = Some(c.clone());\n        bl.state0  = Some(EndpointState::Ok);\n    } else {\n        bl.hash1   = Some(h.clone());\n        bl.commit1 = Some(c.clone());\n        bl.state1  = Some(EndpointState::Ok);\n    }\n    bl.resolved_at = Some(Utc::now().format(\"%Y-%m-%dT%H:%M:%SZ\").to_string());\n    bl.write(bilink_path)?;\n\n    Ok(AcceptResult { uuid: bl.uuid, n, hash: h, commit: c })\n}\n\nfn compute_hash_and_commit(\n    layer_root: &Path,\n    endpoint: &LinkEndpoint,\n    uuid: &str,\n    hash_override: Option<&str>,\n    commit_override: Option<&str>,\n) -> Result<(String, String)> {\n    match endpoint {\n        LinkEndpoint::Structural(sref) => {\n            let file_path = layer_root.join(&sref.file);\n            let source = std::fs::read_to_string(&file_path)\n                .with_context(|| format!(\"reading {}\", file_path.display()))?;\n\n            let frag_hash = if let Some(query_str) = &sref.query {\n                let lang     = grammar::language_for_file(&sref.file);\n                let language = grammar::for_language(lang)?;\n                let node_range = query::find_target(language, &source, query_str)?;\n                let (node_start, node_end) = node_range\n                    .ok_or_else(|| anyhow::anyhow!(\n                        \"query matched nothing in '{}'; cannot accept\", sref.file\n                    ))?;\n                let (frag_start, frag_end) = match &sref.range {\n                    Some(r) => (node_start + r.start, (node_start + r.end).min(source.len())),\n                    None    => (node_start, node_end),\n                };\n                hash::sha256(source[frag_start..frag_end].as_bytes())\n            } else {\n                hash::sha256(source.as_bytes())\n            };\n\n            let h = hash_override.map(String::from).unwrap_or(frag_hash);\n            let c = commit_override.map(String::from)\n                .unwrap_or_else(|| try_head_commit_for_file(layer_root, &sref.file)\n                    .unwrap_or_default());\n            Ok((h, c))\n        }\n\n        LinkEndpoint::Task(id) => {\n            let (task_path, project_root) = resolve_task_path(layer_root, id);\n            let source = std::fs::read_to_string(&task_path)","start_line":1,"lang":"rust","xi":1,"yi":25},{"id":"crates/bilinker/src/accept.rs@subsystems/bilinker/.stratum/impl#L24","label":"crates/bilinker/src/accept.rs#L24","file_group_id":"fg_crates_bilinker_src_accept_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/accept.rs","content":"pub fn accept(\n    bilink_path: &Path,\n    n: u8,\n    hash_override: Option<&str>,\n    commit_override: Option<&str>,\n) -> Result<AcceptResult> {\n    if n > 1 {\n        bail!(\"endpoint index must be 0 or 1, got {n}\");\n    }\n\n    let mut bl = BiLinkFile::load(bilink_path)?;\n\n    let layer_root = bilink_path\n        .parent().and_then(|p| p.parent())\n        .unwrap_or(bilink_path);\n\n    let endpoint = if n == 0 { &bl.link0 } else { &bl.link1 };\n\n    let (h, c) = compute_hash_and_commit(\n        layer_root, endpoint, &bl.uuid, hash_override, commit_override,\n    )?;\n\n    if n == 0 {\n        bl.hash0   = Some(h.clone());\n        bl.commit0 = Some(c.clone());\n        bl.state0  = Some(EndpointState::Ok);\n    } else {\n        bl.hash1   = Some(h.clone());\n        bl.commit1 = Some(c.clone());\n        bl.state1  = Some(EndpointState::Ok);\n    }\n    bl.resolved_at = Some(Utc::now().format(\"%Y-%m-%dT%H:%M:%SZ\").to_string());\n    bl.write(bilink_path)?;\n\n    Ok(AcceptResult { uuid: bl.uuid, n, hash: h, commit: c })\n}","start_line":24,"lang":"rust","xi":1,"yi":26},{"id":"crates/bilinker/src/accept.rs@subsystems/bilinker/.stratum/impl#L146","label":"crates/bilinker/src/accept.rs#L146","file_group_id":"fg_crates_bilinker_src_accept_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/accept.rs","content":"pub fn accept_layer(\n    layer_root: &Path,\n    path_filter: Option<&str>,\n) -> Result<Vec<AcceptResult>> {\n    let bilink_dir = layer_root.join(\".bilink\");\n    let mut results = Vec::new();\n\n    if !bilink_dir.exists() {\n        return Ok(results);\n    }\n\n    let all = path_filter.map(|f| f == \".\" || f.is_empty()).unwrap_or(true);\n\n    for entry in std::fs::read_dir(&bilink_dir)? {\n        let path = entry?.path();\n        if path.extension().and_then(|e| e.to_str()) != Some(\"bilink\") { continue; }\n        if path.file_name().and_then(|n| n.to_str())\n            .map(|n| n.starts_with('.')).unwrap_or(false) { continue; }\n\n        let bl = match BiLinkFile::load(&path) {\n            Ok(b) => b,\n            Err(e) => { eprintln!(\"warn: skipping {}: {e}\", path.display()); continue; }\n        };\n\n        for n in [0u8, 1u8] {\n            let endpoint = if n == 0 { &bl.link0 } else { &bl.link1 };\n            let hash  = if n == 0 { &bl.hash0  } else { &bl.hash1  };\n            let state = if n == 0 { &bl.state0 } else { &bl.state1 };\n\n            let needs_accept = hash.is_none() || matches!(\n                state,\n                Some(EndpointState::Altered) | Some(EndpointState::ChainDirty)\n            );\n            if !needs_accept { continue; }\n\n            let matches = if all {\n                true\n            } else if let (Some(filter), LinkEndpoint::Structural(sref)) = (path_filter, endpoint) {\n                sref.file == filter\n                    || sref.file.starts_with(&format!(\"{filter}/\"))\n                    || sref.file.starts_with(filter)\n            } else {\n                false\n            };\n\n            if !matches { continue; }\n\n            match accept(&path, n, None, None) {\n                Ok(r)  => results.push(r),\n                Err(e) => eprintln!(\"warn: {}.{n}: {e}\", &bl.uuid[..8.min(bl.uuid.len())]),\n            }\n        }\n    }\n\n    Ok(results)\n}","start_line":146,"lang":"rust","xi":1,"yi":27},{"id":"crates/bilinker/src/bilink.rs@subsystems/bilinker/.stratum/impl#L1","label":"crates/bilinker/src/bilink.rs","file_group_id":"fg_crates_bilinker_src_bilink_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/bilink.rs","content":"use std::path::{Path, PathBuf};\nuse anyhow::{bail, Context, Result};\n\nuse crate::link::{ByteRange, EndpointState, LinkEndpoint};\n\n#[derive(Debug)]\npub struct BiLinkFile {\n    pub uuid: String,\n    pub link0: LinkEndpoint,\n    pub link1: LinkEndpoint,\n    pub hash0: Option<String>,\n    pub commit0: Option<String>,\n    pub hash1: Option<String>,\n    pub commit1: Option<String>,\n    pub range0: Option<ByteRange>,\n    pub range1: Option<ByteRange>,\n    pub state0: Option<EndpointState>,\n    pub state1: Option<EndpointState>,\n    pub resolved_at: Option<String>,\n}\n\nimpl BiLinkFile {\n    pub fn load(path: &Path) -> Result<Self> {\n        let text = std::fs::read_to_string(path)\n            .with_context(|| format!(\"reading {}\", path.display()))?;\n        let uuid = path\n            .file_stem()\n            .and_then(|s| s.to_str())\n            .unwrap_or(\"\")\n            .to_string();\n        Self::parse(&text, &uuid).with_context(|| format!(\"parsing {}\", path.display()))\n    }\n\n    pub fn parse(text: &str, uuid: &str) -> Result<Self> {\n        let mut link0: Option<String> = None;\n        let mut link1: Option<String> = None;\n        let mut hash0 = None;\n        let mut commit0 = None;\n        let mut hash1 = None;\n        let mut commit1 = None;\n        let mut range0 = None;\n        let mut range1 = None;\n        let mut state0 = None;\n        let mut state1 = None;\n        let mut resolved_at = None;\n        let mut current_key: Option<&'static str> = None;\n\n        const KEYS: &[&str] = &[\n            \"link.0\", \"link.1\",\n            \"hash.0\", \"commit.0\",\n            \"hash.1\", \"commit.1\",\n            \"range.0\", \"range.1\",\n            \"state.0\", \"state.1\",\n            \"resolved_at\",\n        ];\n\n        for line in text.lines() {\n            if line.trim().is_empty() || line.trim().starts_with('#') {\n                current_key = None;\n                continue;\n            }\n\n            let is_new_key = KEYS.iter().any(|k| {\n                line.starts_with(k) && line[k.len()..].starts_with(':')\n            });\n\n            if is_new_key {\n                let colon = line.find(':').unwrap();\n                let key   = line[..colon].trim();\n                let value = line[colon + 1..].trim().to_string();\n                current_key = Some(match key {\n                    \"link.0\"      => { link0      = Some(value); \"link.0\" }\n                    \"link.1\"      => { link1      = Some(value); \"link.1\" }\n                    \"hash.0\"      => { hash0      = Some(value); \"\" }\n                    \"commit.0\"    => { commit0    = Some(value); \"\" }\n                    \"hash.1\"      => { hash1      = Some(value); \"\" }\n                    \"commit.1\"    => { commit1    = Some(value); \"\" }\n                    \"range.0\"     => { range0     = Some(value); \"\" }\n                    \"range.1\"     => { range1     = Some(value); \"\" }\n                    \"state.0\"     => { state0     = Some(value); \"\" }\n                    \"state.1\"     => { state1     = Some(value); \"\" }\n                    \"resolved_at\" => { resolved_at = Some(value); \"\" }\n                    _             => \"\"\n                });\n            } else if let Some(key) = current_key {\n                let cont = line.trim();\n                match key {\n                    \"link.0\" => link0.get_or_insert_default().push_str(&format!(\" {cont}\")),\n                    \"link.1\" => link1.get_or_insert_default().push_str(&format!(\" {cont}\")),\n                    _ => {}\n                }\n            }\n        }\n\n        let parse_ep = |raw: Option<String>, field: &str| -> Result<LinkEndpoint> {\n            raw.with_context(|| format!(\"missing '{field}' field\"))?\n                .parse::<LinkEndpoint>()\n                .with_context(|| format!(\"parsing {field}\"))\n        };\n","start_line":1,"lang":"rust","xi":1,"yi":29},{"id":"crates/bilinker/src/bilink.rs@subsystems/bilinker/.stratum/impl#L7","label":"crates/bilinker/src/bilink.rs#L7","file_group_id":"fg_crates_bilinker_src_bilink_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/bilink.rs","content":"pub struct BiLinkFile {\n    pub uuid: String,\n    pub link0: LinkEndpoint,\n    pub link1: LinkEndpoint,\n    pub hash0: Option<String>,\n    pub commit0: Option<String>,\n    pub hash1: Option<String>,\n    pub commit1: Option<String>,\n    pub range0: Option<ByteRange>,\n    pub range1: Option<ByteRange>,\n    pub state0: Option<EndpointState>,\n    pub state1: Option<EndpointState>,\n    pub resolved_at: Option<String>,\n}","start_line":7,"lang":"rust","xi":1,"yi":30},{"id":"crates/bilinker/src/capture.rs@subsystems/bilinker/.stratum/impl#L16","label":"crates/bilinker/src/capture.rs#L16","file_group_id":"fg_crates_bilinker_src_capture_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/capture.rs","content":"pub fn capture(\n    root: &Path,\n    file: &str,\n    start: (usize, usize), // (line, col) 1-based\n    end: (usize, usize),\n) -> Result<CaptureResult> {\n    let commit = git::head_commit_for_file(root, file)?;\n    let file_path = root.join(file);\n    let source = std::fs::read_to_string(&file_path)\n        .with_context(|| format!(\"reading {}\", file_path.display()))?;\n\n    let lang = grammar::language_for_file(file);\n    let language = grammar::for_language(lang)?;\n    let mut parser = Parser::new();\n    parser.set_language(&language).context(\"set language\")?;\n    let tree = parser.parse(&source, None).context(\"parse failed\")?;\n\n    let start_point = Point { row: start.0 - 1, column: start.1 - 1 };\n    let end_point   = Point { row: end.0 - 1,   column: end.1 - 1 };\n\n    let root_node = tree.root_node();\n    let node = root_node\n        .named_descendant_for_point_range(start_point, end_point)\n        .context(\"no named node at selection\")?;\n\n    let anchors = stable_anchor_kinds(lang);\n    let target = walk_up_to_anchor(node, anchors).unwrap_or(node);\n\n    let anchor = target.parent()\n        .and_then(|p| walk_up_to_anchor(p, anchors));\n\n    // For YAML block_sequence_item: use it directly as @target (contains the whole item)\n    let (target, anchor) = if target.kind() == \"block_sequence_item\" {\n        (target, None)\n    } else if let Some(a) = anchor {\n        if a.kind() == \"block_sequence_item\" {\n            (a, None)\n        } else {\n            (target, Some(a))\n        }\n    } else {\n        (target, anchor)\n    };\n\n    let query = match anchor {\n        None => query_for_node(target, &source, &mut 0),\n        Some(a) if a.id() == target.id() => query_for_node(target, &source, &mut 0),\n        Some(a) => {\n            let path = build_path(a, target);\n            query_from_path(&path, &source, &mut 0)\n        }\n    };\n\n    let start_byte = byte_for_point(&source, start_point);\n    let end_byte   = byte_for_point(&source, end_point);\n    // Single-point selection → capture the whole anchor; use relative offsets only for real ranges.\n    let range = if start_byte == end_byte {\n        None\n    } else if start_byte != target.start_byte() || end_byte != target.end_byte() {\n        let rel_start = start_byte.saturating_sub(target.start_byte());\n        let rel_end   = end_byte.saturating_sub(target.start_byte());\n        Some(crate::link::ByteRange { start: rel_start, end: rel_end })\n    } else {\n        None\n    };\n\n    let (frag_start, frag_end) = match &range {\n        Some(r) => (target.start_byte() + r.start, target.start_byte() + r.end),\n        None    => (target.start_byte(), target.end_byte()),\n    };\n    let fragment = &source[frag_start..frag_end.min(source.len())];\n    let hash = hash::sha256(fragment.as_bytes());\n\n    Ok(CaptureResult {\n        endpoint: StructuralRef {\n            file: file.to_string(),\n            query: Some(query),\n            range,\n        },\n        hash,\n        commit,\n    })\n}","start_line":16,"lang":"rust","xi":1,"yi":32},{"id":"crates/bilinker/src/chain.rs@subsystems/bilinker/.stratum/impl#L1","label":"crates/bilinker/src/chain.rs","file_group_id":"fg_crates_bilinker_src_chain_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/chain.rs","content":"use std::path::{Component, Path, PathBuf};\nuse anyhow::{bail, Result};\nuse uuid::Uuid;\n\nuse crate::bilink::BiLinkFile;\nuse crate::link::LinkEndpoint;\n\npub struct ChainNew {\n    pub uuid: String,\n    pub files: Vec<PathBuf>,\n}\n\n/// Creates a new chain or direct link.\n///\n/// `tips`: exactly 2 entries of (layer_path_relative_to_root, structural_endpoint).\n/// `mids`: ordered layer paths between the two tips.\n/// All paths are relative to `root`.\npub fn chain_new(\n    root: &Path,\n    tips: &[(PathBuf, LinkEndpoint)],\n    mids: &[PathBuf],\n) -> Result<ChainNew> {\n    if tips.len() != 2 {\n        bail!(\"chain new requires exactly 2 --tip arguments\");\n    }\n\n    let uuid = Uuid::new_v4().to_string();\n\n    let all_layers: Vec<PathBuf> = {\n        let mut v = vec![tips[0].0.clone()];\n        v.extend_from_slice(mids);\n        v.push(tips[1].0.clone());\n        v\n    };\n\n    let n = all_layers.len();\n    let mut created = Vec::new();\n\n    // Same-layer direct link: both tips in the same directory → one file.\n    if n == 2 && normalize(&all_layers[0]) == normalize(&all_layers[1]) {\n        let bl = BiLinkFile {\n            uuid:      uuid.clone(),\n            link0:     tips[0].1.clone(),\n            link1:     tips[1].1.clone(),\n            hash0: None, commit0: None,\n            hash1: None, commit1: None,\n            range0:    None, range1: None,\n            state0:    None, state1: None,\n            resolved_at: None,\n        };\n        let path = bilink_path(root, &all_layers[0], &uuid);\n        bl.write(&path)?;\n        created.push(path);\n        return Ok(ChainNew { uuid, files: created });\n    }\n\n    // Multi-layer chain\n    for i in 0..n {\n        let layer = &all_layers[i];\n\n        let (link0, link1) = if i == 0 {\n            let to_next = layer_endpoint(layer, &all_layers[i + 1])?;\n            (tips[0].1.clone(), to_next)\n        } else if i == n - 1 {\n            let to_prev = layer_endpoint(layer, &all_layers[i - 1])?;\n            (to_prev, tips[1].1.clone())\n        } else {\n            let to_prev = layer_endpoint(layer, &all_layers[i - 1])?;\n            let to_next = layer_endpoint(layer, &all_layers[i + 1])?;\n            (to_prev, to_next)\n        };\n\n        let bl = BiLinkFile {\n            uuid:      uuid.clone(),\n            link0,\n            link1,\n            hash0: None, commit0: None,\n chain::resolve_layer_link;\nuse crate::grammar;\nuse crate::hash;\nuse crate::link::{ByteRange, EndpointState, LinkEndpoint, StructuralRef};\nuse crate::query;\nuse crate::task::resolve_task_path;\n\n#[derive(Debug)]\npub struct CheckResult {\n    pub uuid: String,\n    pub state0: EndpointState,\n    pub state1: EndpointState,\n    pub updated: bool,\n}\n\nimpl CheckResult {\n    pub fn is_clean(&self) -> bool {\n        use EndpointState::*;\n        matches!(self.state0, Ok | Moved | Displaced | Reanchored | Expanded | Todo)\n            && matches!(self.state1, Ok | Moved | Displaced | Reanchored | Expanded | Todo)\n    }\n}\n\npub fn check(root: &Path, path: &Path) -> Result<Vec<CheckResult>> {\n    let mut results = Vec::new();\n\n    if path.is_file() {\n        results.push(check_file(root, path)?);\n        return Ok(results);\n    }\n\n    let bilink_dir = if path.ends_with(\".bilink\") { path.to_path_buf() }\n                     else { path.join(\".bilink\") };\n\n    for entry in walkdir(&bilink_dir)? {\n        if entry.extension().and_then(|e| e.to_str()) == Some(\"bilink\")\n            && !entry.ancestors().any(|a| a.ends_with(\".pending\"))\n        {\n            results.push(check_file(root, &entry)?);\n        }\n    }\n    Ok(results)\n}\n\nfn check_file(root: &Path, bilink_path: &Path) -> Result<CheckResult> {\n    let mut bl = BiLinkFile::load(bilink_path)?;\n\n    let layer_root = bilink_path\n        .parent().and_then(|p| p.parent())\n        .unwrap_or(root);\n\n    let uuid = bl.uuid.clone();\n\n    let (state0, range0) =\n        check_endpoint(root, layer_root, &bl.link0, &uuid, bl.hash0.as_deref(), bl.range0.as_ref())?;\n\n    let (state1, range1) =\n        check_endpoint(root, layer_root, &bl.link1, &uuid, bl.hash1.as_deref(), bl.range1.as_ref())?;\n\n    let updated = bl.state0.as_ref() != Some(&state0)\n        || bl.state1.as_ref() != Some(&state1)\n        || bl.range0 != range0\n        || bl.range1 != range1;\n\n    bl.range0      = range0;\n    bl.range1      = range1;\n    bl.state0      = Some(state0.clone());\n    bl.state1      = Some(state1.clone());\n    bl.resolved_at = Some(Utc::now().format(\"%Y-%m-%dT%H:%M:%SZ\").to_string());\n\n    bl.write(bilink_path)?;\n\n    Ok(CheckResult { uuid, state0, state1, updated })\n}\n\nfn check_endpoint(\n    root: &Path,\n    layer_root: &Path,\n    endpoint: &LinkEndpoint,\n    uuid: &str,\n    hash: Option<&str>,\n    stored_range: Option<&ByteRange>,\n) -> Result<(EndpointState, Option<ByteRange>)> {\n    match endpoint {\n        LinkEndpoint::Structural(sref) => check_structural(root, sref, hash, stored_range),\n        LinkEndpoint::Layer(tokens)    => check_layer(layer_root, tokens, uuid, hash),\n        LinkEndpoint::Task(id)         => check_task(layer_root, id, hash),\n    }\n}\n\nfn check_structural(\n    root: &Path,\n    sref: &StructuralRef,\n    hash: Option<&str>,\n    stored_range: Option<&ByteRange>,","start_line":1,"lang":"rust","xi":1,"yi":37},{"id":"crates/bilinker/src/check.rs@subsystems/bilinker/.stratum/impl#L29","label":"crates/bilinker/src/check.rs#L29","file_group_id":"fg_crates_bilinker_src_check_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/check.rs","content":"pub fn check(root: &Path, path: &Path) -> Result<Vec<CheckResult>> {\n    let mut results = Vec::new();\n\n    if path.is_file() {\n        results.push(check_file(root, path)?);\n        return Ok(results);\n    }\n\n    let bilink_dir = if path.ends_with(\".bilink\") { path.to_path_buf() }\n                     else { path.join(\".bilink\") };\n\n    for entry in walkdir(&bilink_dir)? {\n        if entry.extension().and_then(|e| e.to_str()) == Some(\"bilink\")\n            && !entry.ancestors().any(|a| a.ends_with(\".pending\"))\n        {\n            results.push(check_file( { start: 0, end: source.len() };\n        let state = if hash.is_none() {\n            EndpointState::Pending\n        } else if hash == Some(new_hash.as_str()) {\n            EndpointState::Ok\n        } else {\n            EndpointState::Altered\n        };\n        return Ok((state, Some(range)));\n    };\n\n    let lang     = grammar::language_for_file(&sref.file);\n    let language = grammar::for_language(lang)?;\n    let node_range = query::find_target(language, &source, query_str)?;\n\n    let Some((node_start, node_end)) = node_range else {\n        return Ok((EndpointState::Unanchored, None));\n    };\n\n    let (frag_start, frag_end) = match &sref.range {\n        Some(r) => (node_start + r.start, (node_start + r.end).min(source.len())),\n        None    => (node_start, node_end),\n    };\n    let fragment  = &source[frag_start..frag_end];\n    let new_hash  = hash::sha256(fragment.as_bytes());\n    let new_range = ByteRange { start: frag_start, end: frag_end };\n\n    if hash.is_none() {\n        return Ok((EndpointState::Pending, Some(new_range)));\n    }\n\n    if hash == Some(new_hash.as_str()) {\n        return Ok((EndpointState::Ok, Some(new_range)));\n    }\n\n    if let (Some(stored_hash), Some(sr)) = (hash, stored_range) {\n        let frag_len = sr.end - sr.start;\n        if let Some(displaced) = find_in_node(&source, node_start, node_end, stored_hash, frag_len) {\n            return Ok((EndpointState::Displaced, Some(displaced)));\n        }\n    }\n\n    Ok((EndpointState::Altered, Some(new_range)))\n}","start_line":96,"lang":"rust","xi":1,"yi":40},{"id":"crates/bilinker/src/check.rs@subsystems/bilinker/.stratum/impl#L157","label":"crates/bilinker/src/check.rs#L157","file_group_id":"fg_crates_bilinker_src_check_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/check.rs","content":"fn check_layer(\n    layer_root: &Path,\n    tokens: &stratum::StratumPath,\n    uuid: &str,\n    stored_hash: Option<&str>,\n) -> Result<(EndpointState, Option<ByteRange>)> {\n    let absent = if stored_hash.is_none() { EndpointState::Todo } else { EndpointState::Broken };\n\n    let target_layer = match stratum::resolve(layer_root, layer_root, tokens) {\n        Ok(p)  => p,\n        Err(_) => return Ok((absent, None)),\n    };\n\n    let target_bilink = resolve_layer_link(\n        &layer_root.join(\".bilink\").join(format!(\"{uuid}.bilink\")),\n        layer_root,\n        &target_layer,\n        uuid,\n    );\n\n    if !target_bilink.exists() {\n        return Ok((absent, None));\n    }\n\n    // Hash = structural endpoint's accepted hash in the adjacent bilink.\n    // This avoids circular dependency: accepting a layer endpoint never modifies\n    // the adjacent bilink file, so the hash never cascades back.\n    let adj_bl = crate::bilink::BiLinkFile::load(&target_bilink)?;\n    let Some(adj_struct_hash) = adj_bl.structural_hash() else {\n        return Ok((EndpointState::Pending, None));\n    };\n\n    let state = if stored_hash.is_none() {\n        EndpointState::Pending\n    } else if stored_hash == Some(adj_struct_hash) {\n        EndpointState::Ok\n    } else {\n        EndpointState::ChainDirty\n    };\n\n    Ok((state, None))\n}","start_line":157,"lang":"rust","xi":1,"yi":41},{"id":"crates/bilinker/src/check.rs@subsystems/bilinker/.stratum/impl#L218","label":"crates/bilinker/src/check.rs#L218","file_group_id":"fg_crates_bilinker_src_check_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/check.rs","content":"fn find_in_node(\n    source: &str,\n    node_start: usize,\n    node_end: usize,\n    target_hash: &str,\n    frag_len: usize,\n) -> Option<ByteRange> {\n    if frag_len == 0 || frag_len > node_end.saturating_sub(node_start) {\n        return None;\n    }\n    let node = &source[node_start..node_end];\n    let mut start = 0;\n    while start + frag_len <= node.len() {\n        if source.is_char_boundary(node_start + start) {\n            let end = start + frag_len;\n            if end <= node.len() && source.is_char_boundary(node_start + end) {\n                if hash::sha256(node[start..end].as_bytes()) == target_hash {\n                    return Some(ByteRange {\n                        start: node_start + start,\n                        end: node_start + end,\n                    });\n                }\n            }\n        }\n        start += 1;\n    }\n    None\n}","start_line":218,"lang":"rust","xi":1,"yi":42},{"id":"crates/bilinker/src/check.rs@subsystems/bilinker/.stratum/impl#L283","label":"crates/bilinker/src/check.rs#L283","file_group_id":"fg_crates_bilinker_src_check_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/check.rs","content":"fn check_whole_file_first_time_is_pending() {\n        let dir = tempdir().unwrap();\n        std::fs::write(dir.path().join(\"a.md\"), \"hello world\").unwrap();\n\n        let bilink_dir = dir.path().join(\".bilink\");\n        let path = make_bilink(&bilink_dir, \"uuid1\",\n            whole_file_endpoint(\"a.md\"),\n            whole_file_endpoint(\"a.md\"),\n        );\n\n        let result = check_file(dir.path(), &path).unwrap();\n        assert_eq!(result.state0, EndpointState::Pending);\n        assert_eq!(result.state1, EndpointState::Pending);\n    }","start_line":283,"lang":"rust","xi":1,"yi":43},{"id":"crates/bilinker/src/check.rs@subsystems/bilinker/.stratum/impl#L299","label":"crates/bilinker/src/check.rs#L299","file_group_id":"fg_crates_bilinker_src_check_rs_subsystems_bilinker__str esult.state1, EndpointState::Ok);\n    }","start_line":387,"lang":"rust","xi":1,"yi":47},{"id":"crates/bilinker/src/check.rs@subsystems/bilinker/.stratum/impl#L430","label":"crates/bilinker/src/check.rs#L430","file_group_id":"fg_crates_bilinker_src_check_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/check.rs","content":"fn check_layer_chain_dirty_when_hash_differs() {\n        let dir = tempdir().unwrap();\n        let uuid = \"aaaabbbb-cccc-dddd-eeee-ffffaaaabbbb\";\n\n        // Adjacent bilink has structural hash \"current-hash\"\n        let adj_dir = dir.path().join(\".stratum/impl/.bilink\");\n        std::fs::create_dir_all(&adj_dir).unwrap();\n        let adj_bl = BiLinkFile {\n            uuid:    uuid.into(),\n            link0:   layer_endpoint(\"../..\"),\n            link1:   whole_file_endpoint(\"b.md\"),\n            hash0:   None, commit0: None,\n            hash1:   Some(\"current-hash\".into()),\n            commit1: Some(\"abc1234\".into()),\n            range0: None, range1: None,\n            state0: None, state1: None,\n            resolved_at: None,\n        };\n        adj_bl.write(&adj_dir.join(format!(\"{uuid}.bilink\"))).unwrap();\n\n        // Spec bilink stores a different (stale) hash\n        let bilink_dir = dir.path().join(\".bilink\");\n        let bl = BiLinkFile {\n            uuid:    uuid.into(),\n            link0:   whole_file_endpoint(\"a.md\"),\n            link1:   layer_endpoint(\".stratum/impl\"),\n            hash0:   None, commit0: None,\n            hash1:   Some(\"stale-hash-000\".into()),\n            commit1: Some(\"abc1234\".into()),\n            range0: None, range1: None,\n            state0: None, state1: None,\n            resolved_at: None,\n        };\n        let path = bilink_dir.join(format!(\"{uuid}.bilink\"));\n        bl.wri Path, PathBuf};\nuse anyhow::Result;\n\n#[derive(Debug, Default)]\npub struct Config {}\n\nimpl Config {\n    /// Find the project root by walking up from `dir` looking for `.bilink/`,\n    /// then falling back to the git root (`.git/`).\n    pub fn load_from(dir: &Path) -> Result<(PathBuf, Config)> {\n        let mut current = dir.to_path_buf();\n        loop {\n            if current.join(\".bilink\").is_dir() || current.join(\".git\").exists() {\n                return Ok((current, Config {}));\n            }\n            if !current.pop() {\n                return Ok((dir.to_path_buf(), Config {}));\n            }\n        }\n    }\n}","start_line":1,"lang":"rust","xi":1,"yi":51},{"id":"crates/bilinker/src/get.rs@subsystems/bilinker/.stratum/impl#L1","label":"crates/bilinker/src/get.rs","file_group_id":"fg_crates_bilinker_src_get_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/get.rs","content":"use std::path::Path;\nuse anyhow::{bail, Context, Result};\n\nuse crate::bilink::BiLinkFile;\nuse crate::grammar;\nuse crate::link::{LinkEndpoint, StructuralRef};\nuse crate::query;\nuse stratum::StratumPath;\n\npub struct GetResult {\n    pub content: String,\n    pub file: String,\n    pub start_line: usize,\n    pub end_line: usize,\n}\n\npub fn get(\n    root: &Path,\n    bilink_name: &str,\n    endpoint: u8,\n    before: Option<(usize, usize)>,\n    after: Option<(usize, usize)>,\n) -> Result<GetResult> {\n    let bilinker_dir = root.join(\".bilink\");\n    let (_, bl) = BiLinkFile::find_by_id(&bilinker_dir, bilink_name)?;\n\n    let link = match endpoint {\n        0 => &bl.link0,\n        1 => &bl.link1,\n        _ => bail!(\"endpoint must be 0 or 1\"),\n    };\n\n    match link {\n        LinkEndpoint::Structural(sref) => resolve(root, sref, before, after),\n        LinkEndpoint::Layer(layer_path) => {\n            traverse_layer(root, layer_path.clone(), &bl.uuid, before, after)\n        }\n        LinkEndpoint::Task(id) => bail!(\n            \"link.{endpoint} is a task reference ({id}) — use worklist to view it\"\n        ),\n    }\n}\n\nfn traverse_layer(\n    root: &Path,\n    layer_path: StratumPath,\n    uuid: &str,\n    before: Option<(usize, usize)>,\n    after: Option<(usize, usize)>,\n) -> Result<GetResult> {\n    let adjacent_root = stratum::resolve(root, root, &layer_path)\n        .map_err(|e| anyhow::anyhow!(\"resolving adjacent layer: {e}\"))?;\n\n    let adjacent_bilink_dir = adjacent_root.join(\".bilink\");\n    let (_, adjacent_bl) = BiLinkFile::find_by_id(&adjacent_bilink_dir, uuid)\n        .with_context(|| format!(\"bilink {uuid} not found in {}\", adjacent_bilink_dir.display()))?;\n\n    let sref = match (&adjacent_bl.link0, &adjacent_bl.link1) {\n        (LinkEndpoint::Structural(r), _) => r,\n        (_, LinkEndpoint::Structural(r)) => r,\n        _ => bail!(\"adjacent bilink {uuid} has no structural endpoint\"),\n    };\n\n    resolve(&adjacent_root, sref, before, after)\n}\n\nfn resolve(\n    root: &Path,\n    sref: &StructuralRef,\n    before: Option<(usize, usize)>,\n    after: Option<(usize, usize)>,\n) -> Result<GetResult> {\n    let file_path = root.join(&sref.file);\n    let source = std::fs::read_to_string(&file_path)\n        .with_context(|| format!(\"reading {}\", file_path.display()))?;\n\n    let Some(query_str) = &sref.query else {\n        let total = count_lines(&source);\n        return Ok(GetResult {\n            content: source,\n            file: sref.file.clone(),\n            start_line: 1,\n            end_line: total,\n        });\n    };\n\n    let lang = grammar::language_for_file(&sref.file);\n    let language = grammar::for_language(lang)?;\n\n    let (node_start, node_end) = query::find_target(language, &source, query_str)?\n        .with_context(|| format!(\"query matched nothing in {}\", sref.file))?;\n\n    let (frag_start, frag_end) = match &sref.range {\n        Some(r) => (node_start + r.start, (node_start + r.end).min(source.len())),\n        None    => (node_start, node_end),\n    };\n\n    let line_start = byte_to_line(&source, frag_start);\n    let line_end   = byte_to_line(&source, frag_end.saturating_sub(1));\n","start_line":1,"lang":"rust","xi":1,"yi":53},{"id":"crates/bilinker/src/get.rs@subsystems/bilinker/.stratum/impl#L17","label":"crates/bilinker/src/get.rs#L17","file_group_id":"fg_crates_bilinker_src_get_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/get.rs","content":"pub fn get(\n    root: &Path,\n    bilink_name: &str,\n    endpoint: u8,\n    before: Option<(usize, usize)>,\n    after: Option<(usize, usize)>,\n) -> Result<GetResult> {\n    let bilinker_dir = root.join(\".bilink\");\n    let (_, bl) = BiLinkFile::find_by_id(&bilinker_dir, bilink_name)?;\n\n    let link = match endpoint {\n        0 => &bl.link0,\n        1 => &bl.link1,\n        _ => bail!(\"endpoint must be 0 or 1\"),\n    };\n\n    match link {\n        LinkEndpoint::Structural(sref) => resolve(root, sref, before, after),\n        LinkEndpoint::Layer(layer_path) => {\n            traverse_layer(root, layer_path.clone(), &bl.uuid, before, after)\n        }\n        LinkEndpoint::Task(id) => bail!(\n            \"link.{endpoint} is a task reference ({id}) — use worklist to view it\"\n        ),\n    }\n}","start_line":17,"lang":"rust","xi":1,"yi":54},{"id":"crates/bilinker/src/grammar.rs@subsystems/bilinker/.stratum/impl#L1","label":"crates/bilinker/src/grammar.rs","file_group_id":"fg_crates_bilinker_src_grammar_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/grammar.rs","content":"use anyhow::{bail, Result};","start_line":1,"lang":"rust","xi":1,"yi":56},{"id":"crates/bilinker/src/index.rs@subsystems/bilinker/.stratum/impl#L1","label":"crates/bilinker/src/index.rs","file_group_id":"fg_crates_bilinker_src_index_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/index.rs","content":"use std::path::{Path, PathBuf};\nuse std::time::SystemTime;\nuse anyhow::Result;\n\nuse crate::bilink::BiLinkFile;\nuse crate::link::LinkEndpoint;\n\n#[derive(Debug, PartialEq)]\npub enum IndexStatus {\n    Ok,\n    Stale { stale_count: usize },\n    Missing,\n}\n\n/// Builds `.bilink/.index` for the given layer root and writes `.bilink/.gitignore`.\n/// Returns the number of entries written.\npub fn build(layer_root: &Path) -> Result<usize> {\n    let bilink_dir = layer_root.join(\".bilink\");\n    if !bilink_dir.exists() {\n        return Ok(0);\n    }\n\n    let mut out = String::new();\n    let mut count = 0;\n\n    for path in bilink_files_in(&bilink_dir) {\n        let Ok(bl) = BiLinkFile::load(&path) else { continue };\n        for (n, link) in [(0u8, &bl.link0), (1u8, &bl.link1)] {\n            if let LinkEndpoint::Structural(sref) = link {\n                out.push_str(&sref.file);\n                out.push('\\t');\n                out.push_str(&format!(\"{}.{n}\", bl.uuid));\n                out.push('\\n');\n                count += 1;\n            }\n        }\n    }\n\n    std::fs::write(bilink_dir.join(\".index\"), &out)?;\n    ensure_gitignore(&bilink_dir)?;\n\n    Ok(count)\n}\n\n/// Returns the status of `.bilink/.index` for the given layer root.\npub fn status(layer_root: &Path) -> Result<IndexStatus> {\n    let bilink_dir = layer_root.join(\".bilink\");\n    let index_path = bilink_dir.join(\".index\");\n\n    if !index_path.exists() {\n        return Ok(IndexStatus::Missing);\n    }\n\n    let index_mtime = mtime(&index_path)?;\n    let stale = bilink_files_in(&bilink_dir)\n        .iter()\n        .filter(|p| mtime(p).map(|m| m > index_mtime).unwrap_or(false))\n        .count();\n\n    if stale > 0 {\n        Ok(IndexStatus::Stale { stale_count: stale })\n    } else {\n        Ok(IndexStatus::Ok)\n    }\n}\n\n/// Looks up bilinks referencing `file` in the given layer.\n/// `file` is relative to `layer_root`.\n/// Uses `.bilink/.index` if valid; falls back to O(N) scan silently.\npub fn lookup(layer_root: &Path, file: &str) -> Result<Vec<(String, u8)>> {\n    let bilink_dir = layer_root.join(\".bilink\");\n    let index_path = bilink_dir.join(\".index\");\n\n    if index_path.exists() && index_is_valid(&bilink_dir, &index_path) {\n        lookup_from_index(&index_path, file)\n    } else {\n        lookup_scan(&bilink_dir, file)\n    }\n}\n\n/// Finds all layer roots (directories containing `.bilink/`) under `root`.\npub fn layer_roots(root: &Path) -> Vec<PathBuf> {\n    let mut result = Vec::new();\n    collect_layer_roots(root, &mut result);\n    result\n}\n\n// ── private ──────────────────────────────────────────────────────────────────\n\nfn collect_layer_roots(dir: &Path, out: &mut Vec<PathBuf>) {\n    if dir.join(\".bilink\").is_dir() {\n        out.push(dir.to_path_buf());\n    }\n    let Ok(entries) = std::fs::read_dir(dir) else { return };\n    for entry in entries.flatten() {\n        let path = entry.path();\n        if !path.is_dir() { continue; }\n        let name = path.file_name().and_then(|n| n.to_str()).unwrap_or(\"\");\n        if matches!(name, \"target\" | \"node_modules\" | \".git\") { continue; }\n        collect_layer_roots(&path, out);","start_line":1,"lang":"rust","xi":1,"yi":58},{"id":"crates/bilinker/src/index.rs@subsystems/bilinker/.stratum/impl#L17","label":"crates/bilinker/src/index.rs#L17","file_group_id":"fg_crates_bilinker_src_index_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/index.rs","content":"pub fn build(layer_root: &Path) -> Result<usize> {\n    let bilink_dir = layer_root.join(\".bilink\");\n    if !bilink_dir.exists() {\n        return Ok(0);\n    }\n\n    let mut out = String::new();\n    let mut count = 0;\n\n    for path in bilink_files_in(&bilink_dir) {\n        let Ok(bl) = BiLinkFile::load(&path) else { continue };\n        for (n, link) in [(0u8, &bl.link0), (1u8, &bl.link1)] {\n            if let LinkEndpoint::Structural(sref) = link {\n                out.push_str(&sref.file);\n                out.push('\\t');\n                out.push_str(&format!(\"{}.{n}\", bl.uuid));\n                out.push('\\n');\n                count += 1;\n            }\n        }\n    }\n\n    std::fs::write(bilink_dir.join(\".index\"), &out)?;\n    ensure_gitignore(&bilink_dir)?;\n\n    Ok(count)\n}","start_line":17,"lang":"rust","xi":1,"yi":59},{"id":"crates/bilinker/src/index.rs@subsystems/bilinker/.stratum/impl#L46","label":"crates/bilinker/src/index.rs#L46","file_group_id":"fg_crates_bilinker_src_index_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/index.rs","content":"pub fn status(layer_root: &Path) -> Result<IndexStatus> {\n    let bilink_dir = layer_root.join(\".bilink\");\n    let index_path = bilink_dir.join(\".index\");\n\n    if !index_path.exists() {\n        return Ok(IndexStatus::Missing);\n    }\n\n    let index_mtime = mtime(&index_path)?;\n    let stale = bilink_files_in(&bilink_dir)\n        .iter()\n        .filter(|p| mtime(p).map(|m| m > index_mtime).unwrap_or(false))\n        .count();\n\n    if stale > 0 {\n        Ok(IndexStatus::Stale { stale_count: stale })\n    } else {\n        Ok(IndexStatus::Ok)\n    }\n}","start_line":46,"lang":"rust","xi":1,"yi":60},{"id":"crates/bilinker/src/link.rs@subsystems/bilinker/.stratum/impl#L1","label":"crates/bilinker/src/link.rs","file_group_id":"fg_crates_bilinker_src_link_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/link.rs","content":"use std::fmt;\nuse std::str::FromStr;\nuse anyhow::{bail, Context};\nuse stratum::StratumPath;\n\n#[derive(Debug, Clone, PartialEq)]\npub enum EndpointState {\n    Pending,\n    Ok,\n    Todo,\n    Moved,\n    Displaced,\n    Reanchored,\n    Expanded,\n    Unanchored,\n    Altered,\n    Deleted,\n    Broken,\n    ChainDirty,\n}\n\nimpl fmt::Display for EndpointState {\n    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {\n        match self {\n            Self::Pending     => write!(f, \"PENDING\"),\n            Self::Ok          => write!(f, \"OK\"),\n            Self::Todo        => write!(f, \"TODO\"),\n            Self::Moved       => write!(f, \"MOVED\"),\n            Self::Displaced   => write!(f, \"DISPLACED\"),\n            Self::Reanchored  => write!(f, \"REANCHORED\"),\n            Self::Expanded    => write!(f, \"EXPANDED\"),\n            Self::Unanchored  => write!(f, \"UNANCHORED\"),\n            Self::Altered     => write!(f, \"ALTERED\"),\n            Self::Deleted     => write!(f, \"DELETED\"),\n            Self::Broken      => write!(f, \"BROKEN\"),\n            Self::ChainDirty  => write!(f, \"CHAIN_DIRTY\"),\n        }\n    }\n}\n\nimpl FromStr for EndpointState {\n    type Err = anyhow::Error;\n    fn from_str(s: &str) -> Result<Self, Self::Err> {\n        match s.trim() {\n            \"PENDING\"      => Ok(Self::Pending),\n            \"OK\"           => Ok(Self::Ok),\n            \"TODO\"         => Ok(Self::Todo),\n            \"MOVED\"        => Ok(Self::Moved),\n            \"DISPLACED\"    => Ok(Self::Displaced),\n            \"REANCHORED\"   => Ok(Self::Reanchored),\n            \"EXPANDED\"     => Ok(Self::Expanded),\n            \"UNANCHORED\"   => Ok(Self::Unanchored),\n            \"ALTERED\"      => Ok(Self::Altered),\n            \"DELETED\"      => Ok(Self::Deleted),\n            \"BROKEN\"       => Ok(Self::Broken),\n            \"CHAIN_DIRTY\"  => Ok(Self::ChainDirty),\n            other          => bail!(\"estado desconocido: '{other}'\"),\n        }\n    }\n}\n\n/// Returns the state as a string, or \"NONE\" if no state has been recorded yet.\npub fn state_str(state: &Option<EndpointState>) -> String {\n    state.as_ref().map_or_else(|| \"NONE\".to_string(), |s| s.to_string())\n}\n\n/// A parsed bilink endpoint: `file [:: query [:: start~end]]`\n/// or a stratum path pointing to a layer directory.\n///\n/// Disambiguation: if the string contains `::` it is always Structural.\n/// If it has no `::`, it is Structural when the last path component has a\n/// file extension (e.g. `spec.md`, `src/Foo.java`); otherwise it is a Layer.\n#[derive(Debug, Clone, PartialEq)]\npub enum LinkEndpoint {\n    Structural(StructuralRef),\n    Layer(StratumPath),\n    /// `task <id>` — references a worklist task at `<project-root>/.stratum/worklist/<id>.task`.\n    Task(String),\n}\n\n#[derive(Debug, Clone, PartialEq)]\npub struct StructuralRef {\n    pub file: String,\n    pub query: Option<String>,\n    pub range: Option<ByteRange>,\n}\n\n/// A bilink connects exactly two endpoints.\n#[derive(Debug, Clone)]\npub struct BiLink {\n    pub id: String,\n    pub link0: LinkEndpoint,\n    pub link1: LinkEndpoint,\n    pub hash0: Option<String>,\n    pub hash1: Option<String>,\n}\n\n#[derive(Debug, Clone, PartialEq)]\npub struct ByteRange {\n    pub start: usize,","start_line":1,"lang":"rust","xi":1,"yi":62},{"id":"crates/estrato-cli/src/main.rs@subsystems/stratum/.stratum/impl#L1","label":"crates/estrato-cli/src/main.rs","file_group_id":"fg_crates_estrato_cli_src_main_rs_subsystems_stratum__stratum_impl","layer_id":"L_subsystems_stratum__stratum_impl","layer":"subsystems/stratum/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/stratum/.stratum/impl/crates/estrato-cli/src/main.rs","content":"use clap::{Parser, Subcommand};\nuse stratum::{parse, parse_path, resolve, cwd_as_stratum_path, format_path, Context, Query};\nuse std::path::{Path, PathBuf};\nuse std::process;\n\n#[derive(Parser)]\n#[command(name = \"stratum\", about = \"Navegación y gestión de capas Stratum\")]\nstruct Cli {\n    #[command(subcommand)]\n    command: Option<Commands>,\n}\n\n#[derive(Subcommand)]\nenum Commands {\n    /// Muestra el path Stratum del directorio actual (desde *)\n    Pws,\n    /// Registra una nueva sub-capa con su repositorio git\n    Add {\n        /// Nombre de la sub-capa\n        name: String,\n        /// URL del repositorio git (ssh o https)\n        remote: String,\n        /// Rama (default: main)\n        #[arg(default_value = \"main\")]\n        branch: String,\n        /// Sobreescribir si ya existe\n        #[arg(long)]\n        force: bool,\n    },\n    /// Muestra el árbol de capas a partir de un path Stratum\n    Tree {\n        /// Path Stratum de inicio (default: *)\n        #[arg(default_value = \"*\")]\n        path: String,\n    },\n    /// Clona o actualiza las sub-capas declaradas en .stratum/\n    Pull {\n        /// Nombre de la sub-capa (sin especificar: todas)\n        name: Option<String>,\n        /// Procesar recursivamente todas las sub-capas\n        #[arg(long)]\n        recursive: bool,\n    },\n    /// Path Stratum o consulta de navegación\n    #[command(external_subcommand)]\n    Query(Vec<String>),\n}\n\nfn main() {\n    let cli = Cli::parse();\n\n    let cwd = std::env::current_dir().unwrap_or_else(|e| {\n        eprintln!(\"error: {e}\");\n        process::exit(1);\n    });\n\n    match cli.command {\n        None => {\n            let ctx = Context::from_dir(&cwd);\n            match ctx.up_path() {\n                Some(p) => println!(\"up:   {}  ({})\", ctx.depth, p),\n                None    => println!(\"up:   0\"),\n            }\n            if ctx.sub_layers.is_empty() {\n                println!(\"down: (ninguna)\");\n            } else {\n                println!(\"down: {}\", ctx.sub_layers.join(\"  \"));\n            }\n        }\n\n        Some(Commands::Pws) => {\n            match cwd_as_stratum_path(&cwd) {\n                Some(tokens) => println!(\"{}\", format_path(&tokens)),\n                None => { eprintln!(\"error: no se encontró raíz .git\"); process::exit(1); }\n            }\n        }\n\n        Some(Commands::Add { name, remote, branch, force }) => {\n            if let Err(e) = cmd_add(&cwd, &name, &remote, &branch, force) {\n                eprintln!(\"error: {e}\");\n                process::exit(1);\n            }\n        }\n\n        Some(Commands::Pull { name, recursive }) => {\n            if let Err(e) = cmd_pull(&cwd, name.as_deref(), recursive) {\n                eprintln!(\"error: {e}\");\n                process::exit(1);\n            }\n        }\n\n        Some(Commands::Tree { path }) => {\n            let tokens = match parse_path(&path) {\n                Ok(t)  => t,\n                Err(e) => { eprintln!(\"error: {e}\"); process::exit(2); }\n            };\n            let root = match resolve(&cwd, &cwd, &tokens) {\n                Ok(p)  => p,\n                Err(e) => { eprintln!(\"error: {e}\"); process::exit(1); }\n            };","start_line":1,"lang":"rust","xi":1,"yi":64},{"id":"crates/estrato-cli/src/main.rs@subsystems/stratum/.stratum/impl#L14","label":"crates/estrato-cli/src/main.rs#L14","file_group_id":"fg_crates_estrato_cli_src_main_rs_subsystems_stratum__stratum_impl","layer_id":"L_subsystems_stratum__stratum_impl","layer":"subsystems/stratum/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/stratum/.stratum/impl/crates/estrato-cli/src/main.rs","content":"enum Commands {\n    /// Muestra el path Stratum del directorio actual (desde *)\n    Pws,\n    /// Registra una nueva sub-capa con su repositorio git\n    Add {\n        /// Nombre de la sub-capa\n        name: String,\n        /// URL del repositorio git (ssh o https)\n        remote: String,\n        /// Rama (default: main)\n        #[arg(default_value = \"main\")]\n        branch: String,\n        /// Sobreescribir si ya existe\n        #[arg(long)]\n        force: bool,\n    },\n    /// Muestra el árbol de capas a partir de un path Stratum\n    Tree {\n        /// Path Stratum de inicio (default: *)\n        #[arg(default_value = \"*\")]\n        path: String,\n    },\n    /// Clona o actualiza las sub-capas declaradas en .stratum/\n    Pull {\n        /// Nombre de la sub-capa (sin especificar: todas)\n        name: Option<String>,\n        /// Procesar recursivamente todas las sub-capas\n        #[arg(long)]\n        recursive: bool,\n    },\n    /// Path Stratum o consulta de navegación\n    #[command(external_subcommand)]\n    Query(Vec<String>),\n}","start_line":14,"lang":"rust","xi":1,"yi":65},{"id":"crates/estrato-cli/src/main.rs@subsystems/stratum/.stratum/impl#L209","label":"crates/estrato-cli/src/main.rs#L209","file_group_id":"fg_crates_estrato_cli_src_main_rs_subsystems_stratum__stratum_impl","layer_id":"L_subsystems_stratum__stratum_impl","layer":"subsystems/stratum/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/stratum/.stratum/impl/crates/estrato-cli/src/main.rs","content":"fn cmd_pull(dir: &Path, name: Option<&str>, recursive: bool) -> anyhow::Result<()> {\n    let stratum_dir = dir.join(\".stratum\");\n    if !stratum_dir.exists() {\n        return Ok(());\n    }\n\n    let configs = read_layer_configs(&stratum_dir, name)?;\n    if configs.is_empty() && name.is_some() {\n        anyhow::bail!(\"sub-capa '{}' no encontrada en .stratum/\", name.unwrap());\n    }\n\n    for (layer_name, remote, branch) in configs {\n        let layer_dir = stratum_dir.join(&layer_name);\n\n        if layer_dir.exists() {\n            eprint!(\"pulling {}  \", layer_name);\n            let out = std::process::Command::new(\"git\")\n                .args([\"-C\", layer_dir.to_str().unwrap_or(\"\"), \"pull\", \"--ff-only\", \"origin\", &branch])\n                .output()?;\n            if out.status.success() {\n                let msg = String::from_utf8_lossy(&out.stdout);\n                let msg = msg.trim();\n                if msg.contains(\"Already up to date\") || msg.contains(\"Ya está actualizado\") {\n                    eprintln!(\"already up to date\");\n                } else {\n                    eprintln!(\"updated\");\n                }\n            } else {\n                eprintln!();\n                anyhow::bail!(\"git pull failed for {}: {}\", layer_name, String::from_utf8_lossy(&out.stderr));\n            }\n        } else {\n            eprintln!(\"pulling {}  {}  {}\", layer_name, remote, branch);\n            let status = std::process::Command::new(\"git\")\n                .args([\"clone\", \"--branch\", &branch, &remote, layer_dir.to_str().unwrap_or(\"\")])\n                .status()?;\n            if !status.success() {\n                anyhow::bail!(\"git clone failed for {}\", layer_name);\n            }\n            eprintln!(\"  cloned  {}/\", layer_dir.display());\n        }\n\n        if recursive {\n            cmd_pull(&layer_dir, None, true)?;\n        }\n    }\n\n    Ok(())\n}","start_line":209,"lang":"rust","xi":1,"yi":66},{"id":"crates/estrato-cli/src/main.rs@subsystems/stratum/.stratum/impl#L298","label":"crates/estrato-cli/src/main.rs#L298","file_group_id":"fg_crates_estrato_cli_src_main_rs_subsystems_stratum__stratum_impl","layer_id":"L_subsystems_stratum__stratum_impl","layer":"subsystems/stratum/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/stratum/.stratum/impl/crates/estrato-cli/src/main.rs","content":"fn cmd_add(\n    cwd: &Path,\n    name: &str,\n    remote: &str,\n    branch: &str,\n    force: bool,\n) -> anyhow::Result<()> {\n    if name.is_empty() || name.contains('/') || name.contains('\\\\') {\n        anyhow::bail!(\"nombre de capa inválido: '{name}'\");\n    }\n\n    let stratum_dir = cwd.join(\".stratum\");\n    std::fs::create_dir_all(&stratum_dir)?;\n\n    let config_path = stratum_dir.join(format!(\".{name}.toml\"));\n    if config_path.exists() && !force {\n        anyhow::bail!(\".stratum/.{name}.toml ya existe — usa --force para sobreescribir\");\n    }\n\n    let content = format!(\"remote = \\\"{remote}\\\"\\nbranch = \\\"{branch}\\\"\\n\");\n    std::fs::write(&config_path, &content)?;\n\n    eprintln!(\"creado: .stratum/.{name}.toml\");\n    Ok(())\n}","start_line":298,"lang":"rust","xi":1,"yi":67},{"id":"crates/stratum/src/path.rs@subsystems/stratum/.stratum/impl#L1","label":"crates/stratum/src/path.rs","file_group_id":"fg_crates_stratum_src_path_rs_subsystems_stratum__stratum_impl","layer_id":"L_subsystems_stratum__stratum_impl","layer":"subsystems/stratum/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/stratum/.stratum/impl/crates/stratum/src/path.rs","content":"use std::path::{Path, PathBuf};\n\n/// A single token in a stratum path expression.\n#[derive(Debug, PartialEq, Clone)]\npub enum PathToken {\n    Down(String),    // `>name`  — navigate into `.stratum/<name>`\n    Up,              // `<`      — go up one stratum level (`../..`)\n    Root,            // `<*`     — project root (nearest `.git` ancestor)\n    TopRoot,         // `*`      — outermost `.git` ancestor (top of the whole project)\n    Simple(PathBuf), // traditional path component — joined as-is\n}\n\n/// A parsed stratum path: a sequence of tokens.\n/// Tokens are resolved left to right.\npub type StratumPath = Vec<PathToken>;\n\n#[derive(Debug, PartialEq)]\npub enum ParseError {\n    Empty,\n    InvalidSegment(String),\n    InvalidSyntax(String),\n}\n\nimpl std::fmt::Display for ParseError {\n    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n        match self {\n            ParseError::Empty => write!(f, \"path vacío\"),\n            ParseError::InvalidSegment(s) => write!(f, \"segmento inválido: '{s}'\"),\n            ParseError::InvalidSyntax(s) => write!(f, \"sintaxis inválida: '{s}'\"),\n        }\n    }\n}\n\n/// Parses a stratum path string into a token sequence.\n///\n/// Rules:\n/// - Starts with `>`: sequence of `Down` tokens, terminated by a `/` which begins a `Simple`.\n/// - Starts with `<*`: `Root` token, followed by optional `Simple` and `Down` tokens.\n/// - Starts with `<`: sequence of `Up` tokens, terminated by a `/` which begins a `Simple`.\n/// - Starts with `*`: `TopRoot` token (outermost `.git`), followed by optional `Simple`/`Down`.\n/// - Anything else: a single `Simple` token (traditional path, returned as-is).\npub fn parse_path(s: &str) -> Result<StratumPath, ParseError> {\n    if s.is_empty() {\n        return Err(ParseError::Empty);\n    }\n\n    if s.starts_with('>') {\n        return parse_down_tokens(s);\n    }\n\n    // `<*` must be checked before `<` to avoid consuming the `*`\n    if s.starts_with(\"<*\") {\n        return parse_root_token(s);\n    }\n\n    if s.starts_with('<') {\n        return parse_up_tokens(s);\n    }\n\n    if s.starts_with('*') {\n        return parse_top_root_token(s);\n    }\n\n    Ok(vec![PathToken::Simple(PathBuf::from(s))])\n}\n\n/// Formats a `StratumPath` back to its string representation.\npub fn format_path(tokens: &StratumPath) -> String {\n    let mut s = String::new();\n    for token in tokens {\n        match token {\n            PathToken::Down(name) => { s.push('>'); s.push_str(name); }\n            PathToken::Up        => s.push('<'),\n            PathToken::Root      => s.push_str(\"<*\"),\n            PathToken::TopRoot   => s.push('*'),\n            PathToken::Simple(p) => s.push_str(&p.display().to_string()),\n        }\n    }\n    s\n}\n\nfn parse_root_token(s: &str) -> Result<StratumPath, ParseError> {\n    // s starts with \"<*\"\n    let rest = &s[2..];\n    let mut tokens = vec![PathToken::Root];\n\n    if rest.is_empty() {\n        return Ok(tokens);\n    }\n\n    if rest.starts_with('/') {\n        if let Some(gt_pos) = rest.find('>') {\n            let simple_part = &rest[..gt_pos];\n            let down_part   = &rest[gt_pos..]; // starts with '>'\n            if !simple_part.is_empty() && simple_part != \"/\" {\n                tokens.push(PathToken::Simple(PathBuf::from(simple_part)));\n            }\n            tokens.extend(parse_down_tokens(down_part)?);\n        } else {\n            tokens.push(PathToken::Simple(PathBuf::from(rest)));","start_line":1,"lang":"rust","xi":1,"yi":69},{"id":"crates/stratum/src/up.rs@subsystems/stratum/.stratum/impl#L1","label":"crates/stratum/src/up.rs","file_group_id":"fg_crates_stratum_src_up_rs_subsystems_stratum__stratum_impl","layer_id":"L_subsystems_stratum__stratum_impl","layer":"subsystems/stratum/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/stratum/.stratum/impl/crates/stratum/src/up.rs","content":"use std::path::{Path, PathBuf};\n\n#[derive(Debug, PartialEq)]\npub enum UpError {\n    InsufficientDepth { requested: usize, actual: usize },\n}\n\nimpl std::fmt::Display for UpError {\n    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n        match self {\n            UpError::InsufficientDepth { requested, actual } => write!(\n                f,\n                \"profundidad insuficiente: se pidieron {requested} niveles, actual {actual}\"\n            ),\n        }\n    }\n}\n\n/// Counts how many stratum levels deep `path` is by scanning for `.stratum/<name>` pairs.\npub fn depth(path: &Path) -> usize {\n    let components: Vec<_> = path.components().collect();\n    let mut count = 0;\n    let mut i = 0;\n    while i + 1 < components.len() {\n        let a = components[i].as_os_str();\n        let b = components[i + 1].as_os_str();\n        if a == \".stratum\" && !b.is_empty() && b != \".stratum\" {\n            count += 1;\n            i += 2;\n        } else {\n            i += 1;\n        }\n    }\n    count\n}\n\n/// Returns a relative path going up `levels` stratum levels (each = `../..`),\n/// appending `suffix` if provided. Validates that depth >= levels.\npub fn resolve_up(\n    current: &Path,\n    levels: usize,\n    suffix: Option<&Path>,\n) -> Result<PathBuf, UpError> {\n    if levels == 0 {\n        return Err(UpError::InsufficientDepth { requested: 0, actual: depth(current) });\n    }\n    let actual = depth(current);\n    if levels > actual {\n        return Err(UpError::InsufficientDepth { requested: levels, actual });\n    }\n    let mut path = PathBuf::new();\n    for _ in 0..levels {\n        path = path.join(\"..\").join(\"..\");\n    }\n    if let Some(s) = suffix {\n        path = path.join(s);\n    }\n    Ok(path)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    fn p(s: &str) -> PathBuf { PathBuf::from(s) }\n\n    #[test]\n    fn depth_root() { assert_eq!(depth(&p(\"/home/user/project\")), 0); }\n\n    #[test]\n    fn depth_one() { assert_eq!(depth(&p(\"/project/.stratum/impl\")), 1); }\n\n    #[test]\n    fn depth_two() {\n        assert_eq!(depth(&p(\"/project/.stratum/tech/.stratum/impl\")), 2);\n    }\n\n    #[test]\n    fn up_one() {\n        assert_eq!(resolve_up(&p(\"/project/.stratum/impl\"), 1, None).unwrap(), p(\"../..\"));\n    }\n\n    #[test]\n    fn up_two() {\n        let result = resolve_up(&p(\"/project/.stratum/tech/.stratum/impl\"), 2, None).unwrap();\n        assert_eq!(result, p(\"../../../..\"));\n    }\n\n    #[test]\n    fn up_with_suffix() {\n        let result =\n            resolve_up(&p(\"/project/.stratum/impl\"), 1, Some(Path::new(\"src/main.rs\"))).unwrap();\n        assert_eq!(result, p(\"../../src/main.rs\"));\n    }\n\n    #[test]\n    fn up_exceeds_depth() {\n        let err = resolve_up(&p(\"/project/.stratum/impl\"), 3, None).unwrap_err();\n        assert!(matches!(err, UpError::InsufficientDepth { requested: 3, actual: 1 }));\n    }","start_line":1,"lang":"rust","xi":1,"yi":71}],"edges":[{"id":"e_00ff94ed_commands","source":"commands/accept.md@subsystems/bilinker#L21","target":"crates/bilinker/src/accept.rs@subsystems/bilinker/.stratum/impl#L24","label":"00ff94ed","states":"OK↔OK","link0":"commands/accept.md :: (section (atx_heading (inline) @n0 (#eq? @n0 \"Comando: `bilinker accept`\")) (section (atx_heading (inline) @n1 (#eq? @n1 \"Comportamiento\"))) @target)","link1":"crates/bilinker/src/accept.rs :: (function_item name: (identifier) @n0 (#eq? @n0 \"accept\")) @target"},{"id":"e_0626602e_commands","source":"commands/apply.md@subsystems/bilinker#L1","target":"crates/bilinker-cli/src/main.rs@subsystems/bilinker/.stratum/impl#L1","label":"0626602e","states":"OK↔OK","link0":"commands/apply.md","link1":"crates/bilinker-cli/src/main.rs"},{"id":"e_09b88fe0_scenario","source":"scenarios/chain.yaml@subsystems/bilinker#L49","target":"crates/bilinker-cli/tests/integration.rs@subsystems/bilinker/.stratum/impl#L286","label":"09b88fe0","states":"OK↔OK","link0":"scenarios/chain.yaml :: (block_sequence_item (block_node (block_mapping (block_mapping_pair key: (flow_node) @_ (#eq? @_ \"id\") value: (flow_node) @n0 (#eq? @n0 \"chain-status-shows-nodes\"))))) @target","link1":"crates/bilinker-cli/tests/integration.rs :: (function_item name: (identifier) @n0 (#eq? @n0 \"chain_status_shows_nodes\")) @target"},{"id":"e_12df224a_scenario","source":"scenarios/chain.yaml@subsystems/bilinker#L39","target":"crates/bilinker-cli/tests/integration.rs@subsystems/bilinker/.stratum/impl#L266","label":"12df224a","states":"OK↔OK","link0":"scenarios/chain.yaml :: (block_sequence_item (block_node (block_mapping (block_mapping_pair key: (flow_node) @_ (#eq? @_ \"id\") value: (flow_node) @n0 const COL = 540, ROW = 90;
const elements = [];

G.layers.forEach(l =>
  elements.push({ data: { id: l.id, label: l.label, type: 'layer' } })
);

G.file_groups.forEach(fg =>
  elements.push({ data: { id: fg.id, label: fg.label, parent: fg.layer_id, type: 'file-group' } })
);

// Group layers by depth and assign vertical bands
const layerOrder = {};
const depthGroups = {};
G.layers.forEach(l => {
  if (!depthGroups[l.depth]) depthGroups[l.depth] = [];
  depthGroups[l.depth].push(l.id);
});

// Count nodes per layer to compute band heights
const nodesPerLayer = {};
G.nodes.forEach(n => { nodesPerLayer[n.layer_id] = (nodesPerLayer[n.layer_id] || 0) + 1; });

// Assign a y-band start offset to each layer within its depth column
const layerYStart = {};
Object.keys(depthGroups).sort().forEach(depth => {
  let offset = 0;
  depthGroups[depth].forEach(lid => {
    layerYStart[lid] = offset;
    offset += ((nodesPerLayer[lid] || 1) + 2) * ROW; // +2 rows gap between layers
  });
});

const yIdx = {};
G.nodes.forEach(n => {
  const k = n.layer_id;
  yIdx[k] = yIdx[k] || 0;
  const y = (layerYStart[n.layer_id] || 0) + yIdx[k]++ * ROW;
  elements.push({
    data: { id: n.id, label: n.label, parent: n.file_group_id, type: 'file',
            abs_path: n.abs_path, content: n.content, layer: n.layer,
            start_line: n.start_line, lang: n.lang },
    position: { x: n.xi * COL, y: y }
  });
});

G.edges.forEach(e =>
  elements.push({ data: { id: e.id, source: e.source, target: e.target,
                          label: e.label + '\n' + e.states,
                          uuid: e.label, states: e.states,
                          link0: e.link0, link1: e.link1 } })
);

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements,
  style: [
    { selector: 'node[type="layer"]', style: {
        'background-color': 'rgba(255,255,255,0.03)', 'background-opacity': 1,
        'border-color': '#30363d', 'border-style': 'dashed', 'border-width': 2,
        'label': 'data(label)', 'text-valign': 'top', 'text-halign': 'center',
        'color': '#6e7681', 'font-family': 'Courier New', 'font-size': 12, 'padding': 28 }},
    { selector: 'node[type="file-group"]', style: {
        'background-color': 'rgba(31,111,235,0.07)', 'background-opacity': 1,
        'border-color': '#1f6feb', 'border-style': 'solid', 'border-width': 1,
        'label': 'data(label)', 'text-valign': 'top', 'text-halign': 'center',
        'color': '#58a6ff', 'font-family': 'Courier New', 'font-size': 10, 'padding': 14 }},
    { selector: 'node[type="file"]', style: {
        'shape': 'round-rectangle', 'background-color': '#161b22',
        'border-color': '#1f6feb', 'border-width': 1.5,
        'label': 'data(label)', 'text-valign': 'center',
        'color': '#c9d1d9', 'font-family': 'Courier New', 'font-size': 11,
        'padding': 10, 'width': 'label', 'cursor': 'pointer' }},
    { selector: 'node[type="file"]:selected', style: {
        'border-color': '#58a6ff', 'border-width': 2.5, 'background-color': '#1c2938' }},
    { selector: 'edge', style: {
        'curve-style': 'bezier', 'target-arrow-shape': 'triangle', 'source-arrow-shape': 'triangle',
        'label': 'data(label)', 'color': '#8b949e', 'font-family': 'Courier New', 'font-size': 9,
        'text-background-color': '#0d1117', 'text-background-opacity': 0.85, 'text-background-padding': 3,
        'line-color': '#30363d', 'target-arrow-color': '#30363d', 'source-arrow-color': '#30363d',
        'width': 1.5, 'text-wrap': 'wrap' }},
    { selector: 'edge:selected', style: {
        'line-color': '#1f6feb', 'target-arrow-color': '#1f6feb', 'source-arrow-color': '#1f6feb' }}
  ],
  layout: { name: 'preset' }
});

cy.fit(undefined, 40);

function renderNode(n) {
  if (!n) return '<div class="hint">(no content)</div>';
  const rel = n.abs_path ? relUrl(n.abs_path, n.start_line) : '';
  const url = rel ? `<a class="open-link" href="${rel}" target="_blank">Open file</a>` : '';
  const txt = n.content || '(no content)';
  let contentHtml;
  if (n.lang === 'markdown') {
    contentHtml = `<div class="md-wrap">${marked.parse(txt)}</div>`;
    setTimeout(() => mermaid.run({ querySelector: '#panel .mermaid' }), 50);
  } else {
    const lang  = n.lang || 'plaintext';
    const hl    = hljs.highlight(txt, { language: lang, ignoreIllegals: true });
    const count = txt.split('\n').length;
    const start = n.start_line || 1;
    const nums  = Array.from({ length: count }, (_, i) => start + i).join('\n');
    contentHtml = `<div class="code-wrap"><div class="line-nums">${nums}</div><pre><code class="hljs language-${lang}">${hl.value}</code></pre></div>`;
  }
  return `<div class="ntitle">${esc(n.label)}</div><div class="nlayer">${esc(n.layer)}</div>${url}${contentHtml}`;
}

cy.on('tap', 'node[type="file"]', evt => {
  const n = evt.target.data();
  document.getElementById('panel').innerHTML = renderNode(n);
});

cy.on('tap', 'edge', evt => {
  const e      = evt.target.data();
  const src    = cy.getElementById(e.source).data();
  const tgt    = cy.getElementById(e.target).data();
  const uuid   = e.uuid   || e.label || '';
  const states = e.states || '';
  const link0  = e.link0  || '';
  const link1  = e.link1  || '';
  document.getElementById('panel').innerHTML = `
    <div class="frag-label">link.0 — <code style="color:#a5d6ff;font-size:10px;word-break:break-all">${esc(link0)}</code></div>
    ${renderNode(src)}
    <div class="bilink-sep">
      <div class="bilink-sep-line"></div>
      <div class="bilink-sep-label">${esc(uuid)} · ${esc(states)}</div>
      <div class="bilink-sep-line"></div>
    </div>
    <div class="frag-label">link.1 — <code style="color:#a5d6ff;font-size:10px;word-break:break-all">${esc(link1)}</code></div>
    ${renderNode(tgt)}`;
  setTimeout(() => mermaid.run({ querySelector: '#panel .mermaid' }), 50);
});

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function relUrl(absPath, startLine) {
  const htmlDir = window.location.pathname.replace(/\/[^\/]*$/, '');
  const h = htmlDir.split('/').filter(Boolean);
  const f = absPath.split('/').filter(Boolean);
  let i = 0;
  while (i < h.length && i < f.length && h[i] === f[i]) i++;
  const rel = '../'.repeat(h.length - i) + f.slice(i).join('/');
  const frag = startLine > 1 ? '#L' + startLine : '';
  return rel + frag;
}
</script>
</body>
</html>
