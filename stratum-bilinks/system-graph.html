yaml","xi":0,"yi":58},{"id":"scenarios/chain.yaml@subsystems/bilinker#L17","label":"scenarios/chain.yaml#L17","file_group_id":"fg_scenarios_chain_yaml_subsystems_bilinker","layer_id":"L_subsystems_bilinker","layer":"subsystems/bilinker","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/scenarios/chain.yaml","content":"- id: chain-new-file-endpoint-no-pos\n    description: tip sin posición captura el archivo completo\n    given:\n      - archivo existente con historial git\n    when:\n      - bilinker chain new --tip \"commands/check.md\" --tip \">impl/src/check.rs\"\n    expect:\n      - link.0 = \"commands/check.md\" (sin query)\n      - link.1 = \"crates/.../check.rs\" (sin query)\n    impl: chain_new_direct_link_creates_single_file","start_line":17,"lang":"yaml","xi":0,"yi":59},{"id":"scenarios/chain.yaml@subsystems/bilinker#L39","label":"scenarios/chain.yaml#L39","file_group_id":"fg_scenarios_chain_yaml_subsystems_bilinker","layer_id":"L_subsystems_bilinker","layer":"subsystems/bilinker","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/scenarios/chain.yaml","content":"- id: chain-list-shows-all\n    description: chain list enumera todos los UUIDs del proyecto\n    given:\n      - varios bilinks creados\n    when:\n      - bilinker chain list\n    expect:\n      - una línea por UUID con count de nodos y estado\n    impl: chain_list_shows_created_chain","start_line":39,"lang":"yaml","xi":0,"yi":60},{"id":"scenarios/chain.yaml@subsystems/bilinker#L49","label":"scenarios/chain.yaml#L49","file_group_id":"fg_scenarios_chain_yaml_subsystems_bilinker","layer_id":"L_subsystems_bilinker","layer":"subsystems/bilinker","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/scenarios/chain.yaml","content":"- id: chain-status-shows-nodes\n    description: chain status muestra todos los nodos de una cadena\n    given:\n      - cadena con 2 nodos creada y chequeada\n    when:\n      - bilinker chain status <uuid>\n    expect:\n      - una sección por nodo con link.0, link.1 y estados\n    impl: chain_status_shows_nodes","start_line":49,"lang":"yaml","xi":0,"yi":61},{"id":"scenarios/check.yaml@subsystems/bilinker#L15","label":"scenarios/check.yaml#L15","file_group_id":"fg_scenarios_check_yaml_subsystems_bilinker","layer_id":"L_subsystems_bilinker","layer":"subsystems/bilinker","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/scenarios/check.yaml","content":"- id: check-ok-after-accept\n    description: Un bilink aceptado reporta OK cuando el contenido no cambió\n    given:\n      - bilink creado y ambos endpoints aceptados\n      - archivo no modificado desde el accept\n    when:\n      - bilinker check .\n    expect:\n      state: [OK, OK]\n    impl: check_whole_file_ok_when_hash_matches","start_line":15,"lang":"yaml","xi":0,"yi":63},{"id":"scenarios/check.yaml@subsystems/bilinker#L26","label":"scenarios/check.yaml#L26","file_group_id":"fg_scenarios_check_yaml_subsystems_bilinker","layer_id":"L_subsystems_bilinker","layer":"subsystems/bilinker","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/scenarios/check.yaml","content":"- id: check-altered-structural\n    description: Endpoint estructural reporta ALTERED cuando el contenido del fragmento cambia\n    given:\n      - bilink aceptado con hash registrado\n      - contenido del archivo modificado dentro del fragmento vinculado\n    when:\n      - bilinker check .\n    expect:\n      state: [ALTERED, OK]\n    impl: check_whole_file_altered_when_hash_differs","start_line":26,"lang":"yaml","xi":0,"yi":64},{"id":"scenarios/check.yaml@subsystems/bilinker#L37","label":"scenarios/check.yaml#L37","file_group_id":"fg_scenarios_check_yaml_subsystems_bilinker","layer_id":"L_subsystems_bilinker","layer":"subsystems/bilinker","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/scenarios/check.yaml","content":"- id: check-chain-dirty-propagation\n    description: Nodo layer detecta CHAIN_DIRTY cuando el bilink adyacente fue re-aceptado\n    given:\n      - cadena spec ↔ impl con ambos lados OK\n      - impl endpoint re-aceptado con nuevo hash\n    when:\n      - bilinker check . (desde spec layer)\n    expect:\n      state: [OK, CHAIN_DIRTY]\n    impl: check_layer_chain_dirty_when_hash_differs","start_line":37,"lang":"yaml","xi":0,"yi":65},{"id":"scenarios/check.yaml@subsystems/bilinker#L48","label":"scenarios/check.yaml#L48","file_group_id":"fg_scenarios_check_yaml_subsystems_bilinker","layer_id":"L_subsystems_bilinker","layer":"subsystems/bilinker","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/scenarios/check.yaml","content":"- id: check-pending-layer-exists\n    description: Endpoint layer reporta PENDING cuando la capa existe pero no fue aceptada\n    given:\n      - bilink con endpoint layer apuntando a capa existente\n      - hash.N ausente\n    when:\n      - bilinker check .\n    expect:\n      state: [PENDING, PENDING]\n    impl: check_layer_first_time_is_pending","start_line":48,"lang":"yaml","xi":0,"yi":66},{"id":"scenarios/check.yaml@subsystems/bilinker#L59","label":"scenarios/check.yaml#L59","file_group_id":"fg_scenarios_check_yaml_subsystems_bilinker","layer_id":"L_subsystems_bilinker","layer":"subsystems/bilinker","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/scenarios/check.yaml","content":"- id: check-todo-layer-missing\n    description: Endpoint layer reporta TODO cuando la capa apuntada no existe\n    given:\n      - bilink con endpoint layer apuntando a capa no creada\n    when:\n      - bilinker check .\n    expect:\n      state: [PENDING, TODO]\n    impl: check_layer_todo_when_adjacent_missing_and_no_hash","start_line":59,"lang":"yaml","xi":0,"yi":67},{"id":"scenarios/check.yaml@subsystems/bilinker#L69","label":"scenarios/check.yaml#L69","file_group_id":"fg_scenarios_check_yaml_subsystems_bilinker","layer_id":"L_subsystems_bilinker","layer":"subsystems/bilinker","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/scenarios/check.yaml","content":"- id: check-broken-file-missing\n    description: Endpoint estructural reporta BROKEN cuando el archivo referenciado no existe\n    given:\n      - bilink aceptado con archivo existente\n      - archivo eliminado del filesystem\n    when:\n      - bilinker check .\n    expect:\n      state: [BROKEN, OK]\n    impl: check_structural_broken_when_file_missing","start_line":69,"lang":"yaml","xi":0,"yi":68},{"id":"scenarios/get.yaml@subsystems/bilinker#L5","label":"scenarios/get.yaml#L5","file_group_id":"fg_scenarios_get_yaml_subsystems_bilinker","layer_id":"L_subsystems_bilinker","layer":"subsystems/bilinker","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/scenarios/get.yaml","content":"- id: get-by-uuid-structural\n    description: get <uuid>.N muestra el contenido del fragmento estructural\n    given:\n      - bilink aceptado con endpoint estructural\n    when:\n      - bilinker get <uuid>.0\n    expect:\n      - stdout contiene el texto del fragmento\n      - stderr contiene \"# <file>  lines <start>–<end>\"\n    impl: get_content_matches_sed_selection","start_line":5,"lang":"yaml","xi":0,"yi":70},{"id":"scenarios/get.yaml@subsystems/bilinker#L26","label":"scenarios/get.yaml#L26","file_group_id":"fg_scenarios_get_yaml_subsystems_bilinker","layer_id":"L_subsystems_bilinker","layer":"subsystems/bilinker","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/scenarios/get.yaml","content":"- id: get-by-file-returns-bilinks\n    description: get <file> lista todos los bilinks que referencian ese archivo\n    given:\n      - bilink chequeado con endpoint en archivo conocido\n    when:\n      - bilinker get <file>\n    expect:\n      - línea por endpoint: \"<uuid>.<N>  <otro-endpoint>  bytes <start>–<end>\"\n    impl: get_by_file_returns_bilink_after_check","start_line":26,"lang":"yaml","xi":0,"yi":71},{"id":"scenarios/index.yaml@subsystems/bilinker#L5","label":"scenarios/index.yaml#L5","file_group_id":"fg_scenarios_index_yaml_subsystems_bilinker","layer_id":"L_subsystems_bilinker","layer":"subsystems/bilinker","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/scenarios/index.yaml","content":"- id: index-build-creates-file\n    description: index build genera .bilink/.index con entradas tab-separadas\n    given:\n      - directorio .bilink/ con bilinks existentes\n    when:\n      - bilinker index build\n    expect:\n      - .bilink/.index creado\n      - cada línea: \"<file>\\t<uuid>.<N>\"\n    impl: index_build_creates_index_file","start_line":5,"lang":"yaml","xi":0,"yi":73},{"id":"scenarios/index.yaml@subsystems/bilinker#L16","label":"scenarios/index.yaml#L16","file_group_id":"fg_scenarios_index_yaml_subsystems_bilinker","layer_id":"L_subsystems_bilinker","layer":"subsystems/bilinker","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/scenarios/index.yaml","content":"- id: index-gitignore-updated\n    description: index build agrega .index a .bilink/.gitignore\n    given:\n      - directorio .bilink/ sin .gitignore\n    when:\n      - bilinker index build\n    expect:\n      - .bilink/.gitignore contiene \".index\"\n      - .bilink/.gitignore contiene \".pending/\"\n    impl: index_gitignore_contains_index_entry","start_line":16,"lang":"yaml","xi":0,"yi":74},{"id":"scenarios/index.yaml@subsystems/bilinker#L27","label":"scenarios/index.yaml#L27","file_group_id":"fg_scenarios_index_yaml_subsystems_bilinker","layer_id":"L_subsystems_bilinker","layer":"subsystems/bilinker","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/scenarios/index.yaml","content":"- id: index-status-ok-after-build\n    description: index status reporta OK cuando el índice está actualizado\n    given:\n      - .bilink/.index construido y sin cambios en .bilink/ desde entonces\n    when:\n      - bilinker index status\n    expect:\n      - salida: \"OK\"\n      - exit code: 0\n    impl: index_status_ok_after_build","start_line":27,"lang":"yaml","xi":0,"yi":75},{"id":"commands/add.md@subsystems/stratum#L1","label":"commands/add.md","file_group_id":"fg_commands_add_md_subsystems_stratum","layer_id":"L_subsystems_stratum","layer":"subsystems/stratum","abs_path":"/home/anibal/Workspace/accreta/subsystems/stratum/commands/add.md","content":"# Especificación: `stratum add`\n\n## Propósito\n\nRegistra una nueva sub-capa declarando su repositorio git. Crea el archivo\n`.<nombre>.toml` en `.stratum/` del directorio actual. No clona el repositorio\n— solo deja el mapa para que `stratum pull` lo haga después.\n\n## Sintaxis\n\n```\nstratum add <nombre> <remote> [branch]\n```\n\n| Argumento | Descripción |\n|-----------|-------------|\n| `<nombre>` | Nombre de la sub-capa (debe ser un identificador válido de directorio) |\n| `<remote>` | URL del repositorio git (ssh o https) |\n| `[branch]` | Rama a usar. Default: `main` |\n\n## Ejemplo\n\n```bash\n# Parado en bilinker/\nstratum add impl git@github.com:anibalanto/bilinker.git main\n# → crea .stratum/.impl.toml\n\n# Con branch explícita\nstratum add tech-decisions git@github.com:org/td.git develop\n```\n\n## Archivo creado\n\n`.stratum/.<nombre>.toml`:\n\n```toml\nremote = \"git@github.com:anibalanto/bilinker.git\"\nbranch = \"main\"\n```\n\nSi `.stratum/` no existe, se crea automáticamente.\n\n## Errores\n\n| Condición | Mensaje | Código |\n|-----------|---------|--------|\n| `.stratum/.<nombre>.toml` ya existe | `ya existe — usa --force para sobreescribir` | 1 |\n| `<nombre>` vacío o inválido | `nombre de capa inválido` | 2 |\n\n## Propiedades\n\n- **Idempotente con `--force`**: sobreescribe el `.toml` existente.\n- **No clona**: solo registra. Ver `stratum pull` para clonar.\n- **Crea `.stratum/`** si no existe.","start_line":1,"lang":"markdown","xi":0,"yi":77},{"id":"commands/estrato.md@subsystems/stratum#L1","label":"commands/estrato.md","file_group_id":"fg_commands_estrato_md_subsystems_stratum","layer_id":"L_subsystems_stratum","layer":"subsystems/stratum","abs_path":"/home/anibal/Workspace/accreta/subsystems/stratum/commands/estrato.md","content":"# Especificación: comandos `stratum`\n\n## Propósito\n\nCLI de navegación por el árbol de capas de un proyecto Stratum. Permite obtener paths hacia capas superiores e inferiores desde la posición actual, y visualizar el contexto de profundidad en el árbol.\n\nEl argumento es un path Stratum — ver [paths.md](paths.md) para la gramática completa.\n\nEl argumento de navegación se pasa siempre entre comillas simples porque contiene caracteres especiales del shell (`>`, `<`):\n\n```bash\ncd $(stratum '>tech-decisions>impl')\ncd $(stratum '<<')\n```\n\n## Sintaxis general\n\n```\nstratum '<query>'\n```\n\nUna query es una secuencia de operadores `>` y `<` que describe una navegación relativa en el árbol de capas.\n\n## Operadores\n\n### `>` — bajar una capa\n\n`>name` desciende a la sub-capa `name` dentro del directorio `.stratum/` actual. Varios `>` encadenados descienden múltiples niveles:\n\n```\n'>tech-decisions'              →  .stratum/tech-decisions\n'>tech-decisions>impl'         →  .stratum/tech-decisions/.stratum/impl\n'>a>b>c'                       →  .stratum/a/.stratum/b/.stratum/c\n```\n\n**Validación:** cada segmento del path resultante debe existir en el filesystem. Si algún segmento no existe, imprime error a stderr y sale con código 1.\n\n### `<` — subir una capa\n\nCada `<` sube un nivel Stratum (equivale a `../..` en el filesystem, ya que cada capa ocupa dos directorios: `.stratum/<nombre>/`). Varios `<` encadenados suben múltiples niveles:\n\n```\n'<'    →  ../..\n'<<'   →  ../../../..\n'<<<'  →  ../../../../../../\n```\n\n**Validación:** la cantidad de `<` no puede superar la profundidad actual en el árbol. Si se intenta subir más niveles de los disponibles, imprime error a stderr y sale con código 1.\n\n### `>?` — consultar capas disponibles hacia abajo\n\nLista los nombres de las sub-capas disponibles en `.stratum/` del directorio actual.\n\n```\n'>?'   →  impl  tech-decisions\n```\n\nSi no existe `.stratum/` en el directorio actual, retorna lista vacía.\n\n### `<?` — consultar profundidad hacia arriba\n\nIndica cuántos niveles Stratum hay por encima de la posición actual.\n\n```\n'<?'   →  2\n```\n\n## Sin argumentos\n\nMuestra el contexto completo de la posición actual: profundidad y sub-capas.\n\n```\n$ stratum\nup:   2  (../../../..)\ndown: impl  tech-decisions\n```\n\n```\n$ stratum\nup:   0\ndown: stratum  bilinker\n```\n\n```\n$ stratum\nup:   1  (../..)\ndown: (ninguna)\n```\n\n## Ejemplos de uso\n\n```bash\n# Navegar a una sub-capa\ncd $(stratum '>tech-decisions>impl')\n\n# Volver dos niveles arriba\ncd $(stratum '<<')\n\n# Ver qué sub-capas hay disponibles\nstratum '>?'","start_line":1,"lang":"markdown","xi":0,"yi":79},{"id":"commands/pull.md@subsystems/stratum#L1","label":"commands/pull.md","file_group_id":"fg_commands_pull_md_subsystems_stratum","layer_id":"L_subsystems_stratum","layer":"subsystems/stratum","abs_path":"/home/anibal/Workspace/accreta/subsystems/stratum/commands/pull.md","content":"# Comando: `stratum pull`\n\nClona o actualiza las subcapas declaradas en los archivos `.<nombre>.toml` del directorio `.stratum/` actual.\n\n## Uso\n\n```\nstratum pull [<nombre>] [--recursive]\n```\n\n| Argumento / Flag | Descripción |\n|-----------------|-------------|\n| `<nombre>` | Nombre de una subcapa específica. Sin este argumento, procesa todas las subcapas del `.stratum/` actual. |\n| `--recursive` | Procesa también los `.stratum/` de las subcapas clonadas, en profundidad. |\n\n## Comportamiento\n\nPara cada subcapa con `.toml` encontrado:\n\n1. Si el directorio de la subcapa **no existe**: clona el repo declarado en `repo`\n   a la rama `branch`, aplicando `sparse` y `depth` si están presentes.\n2. Si el directorio **ya existe**: ejecuta `git fetch` + `git checkout` a la rama\n   declarada. No destruye cambios locales — falla si hay conflicto.\n\n## Ejemplos\n\n```bash\n# Clonar todas las subcapas del .stratum/ actual\nstratum pull\n\n# Clonar solo tech-decisions\nstratum pull technical-decisions\n\n# Clonar todas las subcapas en todo el árbol recursivamente\nstratum pull --recursive\n\n# Actualizar impl ya clonada\ncd .stratum/technical-decisions\nstratum pull impl\n```\n\n## Salida\n\n```\n$ stratum pull --recursive\n\npulling technical-decisions  git@github.com:org/bilinker-tech-decisions.git  main\n  cloned  .stratum/technical-decisions/\n\npulling impl  git@github.com:org/bilinker-impl.git  main\n  cloned  .stratum/technical-decisions/.stratum/impl/\n```\n\nSi una subcapa ya está actualizada:\n\n```\npulling technical-decisions  already up to date\n```\n\n## Exit codes\n\n| Código | Condición |\n|--------|-----------|\n| `0` | Todas las subcapas procesadas correctamente |\n| `1` | Error de red, autenticación, o conflicto local |\n| `2` | `.toml` con formato inválido |","start_line":1,"lang":"markdown","xi":0,"yi":81},{"id":"commands/pws.md@subsystems/stratum#L1","label":"commands/pws.md","file_group_id":"fg_commands_pws_md_subsystems_stratum","layer_id":"L_subsystems_stratum","layer":"subsystems/stratum","abs_path":"/home/anibal/Workspace/accreta/subsystems/stratum/commands/pws.md","content":"# Especificación: comando `stratum pws`\n\n## Propósito\n\nImprime el path Stratum del directorio de trabajo actual, expresado desde la raíz externa del proyecto (`*`). Es el equivalente de `pwd` pero en notación Stratum.\n\n## Firma\n\n```\nstratum pws\n```\n\nSin argumentos.\n\n## Comportamiento\n\n1. Determina la raíz externa del proyecto (`*`) buscando el ancestro `.git` más lejano.\n2. Calcula el path relativo desde esa raíz hasta el directorio actual.\n3. Convierte los segmentos `.stratum/<name>` en tokens `>name`.\n4. Imprime la expresión Stratum resultante.\n\n## Salida\n\n```\n$ cd /home/user/accreta/subsystems/stratum/.stratum/impl/crates/estrato-cli/src\n$ stratum pws\n*/subsystems/stratum>impl/crates/estrato-cli/src\n```\n\n```\n$ cd /home/user/accreta/subsystems/stratum\n$ stratum pws\n*/subsystems/stratum\n```\n\n```\n$ cd /home/user/accreta\n$ stratum pws\n*\n```\n\n## Usos típicos\n\n```bash\n# Ver dónde estás en el árbol Stratum\nstratum pws\n\n# Usar en scripts para construir referencias portátiles\nCURRENT=$(stratum pws)\necho \"Estoy en: $CURRENT\"\n```\n\n## Códigos de salida\n\n| Código | Condición |\n|--------|-----------|\n| 0 | Éxito. |\n| 1 | No se encontró raíz `.git` en ningún ancestro. |\n\n## Propiedades\n\n- **Solo lectura**: no modifica ningún archivo.\n- El path resultante es válido como argumento para `stratum '<expr>'`.","start_line":1,"lang":"markdown","xi":0,"yi":83},{"id":"commands/tree.md@subsystems/stratum#L1","label":"commands/tree.md","file_group_id":"fg_commands_tree_md_subsystems_stratum","layer_id":"L_subsystems_stratum","layer":"subsystems/stratum","abs_path":"/home/anibal/Workspace/accreta/subsystems/stratum/commands/tree.md","content":"# Especificación: `stratum tree`\n\n## Propósito\n\nMuestra el árbol de capas Stratum a partir de un path dado. Cada nodo del árbol es un directorio común; sus hijos son las sub-capas (`>name`) o los subdirectorios que contienen capas más profundas.\n\n## Sintaxis\n\n```\nstratum tree [<path>]\n```\n\n- `<path>`: expresión Stratum de inicio. Default: `*` (raíz del proyecto).\n\n## Salida\n\nÁrbol en texto con conectores `├──` / `└──` / `│`. La primera línea es la expresión de inicio; cada hijo indentado es una sub-capa (`>name`) o un subdirectorio que contiene capas.\n\n```\n*\n└── subsystems\n    ├── bilinker\n    │   └── >impl\n    └── stratum\n        └── >impl\n```\n\n```\n*/subsystems/stratum\n└── >impl\n```\n\n## Reglas de construcción del árbol\n\n1. **Sub-capas directas** — los directorios dentro de `.stratum/` del nodo actual se muestran como `>name`, ordenados alfabéticamente, antes que los subdirectorios.\n2. **Subdirectorios con contenido Stratum** — los subdirectorios no ocultos que contienen capas (directa o recursivamente) se muestran como nodos intermedios, ordenados alfabéticamente.\n3. **Subdirectorios sin contenido Stratum** — se omiten.\n4. La recursión continúa en cada hijo hasta que no haya más capas.\n\n## Códigos de salida\n\n| Código | Condición |\n|--------|-----------|\n| 0 | Éxito. |\n| 1 | Path no encontrado. |\n| 2 | Expresión Stratum inválida. |\n\n## Propiedades\n\n- **Solo lectura**: no modifica el filesystem.\n- **Composable**: salida a stdout, errores a stderr.","start_line":1,"lang":"markdown","xi":0,"yi":85},{"id":"concepts/layer-model.md@subsystems/stratum#L1","label":"concepts/layer-model.md","file_group_id":"fg_concepts_layer_model_md_subsystems_stratum","layer_id":"L_subsystems_stratum","layer":"subsystems/stratum","abs_path":"/home/anibal/Workspace/accreta/subsystems/stratum/concepts/layer-model.md","content":"# Especificación: Modelo de capas\n\n## Dos tipos de relación entre carpetas\n\nStratum distingue dos tipos de relación entre carpetas de un proyecto:\n\n| Tipo | Carpeta | Relación |\n|---|---|---|\n| **Sub-proyecto** | carpeta plana | proyecto hermano con sus propias specs |\n| **Capa interna** | `.stratum/<nombre>/` | nivel inferior de implementación del mismo proyecto |\n\nLa distinción es fundamental: los sub-proyectos son entidades independientes que comparten un contexto de más alto nivel. Las capas internas son partes del mismo proyecto en distintos niveles de abstracción.\n\n## Sub-proyectos: carpetas planas\n\nUn sub-proyecto es simplemente una subcarpeta con sus propias especificaciones. No requiere ninguna convención de nombre especial.\n\n```\naccreta/\n  stratum/        ← sub-proyecto con sus specs\n  bilinker/       ← sub-proyecto con sus specs\n  README.md\n  general/\n  specific/\n```\n\n`stratum/` y `bilinker/` son proyectos independientes dentro del contexto de `accreta/`. Cada uno tiene su propio README, sus propias specs, su propio git.\n\nNo existe una carpeta `.stratum/` en `accreta/` para agruparlos — eso mezclaría dos conceptos distintos.\n\n## Capas internas: `.stratum/`\n\nLa carpeta `.stratum/` aparece dentro de un proyecto cuando ese proyecto necesita separar sus propias capas de abstracción: decisiones técnicas, implementación, tests, etc.\n\n```\nbilinker/                           ← specs funcionales (capa más alta)\n  general/\n  specific/\n  .stratum/\n    impl/                           ← implementación Rust\n      crates/\n      docs/adr/\n      tests/\n```\n\nLa carpeta `.stratum/` en `bilinker/` no tiene nada que ver con los sub-proyectos de `accreta/`. Es exclusiva del proyecto `bilinker/` y contiene sus capas de implementación.\n\n## Regla de uso de `.stratum/`\n\n`.stratum/` aparece dentro de una carpeta de specs **si y solo si** esa carpeta necesita sus propias capas inferiores de implementación.\n\n**Correcto:**\n```\nbilinker/\n  .stratum/           ← bilinker tiene capas propias\n    impl/\n```\n\n**Incorrecto:**\n```\naccreta/\n  .stratum/           ← INCORRECTO: no agrupa sub-proyectos\n    stratum/\n    bilinker/\n```\n\n## Ejemplo completo\n\n```\naccreta/                             (git — specs Accreta)\n  general/\n  specific/\n  stratum/                          (git — specs Stratum)\n    general/\n    specific/\n    .stratum/                       ← capas internas de Stratum (si las tiene)\n      impl/\n  bilinker/                         (git — specs Bilinker)\n    general/\n    specific/\n    .stratum/                       ← capas internas de Bilinker\n      tech-decisions/               (git — ADRs)\n        adr/\n        .stratum/\n          impl/                     (git — código Rust)\n            crates/\n            tests/\n```\n\n## Profundidad de anidamiento\n\nNo hay límite de profundidad. Una capa interna puede tener a su vez sus propias capas internas con `.stratum/`. La regla es la misma en cada nivel: `.stratum/` solo para capas propias, carpetas planas para sub-proyectos hermanos.\n\n## Git por repositorio\n\nCada proyecto (carpeta de specs) y cada capa interna es un repositorio git independiente. Esto permite:\n\n- Historial separado por nivel de abstracción.\n- Que un proyecto dependa de otro sin acoplar su versionado.\n- Que las capas internas (impl, tests) evolucionen en su propio ritmo.","start_line":1,"lang":"markdown","xi":0,"yi":87},{"id":"concepts/paths.md@subsystems/stratum#L1","label":"concepts/paths.md","file_group_id":"fg_concepts_paths_md_subsystems_stratum","layer_id":"L_subsystems_stratum","layer":"subsystems/stratum","abs_path":"/home/anibal/Workspace/accreta/subsystems/stratum/concepts/paths.md","content":"# Especificación: lenguaje de paths Stratum\n\n## Concepto\n\nUn path Stratum es una expresión que describe un path en el filesystem, opcionalmente usando navegación por layers. Es un superconjunto de los paths relativos tradicionales: cualquier path relativo es un path Stratum válido — la biblioteca lo retorna sin modificación.\n\n## Gramática\n\n```\nstratum-path := traditional-path\n              | down-path\n              | up-path\n              | root-path\n\ntraditional-path := path relativo del filesystem (no comienza con '>' ni '<')\ndown-path        := ('>' layer-name)+ ('/' fs-path)?\nup-path          := '<'+ ('/' fs-path)?\nroot-path        := '<*' root-tail?\nroot-tail        := ('/' fs-segment) (('>' layer-name)+ ('/' fs-path)?)?\n                  | ('>' layer-name)+ ('/' fs-path)?\n\nlayer-name := cualquier carácter excepto '>' y '/'\nfs-path    := path tradicional del filesystem\nfs-segment := componente de path sin '>' ni '<'\n```\n\n## Resolución\n\n### Path tradicional (identidad)\n\nUn path que no comienza con `>` ni `<` es retornado sin cambios.\n\n```\n.stratum/tech-decisions      →  .stratum/tech-decisions\n../..                        →  ../..\nsrc/main.rs                  →  src/main.rs\n```\n\n### Down: `>name1>name2/.../fs-path`\n\nCada segmento `>name` se expande a `.stratum/<name>`. Los segmentos se encadenan. El `fs-path` opcional se concatena al final.\n\n```\n>tech-decisions                    →  .stratum/tech-decisions\n>tech-decisions>impl               →  .stratum/tech-decisions/.stratum/impl\n>tech-decisions>impl/src/main.rs   →  .stratum/tech-decisions/.stratum/impl/src/main.rs\n>tasks/pending.md                  →  .stratum/tasks/pending.md\n```\n\n### Up: `<</fs-path`\n\nCada `<` equivale a `../..` (un nivel Stratum = dos directorios). El `fs-path` opcional se concatena al final.\n\n```\n<                      →  ../..\n<<                     →  ../../../..\n</src/main.rs          →  ../../src/main.rs\n<</docs/api.md         →  ../../../../docs/api.md\n```\n\n### Root: `<*`\n\n`<*` resuelve al directorio raíz del proyecto, definido como el ancestro más cercano que contiene `.git`. La resolución camina hacia arriba desde la layer actual hasta encontrarlo; si no existe, es un error.\n\nDespués de `<*` pueden seguir un fs-path y/o tokens `>` de navegación hacia abajo. Es el único caso donde tokens `<*` y `>` coexisten en la misma expresión.\n\n```\n<*                                          →  <raíz del proyecto>\n<*/subsystems/stratum                       →  <raíz>/subsystems/stratum\n<*>impl                                     →  <raíz>/.stratum/impl\n<*/subsystems/stratum>impl/crates/cli/src   →  <raíz>/subsystems/stratum/.stratum/impl/crates/cli/src\n```\n\n## Invariantes\n\n1. Un path que no comienza con `>` ni `<` es válido y se retorna tal cual.\n2. `<` (Up) y `>` (Down) no se mezclan. `<*` (Root) puede ir seguido de tokens `>`.\n3. El `fs-path` no contiene `>` ni `<`.\n4. Cada `layer-name` es no vacío.\n5. `<*` solo puede aparecer al inicio de la expresión.\n\n## Uso en herramientas\n\nEl path Stratum es el lenguaje de expresión de paths del ecosistema. Lo usan:\n\n- **`stratum` CLI** — como argumento de navegación interactiva.\n- **bilinker** — en endpoints layer de archivos `.bilink`.\n- Cualquier herramienta del ecosistema que necesite referenciar paths dentro\n  de un árbol de layers Stratum.","start_line":1,"lang":"markdown","xi":0,"yi":89},{"id":"concepts/sublayer-config.md@subsystems/stratum#L1","label":"concepts/sublayer-config.md","file_group_id":"fg_concepts_sublayer_config_md_subsystems_stratum","layer_id":"L_subsystems_stratum","layer":"subsystems/stratum","abs_path":"/home/anibal/Workspace/accreta/subsystems/stratum/concepts/sublayer-config.md","content":"# Configuración de subcapas\n\nCada subcapa de `.stratum/` puede tener un archivo de configuración `.<nombre>.toml` en el directorio `.stratum/` que la contiene. El archivo declara cómo obtener ese repositorio git y cualquier configuración específica de la subcapa.\n\n## Ubicación y nombre\n\nEl archivo se llama `.<nombre>.toml` donde `<nombre>` es exactamente el nombre del directorio de la subcapa. Vive junto a la subcapa en el mismo `.stratum/`:\n\n```\nbilinker/\n  .stratum/\n    .technical-decisions.toml   ← config de la subcapa \"technical-decisions\"\n    technical-decisions/         ← la subcapa (presente si fue clonada)\n      .stratum/\n        .impl.toml               ← config de la subcapa \"impl\" de tech-decisions\n        impl/\n```\n\nSi la subcapa no está clonada localmente, el archivo de config sigue presente — es el mapa que permite obtenerla con `stratum pull`.\n\n## Formato\n\n```toml\n# .stratum/.technical-decisions.toml\n\nrepo   = \"git@github.com:org/bilinker-tech-decisions.git\"\nbranch = \"main\"\n\n# Opcional: sparse checkout — solo estas rutas se clonan\nsparse = [\"concepts/\", \"adr/\"]\n\n# Opcional: clon superficial para repos grandes\ndepth = 1\n```\n\n### Campos\n\n| Campo | Tipo | Requerido | Descripción |\n|-------|------|-----------|-------------|\n| `repo` | string | sí | URL del repositorio git (ssh o https) |\n| `branch` | string | sí | Rama a clonar |\n| `sparse` | array de strings | no | Paths a incluir en sparse checkout. Sin este campo se clona completo. |\n| `depth` | entero | no | Profundidad del clon. Sin este campo se clona el historial completo. |\n\n## Relación con `stratum pull`\n\n`stratum pull` lee los archivos `.toml` del directorio `.stratum/` actual y clona o actualiza cada subcapa declarada:\n\n```bash\nstratum pull                         # todas las subcapas del .stratum/ actual\nstratum pull technical-decisions     # solo esa subcapa\nstratum pull --recursive             # todas las subcapas en todo el árbol\n```\n\nSi la subcapa ya existe localmente, `pull` ejecuta `git fetch` + `git checkout` a la rama declarada. Si no existe, la clona.\n\n## Subcapas opcionales y presencia parcial\n\nUn proyecto puede tener configuradas subcapas que no están clonadas localmente. Esto es normal — se trabaja solo con las capas necesarias:\n\n```bash\n# Trabajando solo en spec, sin clonar impl\nbilinker/\n  .stratum/\n    .technical-decisions.toml   ✓ config presente\n    .impl.toml                  ✓ config presente\n    # technical-decisions/ y impl/ ausentes — no clonadas\n```\n\n`bilinker check` y `bilinker graph` reportan `UNREACHABLE` para los endpoints que apuntan a subcapas no presentes, sin fallar.\n\n## Invariantes\n\n1. El nombre del archivo `.toml` coincide exactamente con el nombre del directorio\n   de la subcapa.\n2. Si existe el directorio de la subcapa, debe existir su `.toml` correspondiente.\n3. El `.toml` puede existir sin que exista el directorio (subcapa no clonada).\n4. Los campos `repo` y `branch` son siempre requeridos.","start_line":1,"lang":"markdown","xi":0,"yi":91},{"id":"crates/bilinker-cli/src/html_graph.rs@subsystems/bilinker/.stratum/impl#L1","label":"crates/bilinker-cli/src/html_graph.rs","file_group_id":"fg_crates_bilinker_cli_src_html_graph_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/src/html_graph.rs","content":"use std::collections::{BTreeMap, HashMap, HashSet};\nuse std::path::Path;\nuse bilinker::link::{LinkEndpoint, ByteRange};\nuse bilinker::bilink::BiLinkFile;\n\n// ─── helpers ──────────────────────────────────────────────────────────────────\n\npub fn esc_json(s: &str) -> String {\n    s.replace('\\\\', \"\\\\\\\\\")\n     .replace('\"',  \"\\\\\\\"\")\n     .replace('\\n', \"\\\\n\")\n     .replace('\\r', \"\\\\r\")\n     .replace('\\t', \"\\\\t\")\n}\n\npub fn layer_id(label: &str) -> String {\n    format!(\"L_{}\", label.replace(['/', '.', '-'], \"_\"))\n}\n\npub fn layer_depth(label: &str) -> usize {\n    if label == \".\" { 0 } else { label.matches(\".stratum/\").count() }\n}\n\nfn lang_from_file(file: &str) -> &'static str {\n    match file.rsplit('.').next().unwrap_or(\"\") {\n        \"rs\"           => \"rust\",\n        \"md\"           => \"markdown\",\n        \"toml\"         => \"toml\",\n        \"java\"         => \"java\",\n        \"ts\" | \"tsx\"   => \"typescript\",\n        \"js\" | \"jsx\"   => \"javascript\",\n        \"py\"           => \"python\",\n        \"yaml\" | \"yml\" => \"yaml\",\n        \"json\"         => \"json\",\n        \"sql\"          => \"sql\",\n        \"sh\" | \"bash\"  => \"bash\",\n        \"html\"         => \"html\",\n        \"css\"          => \"css\",\n        _              => \"plaintext\",\n    }\n}\n\n// ─── data model ───────────────────────────────────────────────────────────────\n\npub struct HtmlNode {\n    pub id:         String,\n    pub file:       String,   // relative file path within layer\n    pub label:      String,\n    pub layer:      String,\n    pub abs_path:   String,\n    pub content:    String,\n    pub start_line: usize,\n    pub lang:       &'static str,\n}\n\npub struct HtmlEdge {\n    pub id:     String,\n    pub source: String,\n    pub target: String,\n    pub label:  String,\n    pub states: String,\n    pub link0:  String,\n    pub link1:  String,\n}\n\n#[derive(Default)]\npub struct HtmlGraph {\n    layers:     BTreeMap<String, usize>,\n    nodes:      Vec<HtmlNode>,\n    edges:      Vec<HtmlEdge>,\n    seen_nodes: HashSet<String>,\n    seen_edges: HashSet<String>,\n}\n\nimpl HtmlGraph {\n    pub fn new() -> Self { Self::default() }\n\n    pub fn add_node(&mut self, node: HtmlNode) {\n        let depth = layer_depth(&node.layer);\n        self.layers.insert(node.layer.clone(), depth);\n        if self.seen_nodes.insert(node.id.clone()) {\n            self.nodes.push(node);\n        }\n    }\n\n    pub fn add_edge(&mut self, edge: HtmlEdge) {\n        let key = if edge.source <= edge.target {\n            format!(\"{}↔{}↔{}\", edge.source, edge.target, edge.label)\n        } else {\n            format!(\"{}↔{}↔{}\", edge.target, edge.source, edge.label)\n        };\n        if self.seen_edges.insert(key) { self.edges.push(edge); }\n    }\n\n    pub fn emit(&self) -> String {\n        let layers_json = self.layers.iter().map(|(lbl, depth)| {\n            format!(r#\"{{\"id\":\"{}\",\"label\":\"{}\",\"depth\":{}}}\"#,\n                esc_json(&layer_id(lbl)), esc_json(lbl), depth)\n        }).collect::<Vec<_>>().join(\",\");\n","start_line":1,"lang":"rust","xi":1,"yi":0},{"id":"crates/bilinker-cli/src/html_graph.rs@subsystems/bilinker/.stratum/impl#L67","label":"crates/bilinker-cli/src/html_graph.rs#L67","file_group_id":"fg_crates_bilinker_cli_src_html_graph_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/src/html_graph.rs","content":"pub struct HtmlGraph {\n    layers:     BTreeMap<String, usize>,\n    nodes:      Vec<HtmlNode>,\n    edges:      Vec<HtmlEdge>,\n    seen_nodes: HashSet<String>,\n    seen_edges: HashSet<String>,\n}","start_line":67,"lang":"rust","xi":1,"yi":1},{"id":"crates/bilinker-cli/src/html_graph.rs@subsystems/bilinker/.stratum/impl#L78","label":"crates/bilinker-cli/src/html_graph.rs#L78","file_group_id":"fg_crates_bilinker_cli_src_html_graph_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/src/html_graph.rs","content":"pub fn add_node(&mut self, node: HtmlNode) {\n        let depth = layer_depth(&node.layer);\n        self.layers.insert(node.layer.clone(), depth);\n        if self.seen_nodes.insert(node.id.clone()) {\n            self.nodes.push(node);\n        }\n    }","start_line":78,"lang":"rust","xi":1,"yi":2},{"id":"crates/bilinker-cli/src/html_graph.rs@subsystems/bilinker/.stratum/impl#L188","label":"crates/bilinker-cli/src/html_graph.rs#L188","file_group_id":"fg_crates_bilinker_cli_src_html_graph_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/src/html_graph.rs","content":"pub fn collect(\n    root: &Path,\n    bl: &BiLinkFile,\n    layer_root: &Path,\n    visited: &mut HashSet<String>,\n    hg: &mut HtmlGraph,\n    url_scheme: &str,\n    depth: usize,\n    max_depth: Option<usize>,\n) -> anyhow::Result<()> {\n    let uuid_short = &bl.uuid[..8.min(bl.uuid.len())];\n    let s0 = bilinker::state_str(&bl.state0);\n    let s1 = bilinker::state_str(&bl.state1);\n    let lbl = crate::layer_label(root, layer_root);\n\n    let local_id = add_structural(bl, layer_root, &lbl, hg, url_scheme);\n\n    if max_depth.map_or(true, |d| depth < d) {\n        for (adj_path, adj_layer) in crate::layer_children(bl, layer_root) {\n            let key = crate::visit_key(&bl.uuid, &adj_layer);\n            let already = visited.contains(&key);\n            if !already { visited.insert(key); }\n\n            let adj_bl  = BiLinkFile::load(&adj_path)?;\n            let adj_lbl = crate::layer_label(root, &adj_layer);\n            let adj_id  = add_structural(&adj_bl, &adj_layer, &adj_lbl, hg, url_scheme);\n\n            if let (Some(ref lid), Some(ref aid)) = (&local_id, &adj_id) {\n                let src_state = worst_state_str(&[&bl.state0, &bl.state1]);\n                let tgt_state = worst_state_str(&[&adj_bl.state0, &adj_bl.state1]);\n                let link0 = structural_endpoint_str(&bl);\n                let link1 = structural_endpoint_str(&adj_bl);\n                hg.add_edge(HtmlEdge {\n                    id:     format!(\"e_{uuid_short}_{}\", &lid[..8.min(lid.len())]),\n                    source: lid.clone(),\n                    target: aid.clone(),\n                    label:  uuid_short.to_string(),\n                    states: format!(\"{src_state}↔{tgt_state}\"),\n                    link0,\n                    link1,\n                });\n            }\n\n            if !already {\n                collect(root, &adj_bl, &adj_layer, visited, hg, url_scheme, depth + 1, max_depth)?;\n            }\n        }\n    }\n    Ok(())\n}","start_line":188,"lang":"rust","xi":1,"yi":3},{"id":"crates/bilinker-cli/src/main.rs@subsystems/bilinker/.stratum/impl#L1","label":"crates/bilinker-cli/src/main.rs","file_group_id":"fg_crates_bilinker_cli_src_main_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/src/main.rs","content":"mod html_graph;\n\n\nuse clap::{ArgAction, Parser, Subcommand};\nuse std::path::{Path, PathBuf};\n\n#[derive(Parser)]\n#[command(name = \"bilinker\", about = \"Universal bidirectional structural references\")]\nstruct Cli {\n    #[command(subcommand)]\n    command: Command,\n}\n\n#[derive(Subcommand)]\nenum Command {\n    /// Capture a bilink endpoint from a file selection\n    ///\n    /// FILE is relative to the project root (.bilinker.toml).\n    /// START and END are line:col positions (1-based).\n    Capture {\n        file: String,\n        start: String,\n        end: String,\n    },\n\n    /// Print content or list bilinks referencing a file/position\n    ///\n    /// Forms:\n    ///   get <UUID>.<N>          — show fragment content at endpoint N\n    ///   get <file>:<line>:<col> — list bilinks whose range covers that position\n    ///   get <file>              — list all bilinks referencing that file\n    Get {\n        target: String,\n        #[arg(short = 'B', value_name = \"rows:cols\")]\n        before: Option<String>,\n        #[arg(short = 'A', value_name = \"rows:cols\")]\n        after: Option<String>,\n    },\n\n    /// Verify bilinks in a .bilink file or directory\n    Check {\n        path: PathBuf,\n    },\n\n    /// Watch for changes in linked files and alert on drift\n    Watch,\n\n    /// Apply pending auto-fixes from check\n    Apply {\n        #[arg(long)]\n        dry_run: bool,\n        #[arg(short = 'y')]\n        yes: bool,\n    },\n\n    /// Manage chains of bilinks\n    Chain {\n        #[command(subcommand)]\n        sub: ChainCommand,\n    },\n\n    /// Build or check the .bilink/.index\n    Index {\n        #[command(subcommand)]\n        sub: IndexCommand,\n    },\n\n    /// Accept bilink endpoints, establishing their hash baseline\n    ///\n    /// Forms (like git add):\n    ///   accept .                 — all PENDING in current .bilink/\n    ///   accept commands/         — PENDING endpoints pointing into that directory\n    ///   accept commands/check.md — PENDING endpoints pointing to that file\n    ///   accept <uuid>            — both endpoints of that UUID\n    ///   accept <uuid>.<0|1>      — one specific endpoint\n    Accept {\n        /// path, UUID, or UUID.N\n        target: String,\n        /// Override the computed hash\n        #[arg(long)]\n        hash: Option<String>,\n        /// Override the git commit\n        #[arg(long)]\n        commit: Option<String>,\n    },\n\n    /// Show status of all bilinks in the current layer (like git status)\n    Status {\n        /// Layer directory to inspect (default: current directory)\n        path: Option<PathBuf>,\n    },\n\n    /// Remove a bilink file from the current layer\n    Remove {\n        /// UUID or 8-char prefix of the bilink to remove\n        uuid: String,\n    },\n\n    /// Traverse the bilink graph from a file, position, or UUID\n    Graph {","start_line":1,"lang":"rust","xi":1,"yi":5},{"id":"crates/bilinker-cli/src/main.rs@subsystems/bilinker/.stratum/impl#L15","label":"crates/bilinker-cli/src/main.rs#L15","file_group_id":"fg_crates_bilinker_cli_src_main_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/src/main.rs","content":"enum Command {\n    /// Capture a bilink endpoint from a file selection\n    ///\n    /// FILE is relative to the project root (.bilinker.toml).\n    /// START and END are line:col positions (1-based).\n    Capture {\n        file: String,\n        start: String,\n        end: String,\n    },\n\n    /// Print content or list bilinks referencing a file/position\n    ///\n    /// Forms:\n    ///   get <UUID>.<N>          — show fragment content at endpoint N\n    ///   get <file>:<line>:<col> — list bilinks whose range covers that position\n    ///   get <file>              — list all bilinks referencing that file\n    Get {\n        target: String,\n        #[arg(short = 'B', value_name = \"rows:cols\")]\n        before: Option<String>,\n        #[arg(short = 'A', value_name = \"rows:cols\")]\n        after: Option<String>,\n    },\n\n    /// Verify bilinks in a .bilink file or directory\n    Check {\n        path: PathBuf,\n    },\n\n    /// Watch for changes in linked files and alert on drift\n    Watch,\n\n    /// Apply pending auto-fixes from check\n    Apply {\n        #[arg(long)]\n        dry_run: bool,\n        #[arg(short = 'y')]\n        yes: bool,\n    },\n\n    /// Manage chains of bilinks\n    Chain {\n        #[command(subcommand)]\n        sub: ChainCommand,\n    },\n\n    /// Build or check the .bilink/.index\n    Index {\n        #[command(subcommand)]\n        sub: IndexCommand,\n    },\n\n    /// Accept bilink endpoints, establishing their hash baseline\n    ///\n    /// Forms (like git add):\n    ///   accept .                 — all PENDING in current .bilink/\n    ///   accept commands/         — PENDING endpoints pointing into that directory\n    ///   accept commands/check.md — PENDING endpoints pointing to that file\n    ///   accept <uuid>            — both endpoints of that UUID\n    ///   accept <uuid>.<0|1>      — one specific endpoint\n    Accept {\n        /// path, UUID, or UUID.N\n        target: String,\n        /// Override the computed hash\n        #[arg(long)]\n        hash: Option<String>,\n        /// Override the git commit\n        #[arg(long)]\n        commit: Option<String>,\n    },\n\n    /// Show status of all bilinks in the current layer (like git status)\n    Status {\n        /// Layer directory to inspect (default: current directory)\n        path: Option<PathBuf>,\n    },\n\n    /// Remove a bilink file from the current layer\n    Remove {\n        /// UUID or 8-char prefix of the bilink to remove\n        uuid: String,\n    },\n\n    /// Traverse the bilink graph from a file, position, or UUID\n    Graph {\n        /// File, file:line:col, or UUID\n        selector: String,\n        /// Maximum traversal depth (default: unlimited)\n        #[arg(long)]\n        depth: Option<usize>,\n        /// Output format: tree, flat, dot\n        #[arg(long, default_value = \"tree\", value_name = \"FORMAT\")]\n        format: String,\n        /// Collect bilinks from all layers under the project root\n        #[arg(long)]\n        recursive: bool,\n        /// Show intermediate bilink nodes as diamonds (default: direct file-to-file edges)\n        #[arg(long)]\n        bilink_detail: bool,","start_line":15,"lang":"rust","xi":1,"yi":6},{"id":"crates/bilinker-cli/src/main.rs@subsystems/bilinker/.stratum/impl#L260","label":"crates/bilinker-cli/src/main.rs#L260","file_group_id":"fg_crates_bilinker_cli_src_main_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/src/main.rs","content":"fn main() -> anyhow::Result<()> {\n    let cli = Cli::parse();\n    let cwd = std::env::current_dir()?;\n\n    match cli.command {\n        Command::Capture { file, start, end } => {\n            let root = project_root(&cwd)?;\n            let result = bilinker::capture::capture(\n                &root, &file,\n                parse_pos(&start)?, parse_pos(&end)?,\n            )?;\n            println!(\"{}\", result.endpoint);\n            eprintln!(\"hash: {}\", result.hash);\n        }\n\n        Command::Get { target, before, after } => {\n            let uuid_form = {\n                let t = target.trim();\n                (t.ends_with(\".0\") || t.ends_with(\".1\")) && t.contains('-')\n            };\n            let pos_form = {\n                let parts: Vec<&str> = target.rsplitn(3, ':').collect();\n                parts.len() == 3\n                    && parts[0].parse::<usize>().is_ok()\n                    && parts[1].parse::<usize>().is_ok()\n            };\n\n            if uuid_form {\n                let dot      = target.rfind('.').unwrap();\n                let name     = &target[..dot];\n                let endpoint: u8 = target[dot + 1..].parse()?;\n                let root     = project_root(&cwd)?;\n                let before   = before.as_deref().map(parse_pos).transpose()?;\n                let after    = after.as_deref().map(parse_pos).transpose()?;\n                let result   = bilinker::get::get(&root, name, endpoint, before, after)?;\n                eprintln!(\"# {}  lines {}–{}\", result.file, result.start_line, result.end_line);\n                println!(\"{}\", result.content);\n            } else if pos_form {\n                let mut parts = target.rsplitn(3, ':');\n                let col:  usize = parts.next().unwrap().parse()?;\n                let line: usize = parts.next().unwrap().parse()?;\n                let file        = parts.next().unwrap();\n                let file_path   = cwd.join(file);\n                let root        = project_root(&cwd)?;\n\n                let results = bilinker::check::find_by_file(&root, &file_path)?;\n                if results.is_empty() {\n                    return Ok(());\n                }\n                for (bilink_path, n, range) in results {\n                    let source = std::fs::read_to_string(&file_path).unwrap_or_default();\n                    let byte = line_col_to_byte(&source, line, col);\n                    if byte >= range.start && byte < range.end {\n                        let uuid  = bilink_path.file_stem()\n                            .and_then(|s| s.to_str()).unwrap_or(\"?\");\n                        let bl    = bilinker::bilink::BiLinkFile::load(&bilink_path)?;\n                        let other = if n == 0 { &bl.link1 } else { &bl.link0 };\n                        println!(\"{uuid}.{n}  {other}\");\n                    }\n                }\n            } else {\n                let file_path = cwd.join(&target);\n                let root      = project_root(&cwd)?;\n\n                let results = bilinker::check::find_by_file(&root, &file_path)?;\n                for (bilink_path, n, range) in results {\n                    let uuid  = bilink_path.file_stem()\n                        .and_then(|s| s.to_str()).unwrap_or(\"?\");\n                    let bl    = bilinker::bilink::BiLinkFile::load(&bilink_path)?;\n                    let other = if n == 0 { &bl.link1 } else { &bl.link0 };\n                    println!(\"{uuid}.{n}  {other}  bytes {}–{}\", range.start, range.end);\n                }\n            }\n        }\n\n        Command::Check { path } => {\n            let root = project_root(&cwd)?;\n            let check_path = if path.is_absolute() { path } else { cwd.join(path) };\n            let results = bilinker::check::check(&root, &check_path)?;\n\n            let mut exit_code = 0;\n            for r in &results {\n                if !r.is_clean() {\n                    exit_code = 1;\n                    println!(\"{}  ({}, {})\", &r.uuid[..8], r.state0, r.state1);\n                }\n            }\n            if exit_code == 0 {\n                eprintln!(\"all clean ({} bilink(s))\", results.len());\n            }\n            std::process::exit(exit_code);\n        }\n\n        Command::Watch => {\n            let root = project_root(&cwd)?;\n            watch(&root)?;\n        }\n\n        Command::Apply { dry_run, yes: _ } => {\n            let pending = cwd.join(\".bilink\").join(\".pending\");","start_line":260,"lang":"rust","xi":1,"yi":7},{"id":"crates/bilinker-cli/src/main.rs@subsystems/bilinker/.stratum/impl#L682","label":"crates/bilinker-cli/src/main.rs#L682","file_group_id":"fg_crates_bilinker_cli_src_main_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/src/main.rs","content":"fn print_status(layer: &Path) -> anyhow::Result<()> {\n    use std::collections::BTreeMap;\n    use bilinker::bilink::BiLinkFile;\n    use bilinker::link::LinkEndpoint;\n\n    let bilink_dir = layer.join(\".bilink\");\n    if !bilink_dir.exists() {\n        eprintln!(\"no .bilink/ in {}\", layer.display());\n        return Ok(());\n    }\n\n    struct Row {\n        file_name: String,\n        uuid_short: String,\n        s0: String,\n        s1: String,\n    }\n\n    let mut groups: BTreeMap<String, Vec<Row>> = BTreeMap::new();\n\n    for entry in std::fs::read_dir(&bilink_dir)? {\n        let path = entry?.path();\n        if path.extension().and_then(|e| e.to_str()) != Some(\"bilink\") { continue; }\n        if path.file_name().and_then(|n| n.to_str())\n            .map(|n| n.starts_with('.')).unwrap_or(false) { continue; }\n\n        let Ok(bl) = BiLinkFile::load(&path) else { continue };\n\n        // Group by the structural endpoint's parent directory\n        let (dir, file_name) = {\n            let sref = match (&bl.link0, &bl.link1) {\n                (LinkEndpoint::Structural(s), _) => Some(&s.file),\n                (_, LinkEndpoint::Structural(s)) => Some(&s.file),\n                _ => None,\n            };\n            match sref {\n                Some(f) => {\n                    let p = std::path::Path::new(f);\n                    let dir = p.parent().and_then(|d| if d.as_os_str().is_empty() { None } else { Some(d) })\n                        .map(|d| d.display().to_string())\n                        .unwrap_or_else(|| \".\".to_string());\n                    let name = p.file_name().map(|n| n.to_string_lossy().to_string())\n                        .unwrap_or_else(|| f.clone());\n                    (dir, name)\n                }\n                None => (\"(layer)\".to_string(), bl.uuid.clone()),\n            }\n        };\n\n        let uuid_short = bl.uuid[..8.min(bl.uuid.len())].to_string();\n        let s0 = bilinker::state_str(&bl.state0);\n        let s1 = bilinker::state_str(&bl.state1);\n\n        groups.entry(dir).or_default().push(Row { file_name, uuid_short, s0, s1 });\n    }\n\n    if groups.is_empty() {\n        println!(\"(no bilinks)\");\n        return Ok(());\n    }\n\n    for (dir, mut rows) in groups {\n        println!(\"{dir}/\");\n        rows.sort_by(|a, b| a.file_name.cmp(&b.file_name));\n\n        let max_name = rows.iter().map(|r| r.file_name.len()).max().unwrap_or(0);\n        let mut prev = String::new();\n        for row in &rows {\n            let label = if row.file_name != prev {\n                format!(\"{:<width$}\", row.file_name, width = max_name)\n            } else {\n                format!(\"{:<width$}\", \"\", width = max_name)\n            };\n            println!(\"  {}  {}  ({}, {})\", label, row.uuid_short, row.s0, row.s1);\n            prev = row.file_name.clone();\n        }\n        println!();\n    }\n\n    Ok(())\n}","start_line":682,"lang":"rust","xi":1,"yi":8},{"id":"crates/bilinker-cli/tests/integration.rs@subsystems/bilinker/.stratum/impl#L38","label":"crates/bilinker-cli/tests/integration.rs#L38","file_group_id":"fg_crates_bilinker_cli_tests_integration_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/tests/integration.rs","content":"fn capture_identifies_workspace_file_and_method() {\n    let _guard = PERSONA_LOCK.lock().unwrap();\n    let (stdout, stderr, ok) = run(&[\n        \"capture\",\n        \"tests/fixtures/java-app/src/main/java/ar/example/demo/persona/Persona.java\",\n        \"10:5\", \"12:5\",\n    ]);\n    assert!(ok, \"capture failed:\\n{stderr}\");\n    assert!(stdout.contains(\"Persona.java\"), \"missing file in link\");\n    assert!(stdout.contains(\"Persona\"),      \"missing class name in query\");\n    assert!(stdout.contains(\"vote\"),         \"missing method name in query\");\n    assert!(stderr.contains(\"hash:\"),        \"missing hash in stderr\");\n}","start_line":38,"lang":"rust","xi":1,"yi":10},{"id":"crates/bilinker-cli/tests/integration.rs@subsystems/bilinker/.stratum/impl#L56","label":"crates/bilinker-cli/tests/integration.rs#L56","file_group_id":"fg_crates_bilinker_cli_tests_integration_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/tests/integration.rs","content":"fn get_content_matches_sed_selection() {\n    let _guard = PERSONA_LOCK.lock().unwrap();\n    let (get_out, stderr, ok) = run(&[\"get\", \"persona-voting-impl.0\"]);\n    assert!(ok, \"get failed:\\n{stderr}\");\n\n    let full = fs::read_to_string(persona_java()).expect(\"read Persona.java\");\n    let sed: String = full.lines()\n        .skip(9)\n        .take(3)\n        .collect::<Vec<_>>()\n        .join(\"\\n\");\n\n    assert_eq!(\n        get_out.trim(),\n        sed.trim(),\n        \"get output differs from sed selection\"\n    );\n}","start_line":56,"lang":"rust","xi":1,"yi":11},{"id":"crates/bilinker-cli/tests/integration.rs@subsystems/bilinker/.stratum/impl#L78","label":"crates/bilinker-cli/tests/integration.rs#L78","file_group_id":"fg_crates_bilinker_cli_tests_integration_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/tests/integration.rs","content":"fn capture_hash_is_valid_sha256_and_stable() {\n    let _guard = PERSONA_LOCK.lock().unwrap();\n    let args = &[\n        \"capture\",\n        \"tests/fixtures/java-app/src/main/java/ar/example/demo/persona/Persona.java\",\n        \"10:5\", \"12:5\",\n    ];\n\n    let (_, stderr1, ok1) = run(args);\n    assert!(ok1, \"first capture failed:\\n{stderr1}\");\n    let hash1 = extract_hash(&stderr1);\n\n    assert_eq!(hash1.len(), 64, \"hash must be 64 hex chars (SHA-256)\");\n    assert!(hash1.chars().all(|c| c.is_ascii_hexdigit()), \"hash must be hex\");\n\n    let (_, stderr2, ok2) = run(args);\n    assert!(ok2, \"second capture failed:\\n{stderr2}\");\n    assert_eq!(hash1, extract_hash(&stderr2), \"hash must be deterministic\");\n}","start_line":78,"lang":"rust","xi":1,"yi":12},{"id":"crates/bilinker-cli/tests/integration.rs@subsystems/bilinker/.stratum/impl#L101","label":"crates/bilinker-cli/tests/integration.rs#L101","file_group_id":"fg_crates_bilinker_cli_tests_integration_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/tests/integration.rs","content":"fn drift_changes_hash() {\n    let _guard = PERSONA_LOCK.lock().unwrap();\n    let path = persona_java();\n    let original = fs::read_to_string(&path).expect(\"read Persona.java\");\n\n    let (_, stderr1, ok1) = run(&[\n        \"capture\",\n        \"tests/fixtures/java-app/src/main/java/ar/example/demo/persona/Persona.java\",\n        \"10:5\", \"12:5\",\n    ]);\n    assert!(ok1, \"capture (before) failed:\\n{stderr1}\");\n    let hash_before = extract_hash(&stderr1);\n\n    let modified = original.replace(\n        \"System.out.println(name + \\\" votes for \\\" + candidate);\",\n        \"System.out.println(name + \\\" voted for \\\" + candidate); // drift\",\n    );\n    fs::write(&path, &modified).expect(\"write modified\");\n\n    let (_, stderr2, ok2) = run(&[\n        \"capture\",\n        \"tests/fixtures/java-app/src/main/java/ar/example/demo/persona/Persona.java\",\n        \"10:5\", \"12:5\",\n    ]);\n\n    fs::write(&path, &original).expect(\"restore original\");\n\n    assert!(ok2, \"capture (after) failed:\\n{stderr2}\");\n    let hash_after = extract_hash(&stderr2);\n\n    assert_ne!(hash_before, hash_after, \"hash should change when code drifts\");\n}","start_line":101,"lang":"rust","xi":1,"yi":13},{"id":"crates/bilinker-cli/tests/integration.rs@subsystems/bilinker/.stratum/impl#L163","label":"crates/bilinker-cli/tests/integration.rs#L163","file_group_id":"fg_crates_bilinker_cli_tests_integration_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/tests/integration.rs","content":"fn chain_new_direct_link_creates_single_file() {\n    let (_tmp, root) = isolated_workspace();\n\n    let (stdout, stderr, ok) = run_in(&root, &[\n        \"chain\", \"new\",\n        \"--tip\", \"docs/spec.md\",\n        \"--tip\", \"src/Service.java\",\n    ]);\n    assert!(ok, \"chain new failed:\\n{stderr}\");\n    assert!(stdout.contains(\"Created chain:\"), \"missing uuid in output\");\n\n    let bilink_dir = root.join(\".bilink\");\n    let files: Vec<_> = std::fs::read_dir(&bilink_dir).unwrap()\n        .filter_map(|e| e.ok())\n        .filter(|e| e.path().extension().and_then(|x| x.to_str()) == Some(\"bilink\"))\n        .collect();\n    assert_eq!(files.len(), 1, \"direct link should create exactly one file\");\n}","start_line":163,"lang":"rust","xi":1,"yi":14},{"id":"crates/bilinker-cli/tests/integration.rs@subsystems/bilinker/.stratum/impl#L183","label":"crates/bilinker-cli/tests/integration.rs#L183","file_group_id":"fg_crates_bilinker_cli_tests_integration_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/tests/integration.rs","content":"fn chain_new_two_layers_creates_two_files() {\n    let (_tmp, root) = isolated_workspace();\n    std::fs::create_dir_all(root.join(\".stratum/impl\")).unwrap();\n\n    let (_, stderr, ok) = run_in(&root, &[\n        \"chain\", \"new\",\n        \"--tip\", \"docs/spec.md\",\n        \"--tip\", \">impl/src/Service.java\",\n    ]);\n    assert!(ok, \"chain new failed:\\n{stderr}\");\n\n    let count_bilinks = |dir: &std::path::Path| -> usize {\n        std::fs::read_dir(dir).map(|rd| rd\n            .filter_map(|e| e.ok())\n            .filter(|e| e.path().extension().and_then(|x| x.to_str()) == Some(\"bilink\"))\n            .count()\n        ).unwrap_or(0)\n    };\n\n    assert emains empty\n    run_in(&root, &[\"check\", \".\"]);\n\n    // Simulate accept: inject accepted entry with current file hash\n    let bilink_dir = root.join(\".bilink\");\n    let entry = std::fs::read_dir(&bilink_dir).unwrap()\n        .filter_map(|e| e.ok())\n        .find(|e| e.path().extension().and_then(|x| x.to_str()) == Some(\"bilink\"))\n        .expect(\"no bilink file\");\n    let spec_bytes = std::fs::read(root.join(\"docs/spec.md\")).unwrap();\n    let spec_hash = format!(\"{:x}\", Sha256::digest(&spec_bytes));\n    let svc_bytes = std::fs::read(root.join(\"src/Service.java\")).unwrap();\n    let svc_hash = format!(\"{:x}\", Sha256::digest(&svc_bytes));\n    let current = std::fs::read_to_string(entry.path()).unwrap();\n    let patched = current.replace(\n        \"\\n# Cache\\n\",\n        &format!(\"\\n# Cache\\nhash.0: {spec_hash}\\ncommit.0: deadbeef\\nhash.1: {svc_hash}\\ncommit.1: deadbeef\\n\"),\n    );\n    std::fs::write(entry.path(), patched).unwrap();\n\n    // Modify the file → hash no longer in accepted → ALTERED\n    std::fs::write(root.join(\"docs/spec.md\"), \"# Modified\\n\\nDifferent content.\\n\").unwrap();\n\n    let (stdout, _, ok) = run_in(&root, &[\"check\", \".\"]);\n    assert!(!ok, \"check should exit 1 when state is ALTERED\");\n    assert!(stdout.contains(\"ALTERED\"), \"expected ALTERED in output:\\n{stdout}\");\n}","start_line":225,"lang":"rust","xi":1,"yi":17},{"id":"crates/bilinker-cli/tests/integration.rs@subsystems/bilinker/.stratum/impl#L266","label":"crates/bilinker-cli/tests/integration.rs#L266","file_group_id":"fg_crates_bilinker_cli_tests_integration_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/tests/integration.rs","content":"fn chain_list_shows_created_chain() {\n    let (_tmp, root) = isolated_workspace();\n\n    let (create_out, _, _) = run_in(&root, &[\n        \"chain\", \"new\",\n        \"--tip\", \"docs/spec.md\",\n        \"--tip\", \"src/Service.java\",\n    ]);\n\n    let uuid = create_out.lines()\n        .find(|l| l.starts_with(\"Created chain:\"))\n        .and_then(|l| l.split_whitespace().nth(2))\n        .expect(\"no UUID in output\");\n\n    let (list_out, _, ok) = run_in(&root, &[\"chain\", \"list\"]);\n    assert!(ok, \"chain list failed\");\n    assert!(list_out.contains(&uuid[..8]), \"UUID prefix not in chain list:\\n{list_out}\");\n}","start_line":266,"lang":"rust","xi":1,"yi":18},{"id":"crates/bilinker-cli/tests/integration.rs@subsystems/bilinker/.stratum/impl#L286","label":"crates/bilinker-cli/tests/integration.rs#L286","file_group_id":"fg_crates_bilinker_cli_tests_integration_rs_subsystems_bilinker__stratum_impl","layer_id":"L_subsystems_bilinker__stratum_impl","layer":"subsystems/bilinker/.stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/tests/integration.rs","content":"fn chain_status_shows_nodes() {\n    let (_tmp, root) = isolated_workspace();\n    std::fs::create_dir_all(root.join(\".stratum/impl\")).unwrap();\n\n    let (create_out, _, ok) = run_in(&root, &[\n        \"chain\", \"new\",\n        \"--tip\", \"docs/spec.md\",\n        \"--tip\", \">impl/src/Service.java\",\n    ]);\n    assert!(ok);\n\n    let uuid = create_out.lines()\n        .find(|l| l.starts_with(\"Created chain:\"))\n        .and_then(|l| l.split_whitespace().nth(2))\n        .expect(\"no UUID in output\");\n\n    let (status_out, _, ok) = run_in(&root, &[\"chain\", \"status\", uuid]);\n    assert!(ok, \"chain status failed\");\n    assert!(status_out.contains(\"Chain:\"), \"expected chain header:\\n{status_out}\");\n    assert!(status_out.contains(\"link.0\"), \"expected link.0 in output\");\n    assert!(status_out.contains(\"link.1\"), \"expected link.1 in output\");\n}","start_line":286,"lang":"rust","xi":1,"yi":19},{"id":"crates
