:"main.rs","layer_id":"L__stratum_impl","layer":".stratum/impl","type":"file-group"},{"id":"fg_crates_bilinker_src_accept_rs__stratum_impl","label":"accept.rs","layer_id":"L__stratum_impl","layer":".stratum/impl","type":"file-group"},{"id":"fg_crates_bilinker_src_bilink_rs__stratum_impl","label":"bilink.rs","layer_id":"L__stratum_impl","layer":".stratum/impl","type":"file-group"},{"id":"fg_crates_bilinker_src_capture_rs__stratum_impl","label":"capture.rs","layer_id":"L__stratum_impl","layer":".stratum/impl","type":"file-group"},{"id":"fg_crates_bilinker_src_chain_rs__stratum_impl","label":"chain.rs","layer_id":"L__stratum_impl","layer":".stratum/impl","type":"file-group"},{"id":"fg_crates_bilinker_src_check_rs__stratum_impl","label":"check.rs","layer_id":"L__stratum_impl","layer":".stratum/impl","type":"file-group"},{"id":"fg_crates_bilinker_src_config_rs__stratum_impl","label":"config.rs","layer_id":"L__stratum_impl","layer":".stratum/impl","type":"file-group"},{"id":"fg_crates_bilinker_src_get_rs__stratum_impl","label":"get.rs","layer_id":"L__stratum_impl","layer":".stratum/impl","type":"file-group"},{"id":"fg_crates_bilinker_src_index_rs__stratum_impl","label":"index.rs","layer_id":"L__stratum_impl","layer":".stratum/impl","type":"file-group"},{"id":"fg_crates_bilinker_src_link_rs__stratum_impl","label":"link.rs","layer_id":"L__stratum_impl","layer":".stratum/impl","type":"file-group"}],"nodes":[{"id":"commands/accept.md@.#L1","label":"commands/accept.md","file_group_id":"fg_commands_accept_md__","layer_id":"L__","layer":".","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/commands/accept.md","content":"# Comando: `bilinker accept`\n\nRegistra el estado actual de un endpoint como aceptado, estableciendo `hash.N` y `commit.N` en el archivo `.bilink`.\n\n## Uso\n\n```\nbilinker accept <uuid>.<N>\nbilinker accept <uuid>.<N> <hash> <commit>\nbilinker accept .\nbilinker accept <path>\n```\n\n| Argumento | Descripción |\n|-----------|-------------|\n| `<uuid>.<N>` | Endpoint a aceptar: UUID del bilink + índice (0 o 1). |\n| `<hash>` | SHA-256 del fragmento (o del `.bilink` adyacente para layer). Si se omite, bilinker lo calcula. |\n| `<commit>` | SHA-1 del commit del repo. Si se omite, bilinker usa HEAD. |\n| `.` o `<path>` | Acepta en bulk todos los endpoints con estado `PENDING`, `ALTERED` o `CHAIN_DIRTY` en la layer actual (o bajo el path dado). |\n\n## Comportamiento\n\n1. Resuelve el archivo `.bilink/<uuid>.bilink`.\n2. Calcula o usa el `hash` provisto del contenido actual del endpoint.\n3. Calcula o usa el `commit` de HEAD en el repo correspondiente.\n4. Establece `hash.N` y `commit.N` en el archivo (sobrescribe valores anteriores).\n5. Actualiza `state.N` a `OK` y `resolved_at`.\n\nEl archivo `.bilink` cambia — esto dispara `CHAIN_DIRTY` en el nodo adyacente de la cadena en el próximo `check`.\n\n## Ejemplos\n\n```bash\n# Aceptar un endpoint concreto (hash y commit calculados automáticamente)\nbilinker accept 7f3d8e9a-1b2c-4d5e-8f6a-7b8c9d0e1f2a.1\n\n# Aceptar con valores explícitos (útil para scripting)\nbilinker accept 7f3d8e9a.1 \\\n  479922a1ee55cc7f9f4f323bb002018e1b4e1cda65e069e0f6f4645926ce25ee \\\n  d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3\n\n# Aceptar todo lo que necesita atención en la layer actual\nbilinker accept .\n```\n\n## Salida\n\n```\naccepted: 7f3d8e9a.1\n  hash:   479922a1…\n  commit: d4e5f6a7…\n  state:  OK\n\nnote: nodo adyacente detectará CHAIN_DIRTY en el próximo check\n```\n\n## Cuándo usarlo\n\n- Tras `bilinker check` cuando el estado es `PENDING`, `ALTERED` o `CHAIN_DIRTY`\n  y el cambio es coherente con la intención del bilink.\n- No es necesario para los estados auto-reparables (MOVED, DISPLACED, REANCHORED,\n  EXPANDED) — esos se resuelven con `bilinker apply`.\n\n## Exit codes\n\n- `0`: aceptación registrada exitosamente\n- `1`: UUID no encontrado, endpoint inválido, o estado no aceptable","start_line":1,"lang":"markdown","xi":0,"yi":0},{"id":"commands/apply.md@.#L1","label":"commands/apply.md","file_group_id":"fg_commands_apply_md__","layer_id":"L__","layer":".","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/commands/apply.md","content":"# Especificación: comando `bilinker apply`\n\n## Propósito\n\nAplica los auto-fixes generados por `bilinker check` que están acumulados en `.bilink/.pending/`. Cada aplicación se registra como un commit git con un mensaje descriptivo. El humano siempre confirma antes de que los cambios se escriban.\n\nRequiere git como dependencia dura.\n\n## Firma\n\n```\nbilinker apply [--dry-run] [--filter <estado>] [-y]\n```\n\n| Flag | Descripción |\n|---|---|\n| `--dry-run` | Muestra los fixes que se aplicarían sin escribir nada. |\n| `--filter <estado>` | Aplica solo fixes de un estado específico (e.g., `--filter MOVED`). |\n| `-y` | Omite la confirmación interactiva. |\n\n## Área de staging: `.bilink/.pending/`\n\n`bilinker check` escribe un archivo `.fix` por cada auto-fix pendiente:\n\n```\n.bilink/.pending/\n  7f3d8e9a-1b2c-4d5e-8f6a-7b8c9d0e1f2a-1.fix\n  3a4b5c6d-2e3f-4a5b-9c6d-7e8f9a0b1c2d-0.fix\n```\n\nEl nombre del archivo es `<uuid>-<endpoint>.fix`. Cada `.fix` describe en texto legible el cambio propuesto. El usuario puede leer, editar o eliminar archivos `.fix` antes de correr `apply`.\n\n### Formato de un `.fix`\n\n```\nuuid: 7f3d8e9a-1b2c-4d5e-8f6a-7b8c9d0e1f2a\nendpoint: 1\nstate: MOVED\nchange:\n  file: specs/persona/voting.yaml → specs/domain/voting.yaml\n  git-similarity: R92\n```\n\n## Flujo de `apply`\n\n1. Leer todos los archivos `.fix` en `.bilink/.pending/`.\n2. Mostrar resumen:\n   ```\n   Pending fixes (3):\n     MOVED      7f3d8e9a…  link.1  specs/domain/voting.yaml\n     DISPLACED  3a4b5c6d…  link.0  offset 5~42 → 8~45\n     EXPANDED   f1e2d3c4…  link.0  start~end ampliado\n   ```\n3. Pedir confirmación (o `-y` para omitirla).\n4. Para cada fix, modificar el archivo `.bilink` correspondiente:\n   - **MOVED**: actualizar `file` en `link.N`.\n   - **DISPLACED**: actualizar `start~end` en `link.N`.\n   - **REANCHORED**: actualizar los predicados de la query en `link.N`.\n   - **EXPANDED**: actualizar `start~end` en `link.N` con el nuevo rango.\n5. Actualizar la cache (`range.N`, `state.N`, `resolved_at`). Para EXPANDED y\n   REANCHORED, donde el contenido del fragmento cambió, agrega una nueva entrada estableciendo `hash.N` y `commit.N` con el hash actual y el commit actual.\n6. Eliminar los `.fix` aplicados de `.bilink/.pending/`.\n7. Crear un commit git con todos los `.bilink` modificados.\n\n**Mensaje de commit:**\n\n```\nbilinker: auto-fix MOVED + DISPLACED + EXPANDED (2026-05-24)\n\n- 7f3d8e9a… link.1: MOVED → specs/domain/voting.yaml\n- 3a4b5c6d… link.0: DISPLACED offset 5~42 → 8~45\n- f1e2d3c4… link.0: EXPANDED start~end ampliado\n```\n\n## Salida\n\n```\n$ bilinker apply\n\nPending fixes (3):\n  MOVED      7f3d8e9a…  link.1  specs/domain/voting.yaml\n  DISPLACED  3a4b5c6d…  link.0  offset 5~42 → 8~45\n  EXPANDED   f1e2d3c4…  link.0  start~end ampliado\n\nApply? [y/N] y\n\nApplied 3 fixes.\nCommitted: a4b5c6d \"bilinker: auto-fix MOVED + DISPLACED + EXPANDED (2026-05-24)\"\n```\n\n## Código de salida\n\n| Código | Condición |\n|---|---|\n| 0 | Todos los fixes aplicados exitosamente. |\n| 1 | Error al aplicar algún fix. |\n| 2 | No hay fixes pendientes. |\n\n## Invariantes\n","start_line":1,"lang":"markdown","xi":0,"yi":2},{"id":"commands/capture.md@.#L1","label":"commands/capture.md","file_group_id":"fg_commands_capture_md__","layer_id":"L__","layer":".","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/commands/capture.md","content":"# Especificación: comando `bilinker capture`\n\n## Propósito\n\nGenera una referencia bilinker a partir de una selección de texto en un archivo, identificada por coordenadas de línea y columna. La salida está lista para pegar en un archivo `.bilink`.\n\n## Firma\n\n```\nbilinker capture <workspace> <file> <start_line>:<start_col> <end_line>:<end_col>\n```\n\n| Argumento | Tipo | Descripción |\n|---|---|---|\n| `workspace` | string | Nombre del workspace tal como está definido en `.bilinker.toml`. |\n| `file` | path | Ruta del archivo relativa a la raíz del workspace. |\n| `start_line:start_col` | int:int | Línea y columna de inicio de la selección (1-based). |\n| `end_line:end_col` | int:int | Línea y columna de fin de la selección (1-based). |\n\n## Flujo interno\n\n1. Localizar `.bilinker.toml` desde el directorio de trabajo hacia arriba.\n2. Resolver el workspace por nombre y obtener `path` y `language`.\n3. Leer el archivo y parsearlo con la gramática tree-sitter del lenguaje.\n4. Encontrar el nodo AST más pequeño que contiene la selección completa\n   (`named_descendant_for_point_range`).\n5. Subir en el árbol AST desde ese nodo hasta el primer ancestro que sea un\n   âncora estable para el lenguaje (función, método, clase, heading, campo de mapping, etc.).\n6. Construir la query como el camino del AST desde ese ancestro hasta el nodo\n   target, usando los nombres de campo reales y los tipos de nodo reales del árbol. Cada predicado usa un nombre de captura único (`@n0`, `@n1`, …). El `@target` se coloca después del paréntesis de cierre del nodo.\n7. Determinar si la selección coincide exactamente con los límites del nodo target:\n   - **Exacta**: no incluir `start~end`.\n   - **Parcial**: calcular offsets en bytes relativos al inicio del nodo target\n     e incluir `start~end`.\n8. Calcular el hash SHA-256 del texto exacto del fragmento seleccionado.\n\n## Salida\n\n**stdout** — La referencia lista para copiar:\n\n```\nlink.N: java-demo :: src/main/java/ar/example/demo/persona/Persona.java :: (class_declaration\n  name: (identifier) @n0 (#eq? @n0 \"Persona\")\n  body: (class_body\n    (method_declaration\n      name: (identifier) @n1 (#eq? @n1 \"vote\")) @target))\n```\n\n**stderr** — Metadata informativa:\n\n```\nhash: 479922a1ee55cc7f9f4f323bb002018e1b4e1cda65e069e0f6f4645926ce25ee\n```\n\nEl hash va a stderr para que pueda usarse `capture` en pipes sin contaminar la referencia en stdout.\n\n## Código de salida\n\n| Código | Condición |\n|---|---|\n| 0 | Captura exitosa. |\n| 1 | Error: workspace no encontrado, archivo no existe, selección fuera de rango, lenguaje sin gramática. |\n\n## Ejemplos\n\n### Selección que coincide exactamente con un método Java\n\n```bash\n$ bilinker capture java-demo \\\n    src/main/java/ar/example/demo/persona/Persona.java \\\n    10:5 12:5\n\nlink.N: java-demo :: src/main/java/ar/example/demo/persona/Persona.java :: (class_declaration\n  name: (identifier) @n0 (#eq? @n0 \"Persona\")\n  body: (class_body\n    (method_declaration\n      name: (identifier) @n1 (#eq? @n1 \"vote\")) @target))\n```\n```\n# stderr:\nhash: 479922a1ee55cc7f9f4f323bb002018e1b4e1cda65e069e0f6f4645926ce25ee\n```\n\n### Selección parcial dentro de un párrafo Markdown\n\n```bash\n$ bilinker capture docs architecture.md 34:10 34:52\n\nlink.N: docs :: architecture.md :: (section\n  (atx_heading\n    (inline) @n0 (#eq? @n0 \"Decisión\"))\n  (paragraph) @target) :: 42~87\n```\n```\n# stderr:\nhash: c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4\n```\n\n## Propiedades garantizadas\n","start_line":1,"lang":"markdown","xi":0,"yi":4},{"id":"commands/chain.md@.#L1","label":"commands/chain.md","file_group_id":"fg_commands_chain_md__","layer_id":"L__","layer":".","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/commands/chain.md","content":"# Especificación: comando `bilinker chain`\n\n## Propósito\n\nGestiona las cadenas de bilinks: crear nuevas cadenas, consultar su estado completo y listar todas las cadenas del proyecto.\n\n## Subcomandos\n\n### `bilinker chain new`\n\nCrea una nueva cadena generando un UUID y los archivos `.bilink` en las layers especificadas.\n\n```\nbilinker chain new --tip <layer> \"<referencia-estructural>\" \\\n                   [--mid <layer>]... \\\n                   --tip <layer> \"<referencia-estructural>\"\n```\n\n| Argumento | Descripción |\n|---|---|\n| `--tip <layer> \"<ref>\"` | Extremo de la cadena: layer donde vive el nodo + referencia estructural. Se especifica exactamente dos veces. |\n| `--mid <layer>` | Layer intermedia. Se puede especificar cero o más veces. |\n\nGenera el UUID, crea el archivo `.bilink/<uuid>.bilink` en cada layer especificada con los endpoints correctos (estructurales en los tips, layer en los mids) y la sección de cache vacía (se completa en el primer `check`).\n\n**Ejemplo:**\n\n```bash\nbilinker chain new \\\n  --tip . \"specs :: voting.yaml :: (block_mapping_pair key: (flow_node) @n0 (#eq? @n0 \\\"impl\\\") value: (_) @target)\" \\\n  --tip .stratum/impl \"java-demo :: src/.../Persona.java :: (class_declaration ...)\"\n```\n\n**Salida:**\n\n```\nCreated chain: 7f3d8e9a-1b2c-4d5e-8f6a-7b8c9d0e1f2a\n\n  .bilink/7f3d8e9a-….bilink                    (tip)\n  .stratum/impl/.bilink/7f3d8e9a-….bilink      (tip)\n\nRun 'bilinker check' to populate cache.\n```\n\n---\n\n### `bilinker chain status <uuid>`\n\nMuestra el estado completo de una cadena recorriendo todos sus nodos.\n\n```\nbilinker chain status <uuid>\n```\n\n**Salida:**\n\n```\n$ bilinker chain status 7f3d8e9a-1b2c-4d5e-8f6a-7b8c9d0e1f2a\n\nChain: 7f3d8e9a-1b2c-4d5e-8f6a-7b8c9d0e1f2a  [DIRTY]\n\n  .bilink/                         (tip)   (OK, CHAIN_DIRTY)\n    link.0  specs :: voting.yaml#impl       OK\n    link.1  → .stratum/impl                CHAIN_DIRTY\n\n  .stratum/impl/                   (tip)   (CHAIN_DIRTY, ALTERED)\n    link.0  → spec layer                   CHAIN_DIRTY\n    link.1  java-demo :: Persona#vote      ALTERED\n              source: commit c7d3e9f \"Inline comparator\"\n```\n\n**Estado global de la cadena:**\n\n| Estado | Condición |\n|---|---|\n| OK | Todos los nodos y fragmentos en estado OK. |\n| DIRTY | Algún nodo tiene CHAIN_DIRTY. |\n| BROKEN | Algún nodo tiene estado terminal (ALTERED, DELETED, UNANCHORED, BROKEN). |\n\n---\n\n### `bilinker chain list`\n\nLista todas las cadenas encontradas en el proyecto a partir del directorio actual.\n\n```\nbilinker chain list\n```\n\n**Salida:**\n\n```\n$ bilinker chain list\n\n7f3d8e9a-1b2c-4d5e-8f6a-7b8c9d0e1f2a  [DIRTY]   spec → impl\n3a4b5c6d-2e3f-4a5b-9c6d-7e8f9a0b1c2d  [OK]      spec → impl\nf1e2d3c4-5a6b-7c8d-9e0f-1a2b3c4d5e6f  [BROKEN]  spec → impl\n```\n\n## Código de salida","start_line":1,"lang":"markdown","xi":0,"yi":6},{"id":"commands/check.md@.#L1","label":"commands/check.md","file_group_id":"fg_commands_check_md__","layer_id":"L__","layer":".","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/commands/check.md","content":"# Especificación: comando `bilinker check`\n\n## Propósito\n\nVerifica la consistencia de uno o más bilinks comparando el estado actual de los archivos referenciados contra la cache del `.bilink`. Por cada bilink devuelve una tupla de estados `(state_link0, state_link1)` y actualiza `state.N` en el archivo.\n\nRequiere git como dependencia dura.\n\n## Firma\n\n```\nbilinker check <path>\n```\n\n| Argumento | Tipo | Descripción |\n|---|---|---|\n| `path` | path | Path a un `.bilink` individual, a una carpeta `.bilink/`, o a una layer (procesa recursivamente todos los `.bilink` dentro). |\n\n## Estados — endpoints estructurales (9 estados)\n\n| Estado | Condición | Auto-fix |\n|---|---|---|\n| **OK** | Hash matchea en el offset guardado. | — |\n| **MOVED** | Archivo cambió de path (git rename ≥ 50%); hash matchea en nuevo path. | ✓ Actualiza `file` en `link.N`. |\n| **DISPLACED** | Query matchea; hash en offset diferente dentro del nodo. | ✓ Actualiza `start~end`. |\n| **REANCHORED** | Anchor renombrado/movido; nueva posición detectada en AST. | ✓ Actualiza predicados de query. |\n| **EXPANDED** | Fragmento creció; AST interno sin cambio estructural. | ✓ Amplía `start~end`. |\n| **UNANCHORED** | Query no matchea; anchor no localizado. | — Requiere intervención. |\n| **ALTERED** | Fragmento encontrado; AST interno cambió estructuralmente. | — Requiere intervención. |\n| **DELETED** | Eliminación rastreable en git con `git log -S`. | — Requiere intervención. |\n| **BROKEN** | Ninguna hipótesis aplica. | — Requiere intervención. |\n\n## Estados — endpoints layer (2 estados adicionales)\n\n| Estado | Condición | Auto-fix |\n|---|---|---|\n| **PENDING** | `hash.N` ausente — sin estado aceptado. | — Ejecutar `bilinker accept`. |\n| **CHAIN_DIRTY** | Hash actual del `.bilink` referenciado ≠ `hash.N`. | — Inspeccionar nodo origen. |\n\n## Algoritmo de detección por tipo de endpoint\n\n### Endpoint estructural\n\n```\n1. ¿El archivo existe en el path conocido?\n   NO → git diff -M --name-status HEAD\n        ¿rename ≥ 50%?\n        SÍ → MOVED\n        NO → git log -S \"<hash_fragmento>\" -- <file>\n             SÍ → DELETED\n             NO → BROKEN\n\n2. Ejecutar query tree-sitter.\n   SIN MATCH → buscar anchor en AST actual (mismo tipo de nodo):\n               ¿anchor encontrado con nombre diferente?\n               SÍ → REANCHORED\n               NO → git log -S \"<texto_anchor>\" -- <file>\n                    SÍ → DELETED\n                    NO → UNANCHORED\n\n3. ¿Hash matchea en offset guardado?  → OK\n4. ¿Hash matchea en otro offset del nodo?  → DISPLACED\n5. ¿Texto guardado es subcadena del nodo?\n   SÍ → comparar AST interno:\n        igual → EXPANDED\n        distinto → ALTERED\n   NO → git log -S \"<hash>\" -- <file>\n        SÍ → DELETED\n        NO → BROKEN\n```\n\n### Endpoint layer\n\n```\n1. ¿hash.N ausente?  → PENDING\n2. Resolver path: ../<link.N>/.bilink/<uuid>.bilink\n3. ¿El archivo existe?\n   NO → BROKEN (nodo de la cadena eliminado)\n4. Calcular SHA-256 del archivo completo.\n   == hash.N → OK\n   ≠  hash.N → CHAIN_DIRTY\n```\n\n## Escritura de cache tras resolución\n\nDespués de evaluar cada endpoint, `check` actualiza el archivo `.bilink`:\n\n- **`state.N`** — nuevo estado calculado.\n- **`hash.N` / `commit.N`** — no se modifican. Solo se actualizan con `bilinker accept`.\n- **`range.N`** — byte range absoluto del fragmento en su archivo (`start~end`). Solo para endpoints estructurales; se actualiza siempre que la resolución encuentra el fragmento (OK, DISPLACED, REANCHORED, EXPANDED, ALTERED).\n- **`resolved_at`** — timestamp UTC de esta verificación.\n\nSi `state.N` cambió respecto al valor anterior, el archivo cambia y su hash cambia, disparando CHAIN_DIRTY en el nodo adyacente de la cadena en el próximo `check`.\n\n## Fuente del cambio\n\nPara endpoints estructurales no-OK:\n\n| Condición git | Fuente en salida |\n|---|---|","start_line":1,"lang":"markdown","xi":0,"yi":8},{"id":"commands/get.md@.#L1","label":"commands/get.md","file_group_id":"fg_commands_get_md__","layer_id":"L__","layer":".","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/commands/get.md","content":"# Especificación: comando `bilinker get`\n\n## Propósito\n\nPermite navegar desde una posición en un archivo hacia los fragmentos relacionados a través de bilinks, y recuperar su contenido. Opera en dos formas.\n\n## Forma 1: posición → endpoints que la cubren\n\n```\nbilinker get <file>:<line>:<col>\n```\n\n| Argumento | Tipo | Descripción |\n|---|---|---|\n| `file` | path | Path al archivo (absoluto o relativo al directorio de trabajo). |\n| `line` | int | Línea (1-based). |\n| `col` | int | Columna (1-based). |\n\nRetorna la lista de endpoints de bilinks cuyo `range.N` cubre la posición dada. Cada resultado se identifica como `<UUID>.<N>` y muestra una descripción del fragmento referenciado en el extremo opuesto.\n\nUsa `.bilink/.index` si está disponible y actualizado (O(1)); si no, escanea los `.bilink` de la layer actual (O(N)).\n\n**Salida:**\n\n```\n$ bilinker get src/main/java/ar/example/demo/persona/Persona.java:11:5\n\n7f3d8e9a-1b2c-4d5e-8f6a-7b8c9d0e1f2a.1   specs :: voting.yaml#impl\n3a4b5c6d-2e3f-4a5b-9c6d-7e8f9a0b1c2d.1   specs :: persona/voting.yaml#impl\n```\n\nSi no hay bilinks que cubran esa posición, retorna lista vacía (código 0).\n\n## Forma 2: endpoint → contenido del fragmento referenciado\n\n```\nbilinker get <UUID>.<N> [-B <rows>] [-A <rows>]\n```\n\n| Argumento | Tipo | Descripción |\n|---|---|---|\n| `<UUID>.<N>` | string | Identificador del endpoint: UUID de la cadena + índice (0 o 1). |\n| `-B rows` | int | Líneas de contexto antes del fragmento. |\n| `-A rows` | int | Líneas de contexto después del fragmento. |\n\nResuelve el endpoint `link.N` del bilink `<uuid>.bilink` de la layer actual y retorna el texto del fragmento que referencia.\n\nSi `link.N` es un endpoint layer, resuelve el path Stratum hacia la capa adyacente, localiza el mismo UUID en su `.bilink/`, y retorna el fragmento del endpoint estructural que contiene. Requiere que los archivos de la capa adyacente estén accesibles localmente.\n\n**stdout** — El texto del fragmento.\n\n**stderr** — Metadata:\n\n```\n# specs :: persona/voting.yaml  lines 14–16\n```\n\n**Salida:**\n\n```\n$ bilinker get 7f3d8e9a-1b2c-4d5e-8f6a-7b8c9d0e1f2a.1\n\nimpl: Persona#vote\ndescription: El método vote registra el voto del ciudadano.\n```\n\n```\n$ bilinker get 7f3d8e9a-1b2c-4d5e-8f6a-7b8c9d0e1f2a.1 -B 2 -A 2\n\n  id: persona-voting\n  name: Voting\n\nimpl: Persona#vote\ndescription: El método vote registra el voto del ciudadano.\n\ntests:\n```\n\n## Forma 3: archivo → todos los endpoints que lo referencian\n\n```\nbilinker get <file>\n```\n\n| Argumento | Tipo | Descripción |\n|---|---|---|\n| `file` | path | Path al archivo (absoluto o relativo al directorio de trabajo). |\n\nRetorna todos los endpoints de bilinks que referencian ese archivo, ya sea mediante un endpoint estructural con query AST, un endpoint de archivo completo (`workspace :: file`), o cualquier posición dentro del archivo.\n\nUsa `.bilink/.index` si está disponible y actualizado (O(1)); si no, escanea los `.bilink` de la layer actual (O(N)). En ambos casos, no re-ejecuta queries tree-sitter — el `range.N` de cada bilink encontrado es suficiente.\n\n**Salida:**\n\n```\n$ bilinker get src/main/java/ar/example/demo/persona/Persona.java\n\n7f3d8e9a-1b2c-4d5e-8f6a-7b8c9d0e1f2a.1   specs :: voting.yaml#impl          lines 11–18\n3a4b5c6d-2e3f-4a5b-9c6d-7e8f9a0b1c2d.1   specs :: persona/voting.yaml#impl  lines 11–18\n```","start_line":1,"lang":"markdown","xi":0,"yi":10},{"id":"commands/graph.md@.#L1","label":"commands/graph.md","file_group_id":"fg_commands_graph_md__","layer_id":"L__","layer":".","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/commands/graph.md","content":"# Especificación: comando `bilinker graph`\n\n## Propósito\n\nRecorre el grafo de bilinks a partir de un archivo, fragmento o UUID y muestra todos los nodos conectados, cruzando capas. Responde a la pregunta: *¿con qué está linkedeado esto, y a través de qué caminos?*\n\nEs una herramienta de navegación y exploración — no modifica nada.\n\n## Firma\n\n```\nbilinker graph <selector>\n  [--depth <n>]\n  [--format <tree|flat|dot|html>]\n  [--recursive]\n  [--bilink-detail]\n  [--url-scheme <line|file|none>]\n  [--show-query] [--show-range] [--show-data]\n```\n\n| Argumento / Flag | Descripción |\n|---|---|\n| `selector` | Archivo, posición `archivo:línea:col`, UUID de bilink, `.` (todos en capa actual) o `*` (igual que `.`). |\n| `--depth <n>` | Profundidad máxima de traversal. Por defecto: sin límite. |\n| `--format` | Formato de salida: `tree` (por defecto), `flat`, `dot` (Graphviz), `html` (visor interactivo). |\n| `--recursive` | Con selector `.`/`*`: recolectar bilinks de **todas las capas** bajo la raíz del proyecto. |\n| `--bilink-detail` | En formato `dot`: mostrar nodos intermedios de bilink (diamantes). Por defecto solo se muestran aristas directas entre archivos. |\n| `--url-scheme` | URLs en nodos: `line` (default, `file://path#Lnúmero`), `file` (`file://path`), `none`. |\n| `--show-query` | Incluir query AST en labels de nodos (formatos `dot`). |\n| `--show-range` | Incluir rango de bytes en labels de nodos (formatos `dot`). |\n| `--show-data` | Incluir primera y última línea del fragmento en labels (formatos `dot`). |\n\n## Selectores\n\n| Selector | Comportamiento |\n|----------|----------------|\n| `archivo.md` | Todos los bilinks que referencian ese archivo en la capa actual |\n| `archivo.md:42:5` | Bilinks cuyo `range.N` cubre esa posición |\n| `<uuid>` (8+ hex chars) | Bilink concreto por UUID o prefijo |\n| `.` o `*` | Todos los bilinks en la capa actual (con `--recursive`: en todas las capas) |\n\n## Algoritmo de traversal\n\nBFS sobre el grafo de bilinks. Cada fragmento de archivo es un nodo; los endpoints layer son aristas hacia otras capas.\n\n```\ngraph(selector):\n  1. Resolver selector → lista de bilinks iniciales\n  2. Para cada bilink:\n       emitir fragmento(s) estructural(es)\n       para cada endpoint Layer no visitado:\n         adjacent = stratum::resolve(layer_path)\n         si adjacent/.bilink/uuid.bilink existe: encolar\n  3. Deduplicar por (UUID, layer_root, start_line) — fragmentos distintos\n     del mismo archivo son nodos separados.\n```\n\nUsa `.bilink/.index` si está disponible (O(1)); si no, scan O(N).\n\n## Formato `tree` (default)\n\n```\n$ bilinker graph commands/pull.md\n\ncommands/pull.md\n│\n├── c0feab23  [OK ↔ OK]\n│   │  link.0  commands/pull.md\n│   │  link.1  >impl\n│   │\n│   └── c0feab23  [OK ↔ OK]  (.stratum/impl)\n│       │  link.0  <\n│       │  link.1  crates/estrato-cli/src/main.rs :: (enum_item ...) @target\n│       │\n└── b95021d2  [OK ↔ OK]\n    └── b95021d2  [OK ↔ OK]  (.stratum/impl)\n        │  link.1  crates/estrato-cli/src/main.rs :: (function_item ...) @target\n        │\n```\n\n## Formato `flat`\n\nUna línea por nodo — útil para scripting:\n\n```\n$ bilinker graph commands/pull.md --format flat\n\nc0feab23  OK ↔ OK  commands/pull.md  →  >impl  [.]\nc0feab23  OK ↔ OK  <  →  crates/main.rs :: (enum_item ...)  [.stratum/impl]\n```\n\n## Formato `dot` — Graphviz\n\n```bash\n# Grafo simplificado (aristas directas archivo↔archivo, default)\nbilinker graph \".\" --format dot | dot -Tsvg > graph.svg\n\n# Con nodos bilink intermedios visibles\nbilinker graph \".\" --format dot --bilink-detail | dot -Tsvg > graph.svg\n","start_line":1,"lang":"markdown","xi":0,"yi":12},{"id":"commands/index.md@.#L1","label":"commands/index.md","file_group_id":"fg_commands_index_md__","layer_id":"L__","layer":".","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/commands/index.md","content":"# Especificación: comando `bilinker index`\n\n## Propósito\n\nConstruye o reconstruye el índice `.bilink/.index` de una o más layers, permitiendo que `bilinker get` opere en O(1) en lugar de O(N).\n\n## Firma\n\n```\nbilinker index [<path>] [--recursive]\n```\n\n| Argumento | Tipo | Descripción |\n|---|---|---|\n| `<path>` | path | Layer o directorio raíz donde construir el índice. Por defecto: layer actual (cwd). |\n| `--recursive` | flag | Construye el índice en todas las layers descendientes también. |\n\n## Comportamiento\n\n1. Localiza el directorio `.bilink/` en `<path>`.\n2. Escanea todos los `.bilink` de esa layer (excluyendo `.pending/`).\n3. Para cada endpoint estructural, extrae `(archivo, uuid, N)`.\n4. Escribe `.bilink/.index` con una línea `<archivo>\\t<uuid>.<N>` por entrada.\n5. Si `--recursive`, repite para cada layer descendiente encontrada en `.stratum/`.\n\nEl índice generado reemplaza cualquier versión anterior — la operación es idempotente.\n\n## Salida\n\n```\n$ bilinker index --recursive\n\nindex: .bilink/.index              (3 entradas)\nindex: .stratum/impl/.bilink/.index   (7 entradas)\nindex: .stratum/impl/.bilink/.index   (2 entradas)\n```\n\nCon `--quiet`, solo imprime errores.\n\n## Subcomando `status`\n\n```\nbilinker index status [<path>] [--recursive]\n```\n\nReporta si el índice de cada layer está actualizado, desactualizado o ausente, sin modificar ningún archivo.\n\n```\n$ bilinker index status --recursive\n\n.bilink/.index              OK        (actualizado)\n.stratum/impl/.bilink/.index          STALE     (2 bilinks más nuevos)\n.stratum/impl/.bilink/.index  MISSING\n```\n\n## Cuándo usarlo\n\n- Después de un `git pull` con cambios en `.bilink/`.\n- Después de crear o modificar bilinks en lote (`chain new` múltiple, merge).\n- En CI, como paso previo a comandos que usan `bilinker get` en proyectos grandes.\n- Al agregar bilinker a un proyecto existente con muchos bilinks.\n\n## Relación con otros comandos\n\n`bilinker get` usa el índice si está disponible y actualizado; si no, hace scan O(N) sin error. `bilinker index` es la única forma de construir o actualizar el índice — ningún otro comando lo escribe.\n\n## Exit codes\n\n| Código | Condición |\n|---|---|\n| 0 | Índice construido exitosamente. |\n| 1 | Error de lectura/escritura en alguna layer. |","start_line":1,"lang":"markdown","xi":0,"yi":14},{"id":"commands/status.md@.#L1","label":"commands/status.md","file_group_id":"fg_commands_status_md__","layer_id":"L__","layer":".","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/commands/status.md","content":"# Especificación: comando `bilinker status`\n\n## Propósito\n\nMuestra el estado de todos los bilinks en la capa actual, agrupados por archivo. Equivalente a `git status` pero para el grafo de bilinks.\n\n## Firma\n\n```\nbilinker status [<path>]\n```\n\n| Argumento | Descripción |\n|-----------|-------------|\n| `<path>` | Directorio de la capa a inspeccionar. Por defecto: directorio actual. |\n\n## Salida\n\n```\n$ bilinker status\n\ncommands/\n  accept.md   f715f67e  (OK, OK)\n              6f9fa32c  (OK, OK)\n  graph.md    49218eae  (OK, OK)\n              298e1b92  (OK, OK)\n\nconcepts/\n  bilink.md   1e318d3a  (OK, OK)\n```\n\nCada línea muestra:\n- Nombre del archivo (solo en la primera aparición)\n- UUID corto (8 chars)\n- Estado de ambos endpoints: `(state.0, state.1)`\n\nLos bilinks se agrupan por el directorio del endpoint estructural. Si el bilink no tiene endpoint estructural (solo layer endpoints), aparece bajo `(layer)`.\n\n## Códigos de salida\n\n| Código | Condición |\n|--------|-----------|\n| 0 | Éxito. |\n\n## Propiedades\n\n- **Solo lectura**: no modifica ningún archivo.\n- Usa el estado almacenado en los archivos `.bilink` — no re-ejecuta queries. Para actualizar el estado, correr `bilinker check` primero.","start_line":1,"lang":"markdown","xi":0,"yi":16},{"id":"commands/watch.md@.#L1","label":"commands/watch.md","file_group_id":"fg_commands_watch_md__","layer_id":"L__","layer":".","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/commands/watch.md","content":"# Especificación: comando `bilinker watch`\n\n## Propósito\n\nMonitorea el filesystem en tiempo real y reporta cuando archivos vinculados por bilinks son modificados. Permite detectar drift en el momento en que ocurre, sin esperar a correr `bilinker check`.\n\n## Firma\n\n```\nbilinker watch\n```\n\nSin argumentos. Opera sobre la capa actual (directorio de trabajo).\n\n## Comportamiento\n\n1. Inicia un watcher sobre el directorio raíz de la capa.\n2. Cuando un archivo modificado está referenciado por al menos un bilink estructural, emite una línea por cada cadena afectada.\n3. Continúa hasta recibir Ctrl-C.\n\nLos archivos dentro de `.bilink/` se ignoran.\n\n## Salida\n\n```\n$ bilinker watch\nwatching /home/user/proyecto/subsystems/stratum  (Ctrl-C to stop)\n\nALTERED  crates/estrato-cli/src/main.rs  chain 8e2e749a-fbb9-44aa-9b7f-a57972498371\nALTERED  crates/stratum/src/path.rs      chain 9cfe0db7-65d3-4b26-bb08-ba661dcb071d\n```\n\nCada línea de alerta contiene:\n- `ALTERED` — estado esperado al correr `bilinker check`\n- Path relativo del archivo modificado\n- UUID completo de la cadena afectada\n\n## Notas\n\n- `watch` no actualiza los archivos `.bilink` ni cambia estados — solo notifica.\n- Para confirmar el drift y actualizar el estado, correr `bilinker check` y luego `bilinker accept`.\n- El watcher usa eventos del SO (inotify en Linux, FSEvents en macOS).\n\n## Códigos de salida\n\n| Código | Condición |\n|--------|-----------|\n| 0 | Terminado por Ctrl-C. |\n| 1 | Error al iniciar el watcher. |","start_line":1,"lang":"markdown","xi":0,"yi":18},{"id":"concepts/bilink.md@.#L1","label":"concepts/bilink.md","file_group_id":"fg_concepts_bilink_md__","layer_id":"L__","layer":".","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/concepts/bilink.md","content":"# Especificación: Formato del archivo `.bilink`\n\n## Ubicación y nomenclatura\n\nLos archivos `.bilink` viven en carpetas `.bilink/` dentro de cada layer del proyecto. El nombre del archivo es un **UUID v4** — es simultáneamente el identificador de la cadena a la que pertenece el bilink y el mecanismo de localización entre layers.\n\n```\nbilinker/\n  .bilink/\n    7f3d8e9a-1b2c-4d5e-8f6a-7b8c9d0e1f2a.bilink   ← tip (spec layer)\n  .stratum/\n    impl/\n      .bilink/\n        7f3d8e9a-1b2c-4d5e-8f6a-7b8c9d0e1f2a.bilink   ← tip (impl layer)\n```\n\nEl mismo UUID aparece en todas las layers que participan de una cadena.\n\n## Tipos de endpoint\n\nEl tipo de un endpoint se infiere del valor de `link.N` — no hay prefijo de tipo:\n\n| Tipo | Forma | Descripción |\n|---|---|---|\n| **Estructural** | `file [:: query [:: start~end]]` | Apunta a un archivo o fragmento concreto. |\n| **Layer** | path Stratum | Apunta a un nodo adyacente en otra capa. |\n| **Task** | `task <id>` | Apunta a un ítem del worklist en `<project-root>/.stratum/worklist/<id>.task`. Se hashea y verifica como un endpoint estructural. |\n| **Bilink** | `.bilink/<uuid>.bilink` | Apunta a otro bilink por UUID. Se trata como un archivo estructural. |\n\nUn endpoint estructural puede apuntar a un nodo AST específico (`:: query`) o al archivo completo (sin query).\n\nLos endpoints layer usan el lenguaje de paths Stratum (ver especificación en [Stratum — lenguaje de paths](../../stratum/specific/paths.md)).\n\nUn endpoint bilink referencia un archivo `.bilink` por su path relativo a la raíz de la layer actual. El tipo se reconoce por el prefijo `.bilink/` en el valor.\n\n### Resolución de un endpoint layer\n\nDado `link.N: <stratum-path>` en el archivo `<current-layer>/.bilink/<uuid>.bilink`:\n\n1. Resolver el path Stratum tomando como base la raíz de la layer actual.\n2. Usar el path resultante como `<layer-path>` en la fórmula:\n\n```\nresolved = ../<layer-path>/.bilink/<uuid>.bilink\n```\n\nEl `../` sube del directorio `.bilink/` a la raíz de la layer actual. La carpeta `.bilink/` nunca aparece en el valor de `link.N` — siempre es implícita.\n\n## Topología\n\n### Link directo (misma capa)\n\nUn bilink puede conectar dos fragmentos dentro de la misma capa: ambos `link.N` son endpoints estructurales. Hay un único archivo `.bilink` — no hay chain traversal.\n\n```\n[fragmento A] ←→ [fragmento B]\n```\n\n### Cadena entre capas\n\nUna **cadena** es una secuencia lineal de bilinks con el mismo UUID que conecta dos fragmentos a través de una o más capas. Los tipos de nodo en la cadena son:\n\n- **tip**: un endpoint estructural + un endpoint layer. Son los extremos de la cadena.\n  Siempre hay exactamente dos tips por cadena.\n- **mid**: ambos endpoints son layer paths. Puede haber cero o más mids.\n\n```\n[fragmento] ←→ tip ←→ mid* ←→ tip ←→ [fragmento]\n```\n\nLa topología es estrictamente lineal — sin ciclos ni bifurcaciones.\n\n### Bilink con layer no creada todavía\n\nUn bilink puede declarar un endpoint layer apuntando a una capa que aún no existe. El estado `TODO` indica que la conexión está planeada pero la capa destino no fue creada — no es un error.\n\n```\nlink.0: spec/voting.yaml\nlink.1: .stratum/impl        ← layer que aún no existe\nstate.1: TODO                ← calculado por bilinker check\n```\n\nUna vez creada la capa y aceptado el endpoint, el estado pasa a `OK`.\n\n### Bilink de tarea\n\nUn bilink puede conectar un bilink estructural con un ítem del worklist. Vive en la capa donde se debe ejecutar la tarea.\n\n```\nlink.0: .bilink/<uuid-estructural>.bilink   ← bilink estructural como archivo\nlink.1: task 3a                             ← ítem en worklist\n```\n\n`bilinker check` hashea el archivo de tarea (`<project-root>/.stratum/worklist/3a.task`) como cualquier endpoint estructural — detecta si el contenido de la tarea cambia.\n\n## Estructura del archivo\n\n```\nlink.0: <endpoint>\nlink.1: <endpoint>","start_line":1,"lang":"markdown","xi":0,"yi":20},{"id":"concepts/chain.md@.#L1","label":"concepts/chain.md","file_group_id":"fg_concepts_chain_md__","layer_id":"L__","layer":".","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/concepts/chain.md","content":"# Especificación: Cadenas de bilinks\n\n## Concepto\n\nUn bilink conecta exactamente dos fragmentos estructurales. Hay dos formas:\n\n- **Link directo** — ambos endpoints en la misma layer, un solo archivo `.bilink`.\n  No hay chain traversal. Útil para conectar dos fragmentos dentro de la misma capa.\n- **Cadena** — los fragmentos están en layers distintas. El mismo UUID aparece en\n  un archivo `.bilink` en cada layer involucrada, con endpoints relativos a su posición.\n\nUna **cadena** es una secuencia lineal de bilinks que conecta dos fragmentos estructurales a través de las layers de un proyecto. Todos los bilinks de una cadena comparten el mismo UUID, que es simultáneamente su identificador de cadena y el nombre de su archivo `.bilink`.\n\n## Topología\n\n```mermaid\nflowchart LR\n    FA[\"fragmento A\"] <--> TA[\"tip-A\"]\n    TA <--> M1[\"mid₁\"]\n    M1 <--> M2[\"mid₂\"]\n    M2 <--> TB[\"tip-B\"]\n    TB <--> FB[\"fragmento B\"]\n```\n\n| Tipo de nodo | Endpoint 0 | Endpoint 1 | Posición en cadena |\n|---|---|---|---|\n| **tip** | estructural | layer | extremo (siempre dos por cadena) |\n| **mid** | layer | layer | intermedio (cero o más) |\n\n**Restricciones de topología:**\n- Exactamente dos tips por cadena.\n- Los tips tienen un endpoint estructural y uno layer.\n- Los mids tienen ambos endpoints como layer.\n- La cadena es estrictamente lineal — sin ciclos ni bifurcaciones.\n- Cada archivo `.bilink/<uuid>.bilink` en una layer pertenece a una sola cadena.\n\n## UUID como identificador\n\nEl UUID v4 es generado una sola vez al crear la cadena (`bilinker chain new`). Identifica la cadena y localiza sus nodos: en cualquier layer, el nodo de la cadena es `.bilink/<uuid>.bilink`.\n\nNo existe un archivo de registro central de cadenas — la cadena se descubre recorriendo los endpoints layer desde cualquier nodo.\n\n## Propagación reactiva\n\nEl mecanismo de propagación está integrado en el formato del archivo:\n\n1. `hash.N` de un endpoint layer contiene el SHA-256 del archivo `.bilink`\n   referenciado en el momento de la última aceptación.\n2. `state.N` es parte del archivo — si cambia, el archivo cambia, su hash cambia.\n3. Si el nuevo hash ≠ `hash.N` del nodo adyacente, el próximo `check` detecta CHAIN_DIRTY.\n\n**Flujo de propagación cuando un fragmento cambia:**\n\n```mermaid\nflowchart TD\n    B([\"fragmento B cambia\"]) --> TB[\"tip-B\\nstate.1 = ALTERED\\narchivo tip-B cambia\"]\n    TB --> M[\"mid\\nstate.1 = CHAIN_DIRTY\\narchivo mid cambia\"]\n    M --> TA[\"tip-A\\nstate.1 = CHAIN_DIRTY\"]\n```\n\nNo se requiere índice externo para la propagación — la cadena es autosuficiente.\n\n## Estado de la cadena\n\nEl estado global de una cadena es el **peor estado** entre todos sus nodos:\n\n| Estado global | Condición |\n|---|---|\n| OK | Todos los nodos y fragmentos en estado OK |\n| DIRTY | Algún nodo tiene CHAIN_DIRTY (propagación de cambio pendiente) |\n| BROKEN | Algún nodo tiene estado terminal (ALTERED, DELETED, UNANCHORED, BROKEN) |\n\n## Comandos relacionados\n\nVer especificación completa en [commands/chain.md](commands/chain.md).\n\n### `bilinker chain new`\n\nCrea una nueva cadena generando un UUID y los archivos `.bilink` en las layers especificadas:\n\n```bash\nbilinker chain new \\\n  --tip specs \"specs :: voting.yaml :: (...) @target\" \\\n  --tip .stratum/impl \"java-demo :: src/.../Persona.java :: (...) @target\"\n```\n\nGenera:\n- `.bilink/<uuid>.bilink` (tip en spec layer)\n- `.stratum/impl/.bilink/<uuid>.bilink` (tip en impl layer)\n\n### `bilinker chain status <uuid>`\n\nMuestra el estado completo de la cadena recorriendo todos sus nodos:\n\n```bash\n$ bilinker chain status 7f3d8e9a-1b2c-4d5e-8f6a-7b8c9d0e1f2a\n\nChain: 7f3d8e9a-1b2c-4d5e-8f6a-7b8c9d0e1f2a  [DIRTY]\n\n  .bilink/                    (tip)  (OK, CHAIN_DIRTY)","start_line":1,"lang":"markdown","xi":0,"yi":22},{"id":"concepts/configuration.md@.#L1","label":"concepts/configuration.md","file_group_id":"fg_concepts_configuration_md__","layer_id":"L__","layer":".","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/concepts/configuration.md","content":"# Especificación: Raíz del proyecto\n\n## Resolución de la raíz\n\nbilinker determina la raíz del proyecto buscando desde el directorio de trabajo hacia arriba (directory walk). Se detiene en el primer directorio que contenga alguno de los siguientes marcadores:\n\n1. `.bilink/` — directorio de bilinks del proyecto (marcador primario)\n2. `.git/` — raíz de repositorio git (marcador secundario)\n\nSi ninguno se encuentra, se usa el directorio de trabajo actual como raíz. Esto permite usar bilinker en proyectos nuevos sin ningún paso de inicialización.\n\nNo existe ningún archivo de configuración.\n\n## Uso con múltiples capas y repositorios\n\nCada capa puede ser un repositorio git independiente. bilinker siempre opera en el contexto de **una sola capa**: la raíz encontrada es la raíz de la capa actual.\n\nEsto funciona sin configuración adicional porque **solo se puede crear un bilink sobre un archivo que esté presente en el filesystem local**, lo que implica que el repositorio de esa capa ya está clonado. Por lo tanto:\n\n- Los endpoints estructurales de una capa siempre referencian archivos del repo\n  de esa capa.\n- `git log` siempre corre en el root correcto: el de la capa donde vive el bilink.\n- Para verificar una cadena completa, se corre `bilinker check` en cada capa\n  independientemente.\n\n## Lenguaje de los archivos\n\nEl lenguaje (gramática tree-sitter) se determina automáticamente por la extensión del archivo referenciado:\n\n| Extensión | Lenguaje |\n|-----------|----------|\n| `.java`   | java     |\n| `.rs`     | rust     |\n| otros     | text     |\n\n## Invariantes\n\n- La raíz se resuelve una vez por invocación del CLI.\n- Todos los paths de archivos en endpoints estructurales son relativos a la raíz de su capa.\n- No se requiere configuración explícita del lenguaje: la extensión es suficiente.\n- No existe `.bilinker.toml` ni ningún otro archivo de configuración.","start_line":1,"lang":"markdown","xi":0,"yi":24},{"id":"concepts/consistency.md@.#L1","label":"concepts/consistency.md","file_group_id":"fg_concepts_consistency_md__","layer_id":"L__","layer":".","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/concepts/consistency.md","content":"# Especificación: modelo de consistencia\n\n## Principio fundamental\n\nLa consistencia de un bilink se evalúa por extremo. `check` retorna una tupla `(state_link0, state_link1)` — cada extremo puede estar en un estado diferente. Ejemplos: `(OK, MOVED)`, `(DISPLACED, ALTERED)`, `(OK, OK)`.\n\nLos estados disponibles dependen del tipo de endpoint:\n- **Endpoint estructural**: 10 estados (PENDING, OK, MOVED, DISPLACED, REANCHORED,\n  EXPANDED, UNANCHORED, ALTERED, DELETED, BROKEN).\n- **Endpoint layer**: 5 estados (TODO, PENDING, OK, CHAIN_DIRTY, BROKEN).\n- **Endpoint task**: mismos estados que estructural (es un archivo en worklist).\n\nUn bilink es \"saludable\" si ambos extremos están en {OK, MOVED, DISPLACED, REANCHORED, EXPANDED, TODO}. Requiere acción si alguno está en {PENDING, UNANCHORED, ALTERED, DELETED, BROKEN, CHAIN_DIRTY}.\n\n## Estado TODO (endpoint layer)\n\nCuando `link.N` apunta a una layer que todavía no existe y `hash.N` está ausente, el estado es `TODO`. Indica una intención declarada — no es un error. Se resuelve creando la layer destino y ejecutando `bilinker accept`.\n\nSi la layer existía (tiene `hash.N`) pero desapareció, el estado es `BROKEN` (regresión).\n\n## Estado CHAIN_DIRTY (endpoint layer)\n\nCuando `link.N` apunta a una layer, `hash.N` contiene una **copia del `hash.N` del endpoint estructural del bilink adyacente** en el momento de la última aceptación. Si ese valor difiere del actual, el estado es CHAIN_DIRTY.\n\nEsto evita dependencia circular: aceptar un endpoint layer nunca modifica el archivo adyacente, por lo que no hay cascadas. La propagación es unidireccional desde el endpoint estructural que cambió.\n\nCHAIN_DIRTY no tiene auto-fix directo: se resuelve ejecutando `bilinker accept` en el endpoint layer.\n\n## Persistencia de `state.N`\n\nEl estado de cada endpoint se guarda en el archivo `.bilink` como `state.N`. Esto tiene dos consecuencias:\n\n1. **Propagación reactiva**: si `state.N` cambia, el archivo cambia, su hash cambia,\n   y el nodo adyacente en la cadena detecta CHAIN_DIRTY en el próximo `check`.\n2. **Estado visible sin re-check**: leer el archivo alcanza para saber si el bilink\n   está saludable, sin re-ejecutar toda la verificación.\n\n## Jerarquía de evidencia (endpoints estructurales)\n\nPara determinar el estado, bilinker aplica hipótesis en orden de especificidad:\n\n```\n1. Hash exacto en offset guardado          → OK\n2. Archivo movido (git rename)             → MOVED\n3. Hash exacto en otro offset del nodo    → DISPLACED\n4. Anchor renombrado/movido (AST search)  → REANCHORED\n5. Fragmento creció, AST interno igual    → EXPANDED\n6. Fragmento encontrado, AST interno ≠    → ALTERED\n7. Borrado determinístico (git log -S)    → DELETED\n8. Sin evidencia                          → BROKEN / UNANCHORED\n```\n\n## Definición detallada de cada estado\n\n### PENDING\n\n`hash.N` está ausente — el bilink fue creado pero aún no tiene ningún estado aceptado. Se sale con `bilinker accept`.\n\n### OK\n\nEl hash SHA-256 del texto actual del fragmento (en el offset guardado, o en el nodo completo si no hay `start~end`) == `hash.N`. No se requiere acción.\n\n### CHAIN_DIRTY *(solo endpoint layer)*\n\nEl `hash.N` del endpoint estructural del bilink adyacente ≠ `hash.N` almacenado. El contenido estructural en el otro extremo de la cadena cambió y fue re-aceptado. No hay auto-fix — requiere ejecutar `bilinker accept` en el endpoint layer.\n\n### MOVED\n\nCondiciones necesarias:\n- El archivo en `link.N.file` no existe en su path conocido.\n- `git diff -M --name-status HEAD` detecta rename con similaridad ≥ 50%.\n- El hash del fragmento matchea en el nuevo path.\n\nAuto-fix: actualizar `file` en `link.N` al nuevo path.\n\n### DISPLACED\n\nCondiciones necesarias:\n- La query matchea el nodo target en el archivo actual.\n- El hash NO matchea en el offset guardado.\n- El hash SÍ matchea en algún otro offset dentro del nodo.\n\nCausa típica: texto insertado dentro del mismo nodo antes de la selección.\n\nAuto-fix: actualizar `start~end` al nuevo offset donde se encontró el hash.\n\n### REANCHORED\n\nCondiciones necesarias:\n- La query no matchea ningún nodo en el archivo actual.\n- Buscando en el AST actual con el mismo tipo de nodo anchor, se encuentra un\n  nodo con nombre diferente que contiene el hash del fragmento.\n\nEjemplo: `vote` renombrado a `castVote`.\n\nAuto-fix: actualizar los predicados de la query con el nuevo nombre.\n\n### EXPANDED\n\nCondiciones necesarias:","start_line":1,"lang":"markdown","xi":0,"yi":26},{"id":"concepts/index.md@.#L1","label":"concepts/index.md","file_group_id":"fg_concepts_index_md__","layer_id":"L__","layer":".","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/concepts/index.md","content":"# Especificación: índice de bilinks por archivo\n\n## Problema\n\nEncontrar todos los bilinks que referencian un archivo dado requiere escanear todos los `.bilink` del proyecto — O(N) donde N es el número de bilinks totales. Para proyectos grandes esto puede ser lento.\n\n## Solución: `.bilink/.index`\n\nCada layer puede tener un archivo `.bilink/.index` que mapea archivos fuente a los endpoints de bilinks que los referencian. La búsqueda pasa de O(N) a O(1).\n\nEl índice es **opcional y regenerable**. Si no existe o está desactualizado, los comandos que lo usan caen al scan O(N). Nunca es fuente de verdad — siempre puede reconstruirse a partir de los `.bilink`.\n\n## Formato\n\n```\ndocs/api-spec.md\t7f3d8e9a-1b2c-4d5e-8f6a-7b8c9d0e1f2a.0\nsrc/Service.java\ta3f9c821-4e5b-4c3d-9f2a-1b2c3d4e5f6a.1\nsrc/Service.java\t7f3d8e9a-1b2c-4d5e-8f6a-7b8c9d0e1f2a.0\n```\n\n- Una entrada por línea: `<archivo>\\t<uuid>.<N>`, separados por tabulador.\n- Un mismo archivo puede tener múltiples entradas.\n- Las líneas que comienzan con `#` son comentarios y se ignoran.\n- Encoding UTF-8 sin BOM.\n\nLa ruta del archivo es relativa a la raíz de la layer que contiene el `.bilink/`. El resto de la información (query, range, state) vive en el `.bilink` y se lee de ahí cuando es necesario.\n\n## Ubicación\n\n```\n<layer-root>/\n  .bilink/\n    .index              ← índice de esta layer\n    7f3d8e9a-….bilink\n    a3f9c821-….bilink\n```\n\nCada layer tiene su propio índice. El índice solo cubre los endpoints estructurales de los bilinks que viven en esa layer — no endpoints layer ni bilinks de otras layers.\n\n## Detección de obsolescencia\n\nEl índice se considera válido si su mtime es mayor o igual al mtime del `.bilink` más reciente en el mismo directorio. Si algún `.bilink` es más nuevo que el índice, el índice está desactualizado.\n\nLos comandos que usan el índice lo verifican antes de usarlo:\n- Índice válido → lookup O(1).\n- Índice ausente o desactualizado → scan O(N) sobre los `.bilink` de la layer.\n\nEl scan de fallback nunca regenera el índice automáticamente — eso es responsabilidad explícita de `bilinker index`.\n\n## Relación con `range.N`\n\nEl índice responde \"¿qué bilinks referencian este archivo?\" en O(1). Una vez recuperados los UUIDs relevantes, leer `range.N` de cada `.bilink` es O(1) por bilink — ya está resuelto en el archivo.\n\nEl índice no almacena ranges ni queries. Esa información vive en el `.bilink` y puede cambiar con cada `check` o `accept`.\n\n## Git\n\nEl índice puede estar bajo control de versiones o en `.gitignore`, según la preferencia del equipo:\n\n- **Bajo git**: el índice refleja el estado del repo; los merges pueden\n  generar conflictos triviales que se resuelven con `bilinker index`.\n- **En `.gitignore`**: cada desarrollador construye su índice localmente.\n  Recomendado para proyectos con muchos cambios frecuentes en bilinks.\n\n## Invariantes\n\n1. El índice es un derivado — nunca modifica la fuente de verdad (los `.bilink`).\n2. Un índice válido es consistente con los `.bilink` actuales de su layer.\n3. La ausencia del índice nunca es un error — degrada a O(N) silenciosamente.\n4. El índice no cubre endpoints layer, solo endpoints estructurales.","start_line":1,"lang":"markdown","xi":0,"yi":28},{"id":"concepts/reference.md@.#L1","label":"concepts/reference.md","file_group_id":"fg_concepts_reference_md__","layer_id":"L__","layer":".","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/concepts/reference.md","content":"# Referencia: tipos de endpoint\n\nUn `link.N` en un archivo `.bilink` puede ser de cuatro tipos. El tipo se infiere del valor — no hay prefijo explícito de tipo.\n\n## Discriminación de tipos\n\n| Condición | Tipo |\n|---|---|\n| Comienza con `task ` | **Task** |\n| Contiene `::` | **Estructural** |\n| Último componente tiene extensión (contiene `.`) | **Estructural** (archivo completo) |\n| Ninguna de las anteriores | **Layer** |\n\n---\n\n## Endpoint estructural\n\nIdentifica un archivo o fragmento dentro de un archivo.\n\n### Forma completa\n\n```\nfile :: query [:: start~end]\n```\n\n### Solo archivo\n\n```\nfile.ext\n```\n\n### `file`\n\nRuta relativa a la raíz de la layer actual.\n\n### `query`\n\nS-expression tree-sitter que identifica el nodo AST contenedor del fragmento. La captura de resultado usa `@target`:\n\n```scheme\n; Método en clase Java\n(class_declaration\n  name: (identifier) @n0 (#eq? @n0 \"Persona\")\n  body: (class_body\n    (method_declaration\n      name: (identifier) @n1 (#eq? @n1 \"vote\")) @target))\n\n; Párrafo bajo heading en Markdown\n(section\n  (atx_heading (inline) @n0 (#eq? @n0 \"Decisión\"))\n  (paragraph) @target)\n\n; Campo en YAML\n(block_mapping_pair\n  key: (flow_node) @n0 (#eq? @n0 \"impl\")\n  value: (_) @target)\n\n; Función top-level en Rust\n(function_item\n  name: (identifier) @n0 (#eq? @n0 \"process_event\")) @target\n```\n\nReglas:\n- `@target` va **fuera** del paréntesis de cierre del nodo.\n- Capturas auxiliares usan nombres únicos incrementales: `@n0`, `@n1`, `@n2`, …\n\n### `start~end` (opcional)\n\nOffsets en bytes relativos al inicio del nodo `@target`. Se omite cuando la selección es el nodo completo.\n\n### Representación multilínea\n\nLas líneas de continuación (que no comienzan con clave reconocida) se concatenan al valor anterior con un espacio:\n\n```\nlink.0: src/Persona.java :: (class_declaration\n  name: (identifier) @n0 (#eq? @n0 \"Persona\")\n  body: (class_body\n    (method_declaration\n      name: (identifier) @n1 (#eq? @n1 \"vote\")) @target))\n```\n\n### `hash.N` y `commit.N`\n\nSHA-256 del fragmento y commit del repo al momento de la última aceptación.\n\n---\n\n## Endpoint layer\n\nIdentifica una layer adyacente usando un path Stratum.\n\n### Forma\n\n```\nlink.N: <stratum-path>\n```\n\nLa ruta es relativa a la raíz de la layer actual. `.bilink/` es implícito — nunca aparece en el valor.\n","start_line":1,"lang":"markdown","xi":0,"yi":30},{"id":"crates/bilinker-cli/src/html_graph.rs@.stratum/impl#L1","label":"crates/bilinker-cli/src/html_graph.rs","file_group_id":"fg_crates_bilinker_cli_src_html_graph_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/src/html_graph.rs","content":"use std::collections::{BTreeMap, HashMap, HashSet};\nuse std::path::Path;\nuse bilinker::link::{LinkEndpoint, ByteRange};\nuse bilinker::bilink::BiLinkFile;\n\n// ─── helpers ──────────────────────────────────────────────────────────────────\n\npub fn esc_json(s: &str) -> String {\n    s.replace('\\\\', \"\\\\\\\\\")\n     .replace('\"',  \"\\\\\\\"\")\n     .replace('\\n', \"\\\\n\")\n     .replace('\\r', \"\\\\r\")\n     .replace('\\t', \"\\\\t\")\n}\n\npub fn layer_id(label: &str) -> String {\n    format!(\"L_{}\", label.replace(['/', '.', '-'], \"_\"))\n}\n\npub fn layer_depth(label: &str) -> usize {\n    if label == \".\" { 0 } else { label.matches(\".stratum/\").count() }\n}\n\nfn lang_from_file(file: &str) -> &'static str {\n    match file.rsplit('.').next().unwrap_or(\"\") {\n        \"rs\"           => \"rust\",\n        \"md\"           => \"markdown\",\n        \"toml\"         => \"toml\",\n        \"java\"         => \"java\",\n        \"ts\" | \"tsx\"   => \"typescript\",\n        \"js\" | \"jsx\"   => \"javascript\",\n        \"py\"           => \"python\",\n        \"yaml\" | \"yml\" => \"yaml\",\n        \"json\"         => \"json\",\n        \"sql\"          => \"sql\",\n        \"sh\" | \"bash\"  => \"bash\",\n        \"html\"         => \"html\",\n        \"css\"          => \"css\",\n        _              => \"plaintext\",\n    }\n}\n\n// ─── data model ───────────────────────────────────────────────────────────────\n\npub struct HtmlNode {\n    pub id:         String,\n    pub file:       String,   // relative file path within layer\n    pub label:      String,\n    pub layer:      String,\n    pub abs_path:   String,\n    pub content:    String,\n    pub start_line: usize,\n    pub lang:       &'static str,\n}\n\npub struct HtmlEdge {\n    pub id:     String,\n    pub source: String,\n    pub target: String,\n    pub label:  String,\n    pub states: String,\n}\n\n#[derive(Default)]\npub struct HtmlGraph {\n    layers:     BTreeMap<String, usize>,\n    nodes:      Vec<HtmlNode>,\n    edges:      Vec<HtmlEdge>,\n    seen_nodes: HashSet<String>,\n    seen_edges: HashSet<String>,\n}\n\nimpl HtmlGraph {\n    pub fn new() -> Self { Self::default() }\n\n    pub fn add_node(&mut self, node: HtmlNode) {\n        let depth = layer_depth(&node.layer);\n        self.layers.insert(node.layer.clone(), depth);\n        if self.seen_nodes.insert(node.id.clone()) {\n            self.nodes.push(node);\n        }\n    }\n\n    pub fn add_edge(&mut self, edge: HtmlEdge) {\n        let key = if edge.source <= edge.target {\n            format!(\"{}↔{}↔{}\", edge.source, edge.target, edge.label)\n        } else {\n            format!(\"{}↔{}↔{}\", edge.target, edge.source, edge.label)\n        };\n        if self.seen_edges.insert(key) { self.edges.push(edge); }\n    }\n\n    pub fn emit(&self) -> String {\n        let layers_json = self.layers.iter().map(|(lbl, depth)| {\n            format!(r#\"{{\"id\":\"{}\",\"label\":\"{}\",\"depth\":{}}}\"#,\n                esc_json(&layer_id(lbl)), esc_json(lbl), depth)\n        }).collect::<Vec<_>>().join(\",\");\n\n        // Build file-group nodes: one per (file, layer) pair\n        let fg_id = |file: &str, layer: &str| -> String {","start_line":1,"lang":"rust","xi":1,"yi":0},{"id":"crates/bilinker-cli/src/html_graph.rs@.stratum/impl#L65","label":"crates/bilinker-cli/src/html_graph.rs#L65","file_group_id":"fg_crates_bilinker_cli_src_html_graph_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/src/html_graph.rs","content":"pub struct HtmlGraph {\n    layers:     BTreeMap<String, usize>,\n    nodes:      Vec<HtmlNode>,\n    edges:      Vec<HtmlEdge>,\n    seen_nodes: HashSet<String>,\n    seen_edges: HashSet<String>,\n}","start_line":65,"lang":"rust","xi":1,"yi":1},{"id":"crates/bilinker-cli/src/html_graph.rs@.stratum/impl#L185","label":"crates/bilinker-cli/src/html_graph.rs#L185","file_group_id":"fg_crates_bilinker_cli_src_html_graph_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/src/html_graph.rs","content":"pub fn collect(\n    root: &Path,\n    bl: &BiLinkFile,\n    layer_root: &Path,\n    visited: &mut HashSet<String>,\n    hg: &mut HtmlGraph,\n    url_scheme: &str,\n    depth: usize,\n    max_depth: Option<usize>,\n) -> anyhow::Result<()> {\n    let uuid_short = &bl.uuid[..8.min(bl.uuid.len())];\n    let s0 = bilinker::state_str(&bl.state0);\n    let s1 = bilinker::state_str(&bl.state1);\n    let lbl = crate::layer_label(root, layer_root);\n\n    let local_id = add_structural(bl, layer_root, &lbl, hg, url_scheme);\n\n    if max_depth.map_or(true, |d| depth < d) {\n        for (adj_path, adj_layer) in crate::layer_children(bl, layer_root) {\n            let key = crate::visit_key(&bl.uuid, &adj_layer);\n            let already = visited.contains(&key);\n            if !already { visited.insert(key); }\n\n            let adj_bl  = BiLinkFile::load(&adj_path)?;\n            let adj_lbl = crate::layer_label(root, &adj_layer);\n            let adj_id  = add_structural(&adj_bl, &adj_layer, &adj_lbl, hg, url_scheme);\n\n            if let (Some(ref lid), Some(ref aid)) = (&local_id, &adj_id) {\n                // structural endpoint state from each side\n                let src_state = worst_state_str(&[&bl.state0, &bl.state1]);\n                let tgt_state = worst_state_str(&[&adj_bl.state0, &adj_bl.state1]);\n                hg.add_edge(HtmlEdge {\n                    id:     format!(\"e_{uuid_short}_{}\", &lid[..8.min(lid.len())]),\n                    source: lid.clone(),\n                    target: aid.clone(),\n                    label:  uuid_short.to_string(),\n                    states: format!(\"{src_state}↔{tgt_state}\"),\n                });\n            }\n\n            if !already {\n                collect(root, &adj_bl, &adj_layer, visited, hg, url_scheme, depth + 1, max_depth)?;\n            }\n        }\n    }\n    Ok(())\n}","start_line":185,"lang":"rust","xi":1,"yi":2},{"id":"crates/bilinker-cli/src/main.rs@.stratum/impl#L1","label":"crates/bilinker-cli/src/main.rs","file_group_id":"fg_crates_bilinker_cli_src_main_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/src/main.rs","content":"mod html_graph;\n\n\nuse clap::{ArgAction, Parser, Subcommand};\nuse std::path::{Path, PathBuf};\n\n#[derive(Parser)]\n#[command(name = \"bilinker\", about = \"Universal bidirectional structural references\")]\nstruct Cli {\n    #[command(subcommand)]\n    command: Command,\n}\n\n#[derive(Subcommand)]\nenum Command {\n    /// Capture a bilink endpoint from a file selection\n    ///\n    /// FILE is relative to the project root (.bilinker.toml).\n    /// START and END are line:col positions (1-based).\n    Capture {\n        file: String,\n        start: String,\n        end: String,\n    },\n\n    /// Print content or list bilinks referencing a file/position\n    ///\n    /// Forms:\n    ///   get <UUID>.<N>          — show fragment content at endpoint N\n    ///   get <file>:<line>:<col> — list bilinks whose range covers that position\n    ///   get <file>              — list all bilinks referencing that file\n    Get {\n        target: String,\n        #[arg(short = 'B', value_name = \"rows:cols\")]\n        before: Option<String>,\n        #[arg(short = 'A', value_name = \"rows:cols\")]\n        after: Option<String>,\n    },\n\n    /// Verify bilinks in a .bilink file or directory\n    Check {\n        path: PathBuf,\n    },\n\n    /// Watch for changes in linked files and alert on drift\n    Watch,\n\n    /// Apply pending auto-fixes from check\n    Apply {\n        #[arg(long)]\n        dry_run: bool,\n        #[arg(short = 'y')]\n        yes: bool,\n    },\n\n    /// Manage chains of bilinks\n    Chain {\n        #[command(subcommand)]\n        sub: ChainCommand,\n    },\n\n    /// Build or check the .bilink/.index\n    Index {\n        #[command(subcommand)]\n        sub: IndexCommand,\n    },\n\n    /// Accept bilink endpoints, establishing their hash baseline\n    ///\n    /// Forms (like git add):\n    ///   accept .                 — all PENDING in current .bilink/\n    ///   accept commands/         — PENDING endpoints pointing into that directory\n    ///   accept commands/check.md — PENDING endpoints pointing to that file\n    ///   accept <uuid>            — both endpoints of that UUID\n    ///   accept <uuid>.<0|1>      — one specific endpoint\n    Accept {\n        /// path, UUID, or UUID.N\n        target: String,\n        /// Override the computed hash\n        #[arg(long)]\n        hash: Option<String>,\n        /// Override the git commit\n        #[arg(long)]\n        commit: Option<String>,\n    },\n\n    /// Show status of all bilinks in the current layer (like git status)\n    Status {\n        /// Layer directory to inspect (default: current directory)\n        path: Option<PathBuf>,\n    },\n\n    /// Traverse the bilink graph from a file, position, or UUID\n    Graph {\n        /// File, file:line:col, or UUID\n        selector: String,\n        /// Maximum traversal depth (default: unlimited)\n        #[arg(long)]\n        depth: Option<usize>,\n        /// Output format: tree, flat, dot","start_line":1,"lang":"rust","xi":1,"yi":4},{"id":"crates/bilinker-cli/src/main.rs@.stratum/impl#L15","label":"crates/bilinker-cli/src/main.rs#L15","file_group_id":"fg_crates_bilinker_cli_src_main_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/src/main.rs","content":"enum Command {\n    /// Capture a bilink endpoint from a file selection\n    ///\n    /// FILE is relative to the project root (.bilinker.toml).\n    /// START and END are line:col positions (1-based).\n    Capture {\n        file: String,\n        start: String,\n        end: String,\n    },\n\n    /// Print content or list bilinks referencing a file/position\n    ///\n    /// Forms:\n    ///   get <UUID>.<N>          — show fragment content at endpoint N\n    ///   get <file>:<line>:<col> — list bilinks whose range covers that position\n    ///   get <file>              — list all bilinks referencing that file\n    Get {\n        target: String,\n        #[arg(short = 'B', value_name = \"rows:cols\")]\n        before: Option<String>,\n        #[arg(short = 'A', value_name = \"rows:cols\")]\n        after: Option<String>,\n    },\n\n    /// Verify bilinks in a .bilink file or directory\n    Check {\n        path: PathBuf,\n    },\n\n    /// Watch for changes in linked files and alert on drift\n    Watch,\n\n    /// Apply pending auto-fixes from check\n    Apply {\n        #[arg(long)]\n        dry_run: bool,\n        #[arg(short = 'y')]\n        yes: bool,\n    },\n\n    /// Manage chains of bilinks\n    Chain {\n        #[command(subcommand)]\n        sub: ChainCommand,\n    },\n\n    /// Build or check the .bilink/.index\n    Index {\n        #[command(subcommand)]\n        sub: IndexCommand,\n    },\n\n    /// Accept bilink endpoints, establishing their hash baseline\n    ///\n    /// Forms (like git add):\n    ///   accept .                 — all PENDING in current .bilink/\n    ///   accept commands/         — PENDING endpoints pointing into that directory\n    ///   accept commands/check.md — PENDING endpoints pointing to that file\n    ///   accept <uuid>            — both endpoints of that UUID\n    ///   accept <uuid>.<0|1>      — one specific endpoint\n    Accept {\n        /// path, UUID, or UUID.N\n        target: String,\n        /// Override the computed hash\n        #[arg(long)]\n        hash: Option<String>,\n        /// Override the git commit\n        #[arg(long)]\n        commit: Option<String>,\n    },\n\n    /// Show status of all bilinks in the current layer (like git status)\n    Status {\n        /// Layer directory to inspect (default: current directory)\n        path: Option<PathBuf>,\n    },\n\n    /// Traverse the bilink graph from a file, position, or UUID\n    Graph {\n        /// File, file:line:col, or UUID\n        selector: String,\n        /// Maximum traversal depth (default: unlimited)\n        #[arg(long)]\n        depth: Option<usize>,\n        /// Output format: tree, flat, dot\n        #[arg(long, default_value = \"tree\", value_name = \"FORMAT\")]\n        format: String,\n        /// Collect bilinks from all layers under the project root\n        #[arg(long)]\n        recursive: bool,\n        /// Show intermediate bilink nodes as diamonds (default: direct file-to-file edges)\n        #[arg(long)]\n        bilink_detail: bool,\n        /// URL scheme for node links in dot format: line (default), file, none\n        #[arg(long, default_value = \"line\", value_name = \"SCHEME\")]\n        url_scheme: String,\n        /// Show AST query in node labels (dot format)\n        #[arg(long)]\n        show_query: bool,","start_line":15,"lang":"rust","xi":1,"yi":5},{"id":"crates/bilinker-cli/src/main.rs@.stratum/impl#L667","label":"crates/bilinker-cli/src/main.rs#L667","file_group_id":"fg_crates_bilinker_cli_src_main_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker-cli/src/main.rs","content":"fn print_status(layer: &Path) -> anyhow::Result<()> {\n    use std::collections::BTreeMap;\n    use bilinker::bilink::BiLinkFile;\n    use bilinker::link::LinkEndpoint;\n\n    let bilink_dir = layer.join(\".bilink\");\n    if !bilink_dir.exists() {\n        eprintln!(\"no .bilink/ in {}\", layer.display());\n        return Ok(());\n    }\n\n    struct Row {\n        file_name: String,\n        uuid_short: String,\n        s0: String,\n        s1: String,\n    }\n\n    let mut groups: BTreeMap<String, Vec<Row>> = BTreeMap::new();\n\n    for entry in std::fs::read_dir(&bilink_dir)? {\n        let path = entry?.path();\n        if path.extension().and_then(|e| e.to_str()) != Some(\"bilink\") { continue; }\n        if path.file_name().and_then(|n| n.to_str())\n            .map(|n| n.starts_with('.')).unwrap_or(false) { continue; }\n\n        let Ok(bl) = BiLinkFile::load(&path) else { continue };\n\n        // Group by the structural endpoint's parent directory\n        let (dir, file_name) = {\n            let sref = match (&bl.link0, &bl.link1) {\n                (LinkEndpoint::Structural(s), _) => Some(&s.file),\n                (_, LinkEndpoint::Structural(s)) => Some(&s.file),\n                _ => None,\n            };\n            match sref {\n                Some(f) => {\n                    let p = std::path::Path::new(f);\n                    let dir = p.parent().and_then(|d| if d.as_os_str().is_empty() { None } else { Some(d) })\n                        .map(|d| d.display().to_string())\n                        .unwrap_or_else(|| \".\".to_string());\n                    let name = p.file_name().map(|n| n.to_string_lossy().to_string())\n                        .unwrap_or_else(|| f.clone());\n                    (dir, name)\n                }\n                None => (\"(layer)\".to_string(), bl.uuid.clone()),\n            }\n        };\n\n        let uuid_short = bl.uuid[..8.min(bl.uuid.len())].to_string();\n        let s0 = bilinker::state_str(&bl.state0);\n        let s1 = bilinker::state_str(&bl.state1);\n\n        groups.entry(dir).or_default().push(Row { file_name, uuid_short, s0, s1 });\n    }\n\n    if groups.is_empty() {\n        println!(\"(no bilinks)\");\n        return Ok(());\n    }\n\n    for (dir, mut rows) in groups {\n        println!(\"{dir}/\");\n        rows.sort_by(|a, b| a.file_name.cmp(&b.file_name));\n\n        let max_name = rows.iter().map(|r| r.file_name.len()).max().unwrap_or(0);\n        let mut prev = String::new();\n        for row in &rows {\n            let label = if row.file_name != prev {\n                format!(\"{:<width$}\", row.file_name, width = max_name)\n            } else {\n                format!(\"{:<width$}\", \"\", width = max_name)\n            };\n            println!(\"  {}  {}  ({}, {})\", label, row.uuid_short, row.s0, row.s1);\n            prev = row.file_name.clone();\n        }\n        println!();\n    }\n\n    Ok(())\n}","start_line":667,"lang":"rust","xi":1,"yi":6},{"id":"crates/bilinker/src/accept.rs@.stratum/impl#L1","label":"crates/bilinker/src/accept.rs","file_group_id":"fg_crates_bilinker_src_accept_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/accept.rs","content":"use std::path::Path;\nuse anyhow::{bail, Context, Result};\nuse chrono::Utc;\n\nuse crate::bilink::BiLinkFile;\nuse crate::chain::resolve_layer_link;\nuse crate::git::try_head_commit_for_file;\nuse crate::grammar;\nuse crate::hash;\nuse crate::link::{EndpointState, LinkEndpoint};\nuse crate::query;\nuse crate::task::resolve_task_path;\n\npub struct AcceptResult {\n    pub uuid: String,\n    pub n: u8,\n    pub hash: String,\n    pub commit: String,\n}\n\n/// Accept endpoint `n` of the bilink at `bilink_path`, establishing its hash baseline.\n///\n/// Sets `hash.N`, `commit.N`, `state.N = OK`, and `resolved_at` in the file.\npub fn accept(\n    bilink_path: &Path,\n    n: u8,\n    hash_override: Option<&str>,\n    commit_override: Option<&str>,\n) -> Result<AcceptResult> {\n    if n > 1 {\n        bail!(\"endpoint index must be 0 or 1, got {n}\");\n    }\n\n    let mut bl = BiLinkFile::load(bilink_path)?;\n\n    let layer_root = bilink_path\n        .parent().and_then(|p| p.parent())\n        .unwrap_or(bilink_path);\n\n    let endpoint = if n == 0 { &bl.link0 } else { &bl.link1 };\n\n    let (h, c) = compute_hash_and_commit(\n        layer_root, endpoint, &bl.uuid, hash_override, commit_override,\n    )?;\n\n    if n == 0 {\n        bl.hash0   = Some(h.clone());\n        bl.commit0 = Some(c.clone());\n        bl.state0  = Some(EndpointState::Ok);\n    } else {\n        bl.hash1   = Some(h.clone());\n        bl.commit1 = Some(c.clone());\n        bl.state1  = Some(EndpointState::Ok);\n    }\n    bl.resolved_at = Some(Utc::now().format(\"%Y-%m-%dT%H:%M:%SZ\").to_string());\n    bl.write(bilink_path)?;\n\n    Ok(AcceptResult { uuid: bl.uuid, n, hash: h, commit: c })\n}\n\nfn compute_hash_and_commit(\n    layer_root: &Path,\n    endpoint: &LinkEndpoint,\n    uuid: &str,\n    hash_override: Option<&str>,\n    commit_override: Option<&str>,\n) -> Result<(String, String)> {\n    match endpoint {\n        LinkEndpoint::Structural(sref) => {\n            let file_path = layer_root.join(&sref.file);\n            let source = std::fs::read_to_string(&file_path)\n                .with_context(|| format!(\"reading {}\", file_path.display()))?;\n\n            let frag_hash = if let Some(query_str) = &sref.query {\n                let lang     = grammar::language_for_file(&sref.file);\n                let language = grammar::for_language(lang)?;\n                let node_range = query::find_target(language, &source, query_str)?;\n                let (node_start, node_end) = node_range\n                    .ok_or_else(|| anyhow::anyhow!(\n                        \"query matched nothing in '{}'; cannot accept\", sref.file\n                    ))?;\n                let (frag_start, frag_end) = match &sref.range {\n                    Some(r) => (node_start + r.start, (node_start + r.end).min(source.len())),\n                    None    => (node_start, node_end),\n                };\n                hash::sha256(source[frag_start..frag_end].as_bytes())\n            } else {\n                hash::sha256(source.as_bytes())\n            };\n\n            let h = hash_override.map(String::from).unwrap_or(frag_hash);\n            let c = commit_override.map(String::from)\n                .unwrap_or_else(|| try_head_commit_for_file(layer_root, &sref.file)\n                    .unwrap_or_default());\n            Ok((h, c))\n        }\n\n        LinkEndpoint::Task(id) => {\n            let (task_path, project_root) = resolve_task_path(layer_root, id);\n            let source = std::fs::read_to_string(&task_path)","start_line":1,"lang":"rust","xi":1,"yi":8},{"id":"crates/bilinker/src/accept.rs@.stratum/impl#L24","label":"crates/bilinker/src/accept.rs#L24","file_group_id":"fg_crates_bilinker_src_accept_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/accept.rs","content":"pub fn accept(\n    bilink_path: &Path,\n    n: u8,\n    hash_override: Option<&str>,\n    commit_override: Option<&str>,\n) -> Result<AcceptResult> {\n    if n > 1 {\n        bail!(\"endpoint index must be 0 or 1, got {n}\");\n    }\n\n    let mut bl = BiLinkFile::load(bilink_path)?;\n\n    let layer_root = bilink_path\n        .parent().and_then(|p| p.parent())\n        .unwrap_or(bilink_path);\n\n    let endpoint = if n == 0 { &bl.link0 } else { &bl.link1 };\n\n    let (h, c) = compute_hash_and_commit(\n        layer_root, endpoint, &bl.uuid, hash_override, commit_override,\n    )?;\n\n    if n == 0 {\n        bl.hash0   = Some(h.clone());\n        bl.commit0 = Some(c.clone());\n        bl.state0  = Some(EndpointState::Ok);\n    } else {\n        bl.hash1   = Some(h.clone());\n        bl.commit1 = Some(c.clone());\n        bl.state1  = Some(EndpointState::Ok);\n    }\n    bl.resolved_at = Some(Utc::now().format(\"%Y-%m-%dT%H:%M:%SZ\").to_string());\n    bl.write(bilink_path)?;\n\n    Ok(AcceptResult { uuid: bl.uuid, n, hash: h, commit: c })\n}","start_line":24,"lang":"rust","xi":1,"yi":9},{"id":"crates/bilinker/src/bilink.rs@.stratum/impl#L1","label":"crates/bilinker/src/bilink.rs","file_group_id":"fg_crates_bilinker_src_bilink_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/bilink.rs","content":"use std::path::{Path, PathBuf};\nuse anyhow::{bail, Context, Result};\n\nuse crate::link::{ByteRange, EndpointState, LinkEndpoint};\n\n#[derive(Debug)]\npub struct BiLinkFile {\n    pub uuid: String,\n    pub link0: LinkEndpoint,\n    pub link1: LinkEndpoint,\n    pub hash0: Option<String>,\n    pub commit0: Option<String>,\n    pub hash1: Option<String>,\n    pub commit1: Option<String>,\n    pub range0: Option<ByteRange>,\n    pub range1: Option<ByteRange>,\n    pub state0: Option<EndpointState>,\n    pub state1: Option<EndpointState>,\n    pub resolved_at: Option<String>,\n}\n\nimpl BiLinkFile {\n    pub fn load(path: &Path) -> Result<Self> {\n        let text = std::fs::read_to_string(path)\n            .with_context(|| format!(\"reading {}\", path.display()))?;\n        let uuid = path\n            .file_stem()\n            .and_then(|s| s.to_str())\n            .unwrap_or(\"\")\n            .to_string();\n        Self::parse(&text, &uuid).with_context(|| format!(\"parsing {}\", path.display()))\n    }\n\n    pub fn parse(text: &str, uuid: &str) -> Result<Self> {\n        let mut link0: Option<String> = None;\n        let mut link1: Option<String> = None;\n        let mut hash0 = None;\n        let mut commit0 = None;\n        let mut hash1 = None;\n        let mut commit1 = None;\n        let mut range0 = None;\n        let mut range1 = None;\n        let mut state0 = None;\n        let mut state1 = None;\n        let mut resolved_at = None;\n        let mut current_key: Option<&'static str> = None;\n\n        const KEYS: &[&str] = &[\n            \"link.0\", \"link.1\",\n            \"hash.0\", \"commit.0\",\n            \"hash.1\", \"commit.1\",\n            \"range.0\", \"range.1\",\n            \"state.0\", \"state.1\",\n            \"resolved_at\",\n        ];\n\n        for line in text.lines() {\n            if line.trim().is_empty() || line.trim().starts_with('#') {\n                current_key = None;\n                continue;\n            }\n\n            let is_new_key = KEYS.iter().any(|k| {\n                line.starts_with(k) && line[k.len()..].starts_with(':')\n            });\n\n            if is_new_key {\n                let colon = line.find(':').unwrap();\n                let key   = line[..colon].trim();\n                let value = line[colon + 1..].trim().to_string();\n                current_key = Some(match key {\n                    \"link.0\"      => { link0      = Some(value); \"link.0\" }\n                    \"link.1\"      => { link1      = Some(value); \"link.1\" }\n                    \"hash.0\"      => { hash0      = Some(value); \"\" }\n                    \"commit.0\"    => { commit0    = Some(value); \"\" }\n                    \"hash.1\"      => { hash1      = Some(value); \"\" }\n                    \"commit.1\"    => { commit1    = Some(value); \"\" }\n                    \"range.0\"     => { range0     = Some(value); \"\" }\n                    \"range.1\"     => { range1     = Some(value); \"\" }\n                    \"state.0\"     => { state0     = Some(value); \"\" }\n                    \"state.1\"     => { state1     = Some(value); \"\" }\n                    \"resolved_at\" => { resolved_at = Some(value); \"\" }\n                    _             => \"\"\n                });\n            } else if let Some(key) = current_key {\n                let cont = line.trim();\n                match key {\n                    \"link.0\" => link0.get_or_insert_default().push_str(&format!(\" {cont}\")),\n                    \"link.1\" => link1.get_or_insert_default().push_str(&format!(\" {cont}\")),\n                    _ => {}\n                }\n            }\n        }\n\n        let parse_ep = |
