raw: Option<String>, field: &str| -> Result<LinkEndpoint> {\n            raw.with_context(|| format!(\"missing '{field}' field\"))?\n                .parse::<LinkEndpoint>()\n                .with_context(|| format!(\"parsing {field}\"))\n        };\n","start_line":1,"lang":"rust","xi":1,"yi":11},{"id":"crates/bilinker/src/bilink.rs@.stratum/impl#L7","label":"crates/bilinker/src/bilink.rs#L7","file_group_id":"fg_crates_bilinker_src_bilink_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/bilink.rs","content":"pub struct BiLinkFile {\n    pub uuid: String,\n    pub link0: LinkEndpoint,\n    pub link1: LinkEndpoint,\n    pub hash0: Option<String>,\n    pub commit0: Option<String>,\n    pub hash1: Option<String>,\n    pub commit1: Option<String>,\n    pub range0: Option<ByteRange>,\n    pub range1: Option<ByteRange>,\n    pub state0: Option<EndpointState>,\n    pub state1: Option<EndpointState>,\n    pub resolved_at: Option<String>,\n}","start_line":7,"lang":"rust","xi":1,"yi":12},{"id":"crates/bilinker/src/capture.rs@.stratum/impl#L16","label":"crates/bilinker/src/capture.rs#L16","file_group_id":"fg_crates_bilinker_src_capture_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/capture.rs","content":"pub fn capture(\n    root: &Path,\n    file: &str,\n    start: (usize, usize), // (line, col) 1-based\n    end: (usize, usize),\n) -> Result<CaptureResult> {\n    let commit = git::head_commit_for_file(root, file)?;\n    let file_path = root.join(file);\n    let source = std::fs::read_to_string(&file_path)\n        .with_context(|| format!(\"reading {}\", file_path.display()))?;\n\n    let lang = grammar::language_for_file(file);\n    let language = grammar::for_language(lang)?;\n    let mut parser = Parser::new();\n    parser.set_language(&language).context(\"set language\")?;\n    let tree = parser.parse(&source, None).context(\"parse failed\")?;\n\n    let start_point = Point { row: start.0 - 1, column: start.1 - 1 };\n    let end_point   = Point { row: end.0 - 1,   column: end.1 - 1 };\n\n    let root_node = tree.root_node();\n    let node = root_node\n        .named_descendant_for_point_range(start_point, end_point)\n        .context(\"no named node at selection\")?;\n\n    let anchors = stable_anchor_kinds(lang);\n    let target = walk_up_to_anchor(node, anchors).unwrap_or(node);\n\n    let anchor = target.parent()\n        .and_then(|p| walk_up_to_anchor(p, anchors));\n\n    let query = match anchor {\n        None => query_for_node(target, &source, &mut 0),\n        Some(a) if a.id() == target.id() => query_for_node(target, &source, &mut 0),\n        Some(a) => {\n            let path = build_path(a, target);\n            query_from_path(&path, &source, &mut 0)\n        }\n    };\n\n    let start_byte = byte_for_point(&source, start_point);\n    let end_byte   = byte_for_point(&source, end_point);\n    // Single-point selection → capture the whole anchor; use relative offsets only for real ranges.\n    let range = if start_byte == end_byte {\n        None\n    } else if start_byte != target.start_byte() || end_byte != target.end_byte() {\n        let rel_start = start_byte.saturating_sub(target.start_byte());\n        let rel_end   = end_byte.saturating_sub(target.start_byte());\n        Some(crate::link::ByteRange { start: rel_start, end: rel_end })\n    } else {\n        None\n    };\n\n    let (frag_start, frag_end) = match &range {\n        Some(r) => (target.start_byte() + r.start, target.start_byte() + r.end),\n        None    => (target.start_byte(), target.end_byte()),\n    };\n    let fragment = &source[frag_start..frag_end.min(source.len())];\n    let hash = hash::sha256(fragment.as_bytes());\n\n    Ok(CaptureResult {\n        endpoint: StructuralRef {\n            file: file.to_string(),\n            query: Some(query),\n            range,\n        },\n        hash,\n        commit,\n    })\n}","start_line":16,"lang":"rust","xi":1,"yi":14},{"id":"crates/bilinker/src/chain.rs@.stratum/impl#L1","label":"crates/bilinker/src/chain.rs","file_group_id":"fg_crates_bilinker_src_chain_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/chain.rs","content":"use std::path::{Component, Path, PathBuf};\nuse anyhow::{bail, Result};\nuse uuid::Uuid;\n\nuse crate::bilink::BiLinkFile;\nuse crate::link::LinkEndpoint;\n\npub struct ChainNew {\n    pub uuid: String,\n    pub files: Vec<PathBuf>,\n}\n\n/// Creates a new chain or direct link.\n///\n/// `tips`: exactly 2 entries of (layer_path_relative_to_root, structural_endpoint).\n/// `mids`: ordered layer paths between the two tips.\n/// All paths are relative to `root`.\npub fn chain_new(\n    root: &Path,\n    tips: &[(PathBuf, LinkEndpoint)],\n    mids: &[PathBuf],\n) -> Result<ChainNew> {\n    if tips.len() != 2 {\n        bail!(\"chain new requires exactly 2 --tip arguments\");\n    }\n\n    let uuid = Uuid::new_v4().to_string();\n\n    let all_layers: Vec<PathBuf> = {\n        let mut v = vec![tips[0].0.clone()];\n        v.extend_from_slice(mids);\n        v.push(tips[1].0.clone());\n        v\n    };\n\n    let n = all_layers.len();\n    let mut created = Vec::new();\n\n    // Same-layer direct link: both tips in the same directory → one file.\n    if n == 2 && normalize(&all_layers[0]) == normalize(&all_layers[1]) {\n        let bl = BiLinkFile {\n            uuid:      uuid.clone(),\n            link0:     tips[0].1.clone(),\n            link1:     tips[1].1.clone(),\n            hash0: None, commit0: None,\n            hash1: None, commit1: None,\n            range0:    None, range1: None,\n            state0:    None, state1: None,\n            resolved_at: None,\n        };\n        let path = bilink_path(root, &all_layers[0], &uuid);\n        bl.write(&path)?;\n        created.push(path);\n        return Ok(ChainNew { uuid, files: created });\n    }\n\n    // Multi-layer chain\n    for i in 0..n {\n        let layer = &all_layers[i];\n\n        let (link0, link1) = if i == 0 {\n            let to_next = layer_endpoint(layer, &all_layers[i + 1])?;\n            (tips[0].1.clone(), to_next)\n        } else if i == n - 1 {\n            let to_prev = layer_endpoint(layer, &all_layers[i - 1])?;\n            (to_prev, tips[1].1.clone())\n        } else {\n            let to_prev = layer_endpoint(layer, &all_layers[i - 1])?;\n            let to_next = layer_endpoint(layer, &all_layers[i + 1])?;\n            (to_prev, to_next)\n        };\n\n        let bl = BiLinkFile {\n            uuid:      uuid.clone(),\n            link0,\n            link1,\n            hash0: None, commit0: None,\n            hash1: None, commit1: None,\n            range0:    None, range1: None,\n            state0:    None, state1: None,\n            resolved_at: None,\n        };\n        let path = bilink_path(root, layer, &uuid);\n        bl.write(&path)?;\n        created.push(path);\n    }\n\n    Ok(ChainNew { uuid, files: created })\n}\n\n/// Resolves the `.bilink/<uuid>.bilink` path for a layer endpoint at `target_layer`.\npub fn resolve_layer_link(\n    bilink_file: &Path,\n    layer_root: &Path,\n    link_path: &Path,\n    uuid: &str,\n) -> PathBuf {\n    let _ = bilink_file;\n    layer_root.join(link_path).join(\".bilink\").join(format!(\"{uuid}.bilink\"))\n}","start_line":1,"lang":"rust","xi":1,"yi":16},{"id":"crates/bilinker/src/chain.rs@.stratum/impl#L18","label":"crates/bilinker/src/chain.rs#L18","file_group_id":"fg_crates_bilinker_src_chain_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/chain.rs","content":"pub fn chain_new(\n    root: &Path,\n one,\n            state0:    None, state1: None,\n            resolved_at: None,\n        };\n        let path = bilink_path(root, layer, &uuid);\n        bl.write(&path)?;\n        created.push(path);\n    }\n\n    Ok(ChainNew { uuid, files: created })\n}","start_line":18,"lang":"rust","xi":1,"yi":17},{"id":"crates/bilinker/src/check.rs@.stratum/impl#L1","label":"crates/bilinker/src/check.rs","file_group_id":"fg_crates_bilinker_src_check_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/check.rs","content":"use std::path::{Path, PathBuf};\nuse anyhow::Result;\nuse chrono::Utc;\n\nuse crate::bilink::{walkdir, BiLinkFile};\nuse crate::chain::resolve_layer_link;\nuse crate::grammar;\nuse crate::hash;\nuse crate::link::{ByteRange, EndpointState, LinkEndpoint, StructuralRef};\nuse crate::query;\nuse crate::task::resolve_task_path;\n\n#[derive(Debug)]\npub struct CheckResult {\n    pub uuid: String,\n    pub state0: EndpointState,\n    pub state1: EndpointState,\n    pub updated: bool,\n}\n\nimpl CheckResult {\n    pub fn is_clean(&self) -> bool {\n        use EndpointState::*;\n        matches!(self.state0, Ok | Moved | Displaced | Reanchored | Expanded | Todo)\n            && matches!(self.state1, Ok | Moved | Displaced | Reanchored | Expanded | Todo)\n    }\n}\n\npub fn check(root: &Path, path: &Path) -> Result<Vec<CheckResult>> {\n    let mut results = Vec::new();\n\n    if path.is_file() {\n        results.push(check_file(root, path)?);\n        return Ok(results);\n    }\n\n    let bilink_dir = if path.ends_with(\".bilink\") { path.to_path_buf() }\n                     else { path.join(\".bilink\") };\n\n    for entry in walkdir(&bilink_dir)? {\n        if entry.extension().and_then(|e| e.to_str()) == Some(\"bilink\")\n            && !entry.ancestors().any(|a| a.ends_with(\".pending\"))\n        {\n            results.push(check_file(root, &entry)?);\n        }\n    }\n    Ok(results)\n}\n\nfn check_file(root: &Path, bilink_path: &Path) -> Result<CheckResult> {\n    let mut bl = BiLinkFile::load(bilink_path)?;\n\n    let layer_root = bilink_path\n        .parent().and_then(|p| p.parent())\n        .unwrap_or(root);\n\n    let uuid = bl.uuid.clone();\n\n    let (state0, range0) =\n        check_endpoint(root, layer_root, &bl.link0, &uuid, bl.hash0.as_deref(), bl.range0.as_ref())?;\n\n    let (state1, range1) =\n        check_endpoint(root, layer_root, &bl.link1, &uuid, bl.hash1.as_deref(), bl.range1.as_ref())?;\n\n    let updated = bl.state0.as_ref() != Some(&state0)\n        || bl.state1.as_ref() != Some(&state1)\n        || bl.range0 != range0\n        || bl.range1 != range1;\n\n    bl.range0      = range0;\n    bl.range1      = range1;\n    bl.state0      = Some(state0.clone());\n    bl.state1      = Some(state1.clone());\n    bl.resolved_at = Some(Utc::now().format(\"%Y-%m-%dT%H:%M:%SZ\").to_string());\n\n    bl.write(bilink_path)?;\n\n    Ok(CheckResult { uuid, state0, state1, updated })\n}\n\nfn check_endpoint(\n    root: &Path,\n    layer_root: &Path,\n    endpoint: &LinkEndpoint,\n    uuid: &str,\n    hash: Option<&str>,\n    stored_range: Option<&ByteRange>,\n) -> Result<(EndpointState, Option<ByteRange>)> {\n    match endpoint {\n        LinkEndpoint::Structural(sref) => check_structural(root, sref, hash, stored_range),\n        LinkEndpoint::Layer(tokens)    => check_layer(layer_root, tokens, uuid, hash),\n        LinkEndpoint::Task(id)         => check_task(layer_root, id, hash),\n    }\n}\n\nfn check_structural(\n    root: &Path,\n    sref: &StructuralRef,\n    hash: Option<&str>,\n    stored_range: Option<&ByteRange>,","start_line":1,"lang":"rust","xi":1,"yi":19},{"id":"crates/bilinker/src/check.rs@.stratum/impl#L29","label":"crates/bilinker/src/check.rs#L29","file_group_id":"fg_crates_bilinker_src_check_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/check.rs","content":"pub fn check(root: &Path, path: &Path) -> Result<Vec<CheckResult>> {\n    let mut results = Vec::new();\n\n    if path.is_file() {\n        results.push(check_file(root, path)?);\n        return Ok(results);\n    }\n\n    let bilink_dir = if path.ends_with(\".bilink\") { path.to_path_buf() }\n                     else { path.join(\".bilink\") };\n\n    for entry in walkdir(&bilink_dir)? {\n        if entry.extension().and_then(|e| e.to_str()) == Some(\"bilink\")\n            && !entry.ancestors().any(|a| a.ends_with(\".pending\"))\n        {\n            results.push(check_file(root, &entry)?);\n        }\n    }\n    Ok(results)\n}","start_line":29,"lang":"rust","xi":1,"yi":20},{"id":"crates/bilinker/src/config.rs@.stratum/impl#L1","label":"crates/bilinker/src/config.rs","file_group_id":"fg_crates_bilinker_src_config_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/config.rs","content":"use std::path::{Path, PathBuf};\nuse anyhow::Result;\n\n#[derive(Debug, Default)]\npub struct Config {}\n\nimpl Config {\n    /// Find the project root by walking up from `dir` looking for `.bilink/`,\n    /// then falling back to the git root (`.git/`).\n    pub fn load_from(dir: &Path) -> Result<(PathBuf, Config)> {\n        let mut current = dir.to_path_buf();\n        loop {\n            if current.join(\".bilink\").is_dir() || current.join(\".git\").exists() {\n                return Ok((current, Config {}));\n            }\n            if !current.pop() {\n                return Ok((dir.to_path_buf(), Config {}));\n            }\n        }\n    }\n}","start_line":1,"lang":"rust","xi":1,"yi":22},{"id":"crates/bilinker/src/get.rs@.stratum/impl#L1","label":"crates/bilinker/src/get.rs","file_group_id":"fg_crates_bilinker_src_get_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/get.rs","content":"use std::path::Path;\nuse anyhow::{bail, Context, Result};\n\nuse crate::bilink::BiLinkFile;\nuse crate::grammar;\nuse crate::link::{LinkEndpoint, StructuralRef};\nuse crate::query;\nuse stratum::StratumPath;\n\npub struct GetResult {\n    pub content: String,\n    pub file: String,\n    pub start_line: usize,\n    pub end_line: usize,\n}\n\npub fn get(\n    root: &Path,\n    bilink_name: &str,\n    endpoint: u8,\n    before: Option<(usize, usize)>,\n    after: Option<(usize, usize)>,\n) -> Result<GetResult> {\n    let bilinker_dir = root.join(\".bilink\");\n    let (_, bl) = BiLinkFile::find_by_id(&bilinker_dir, bilink_name)?;\n\n    let link = match endpoint {\n        0 => &bl.link0,\n        1 => &bl.link1,\n        _ => bail!(\"endpoint must be 0 or 1\"),\n    };\n\n    match link {\n        LinkEndpoint::Structural(sref) => resolve(root, sref, before, after),\n        LinkEndpoint::Layer(layer_path) => {\n            traverse_layer(root, layer_path.clone(), &bl.uuid, before, after)\n        }\n        LinkEndpoint::Task(id) => bail!(\n            \"link.{endpoint} is a task reference ({id}) — use worklist to view it\"\n        ),\n    }\n}\n\nfn traverse_layer(\n    root: &Path,\n    layer_path: StratumPath,\n    uuid: &str,\n    before: Option<(usize, usize)>,\n    after: Option<(usize, usize)>,\n) -> Result<GetResult> {\n    let adjacent_root = stratum::resolve(root, root, &layer_path)\n        .map_err(|e| anyhow::anyhow!(\"resolving adjacent layer: {e}\"))?;\n\n    let adjacent_bilink_dir = adjacent_root.join(\".bilink\");\n    let (_, adjacent_bl) = BiLinkFile::find_by_id(&adjacent_bilink_dir, uuid)\n        .with_context(|| format!(\"bilink {uuid} not found in {}\", adjacent_bilink_dir.display()))?;\n\n    let sref = match (&adjacent_bl.link0, &adjacent_bl.link1) {\n        (LinkEndpoint::Structural(r), _) => r,\n        (_, LinkEndpoint::Structural(r)) => r,\n        _ => bail!(\"adjacent bilink {uuid} has no structural endpoint\"),\n    };\n\n    resolve(&adjacent_root, sref, before, after)\n}\n\nfn resolve(\n    root: &Path,\n    sref: &StructuralRef,\n    before: Option<(usize, usize)>,\n    after: Option<(usize, usize)>,\n) -> Result<GetResult> {\n    let file_path = root.join(&sref.file);\n    let source = std::fs::read_to_string(&file_path)\n        .with_context(|| format!(\"reading {}\", file_path.display()))?;\n\n    let Some(query_str) = &sref.query else {\n        let total = count_lines(&source);\n        return Ok(GetResult {\n            content: source,\n            file: sref.file.clone(),\n            start_line: 1,\n            end_line: total,\n        });\n    };\n\n    let lang = grammar::language_for_file(&sref.file);\n    let language = grammar::for_language(lang)?;\n\n    let (node_start, node_end) = query::find_target(language, &source, query_str)?\n        .with_context(|| format!(\"query matched nothing in {}\", sref.file))?;\n\n    let (frag_start, frag_end) = match &sref.range {\n        Some(r) => (node_start + r.start, (node_start + r.end).min(source.len())),\n        None    => (node_start, node_end),\n    };\n\n    let line_start = byte_to_line(&source, frag_start);\n    let line_end   = byte_to_line(&source, frag_end.saturating_sub(1));\n","start_line":1,"lang":"rust","xi":1,"yi":24},{"id":"crates/bilinker/src/get.rs@.stratum/impl#L17","label":"crates/bilinker/src/get.rs#L17","file_group_id":"fg_crates_bilinker_src_get_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/get.rs","content":"pub fn get(\n    root: &Path,\n    bilink_name: &str,\n    endpoint: u8,\n    before: Option<(usize, usize)>,\n    after: Option<(usize, usize)>,\n) -> Result<GetResult> {\n    let bilinker_dir = root.join(\".bilink\");\n    let (_, bl) = BiLinkFile::find_by_id(&bilinker_dir, bilink_name)?;\n\n    let link = match endpoint {\n        0 => &bl.link0,\n        1 => &bl.link1,\n        _ => bail!(\"endpoint must be 0 or 1\"),\n    };\n\n    match link {\n        LinkEndpoint::Structural(sref) => resolve(root, sref, before, after),\n        LinkEndpoint::Layer(layer_path) => {\n            traverse_layer(root, layer_path.clone(), &bl.uuid, before, after)\n        }\n        LinkEndpoint::Task(id) => bail!(\n            \"link.{endpoint} is a task reference ({id}) — use worklist to view it\"\n        ),\n    }\n}","start_line":17,"lang":"rust","xi":1,"yi":25},{"id":"crates/bilinker/src/index.rs@.stratum/impl#L1","label":"crates/bilinker/src/index.rs","file_group_id":"fg_crates_bilinker_src_index_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/index.rs","content":"use std::path::{Path, PathBuf};\nuse std::time::SystemTime;\nuse anyhow::Result;\n\nuse crate::bilink::BiLinkFile;\nuse crate::link::LinkEndpoint;\n\n#[derive(Debug, PartialEq)]\npub enum IndexStatus {\n    Ok,\n    Stale { stale_count: usize },\n    Missing,\n}\n\n/// Builds `.bilink/.index` for the given layer root and writes `.bilink/.gitignore`.\n/// Returns the number of entries written.\npub fn build(layer_root: &Path) -> Result<usize> {\n    let bilink_dir = layer_root.join(\".bilink\");\n    if !bilink_dir.exists() {\n        return Ok(0);\n    }\n\n    let mut out = String::new();\n    let mut count = 0;\n\n    for path in bilink_files_in(&bilink_dir) {\n        let Ok(bl) = BiLinkFile::load(&path) else { continue };\n        for (n, link) in [(0u8, &bl.link0), (1u8, &bl.link1)] {\n            if let LinkEndpoint::Structural(sref) = link {\n                out.push_str(&sref.file);\n                out.push('\\t');\n                out.push_str(&format!(\"{}.{n}\", bl.uuid));\n                out.push('\\n');\n                count += 1;\n            }\n        }\n    }\n\n    std::fs::write(bilink_dir.join(\".index\"), &out)?;\n    ensure_gitignore(&bilink_dir)?;\n\n    Ok(count)\n}\n\n/// Returns the status of `.bilink/.index` for the given layer root.\npub fn status(layer_root: &Path) -> Result<IndexStatus> {\n    let bilink_dir = layer_root.join(\".bilink\");\n    let index_path = bilink_dir.join(\".index\");\n\n    if !index_path.exists() {\n        return Ok(IndexStatus::Missing);\n    }\n\n    let index_mtime = mtime(&index_path)?;\n    let stale = bilink_files_in(&bilink_dir)\n        .iter()\n        .filter(|p| mtime(p).map(|m| m > index_mtime).unwrap_or(false))\n        .count();\n\n    if stale > 0 {\n        Ok(IndexStatus::Stale { stale_count: stale })\n    } else {\n        Ok(IndexStatus::Ok)\n    }\n}\n\n/// Looks up bilinks referencing `file` in the given layer.\n/// `file` is relative to `layer_root`.\n/// Uses `.bilink/.index` if valid; falls back to O(N) scan silently.\npub fn lookup(layer_root: &Path, file: &str) -> Result<Vec<(String, u8)>> {\n    let bilink_dir = layer_root.join(\".bilink\");\n    let index_path = bilink_dir.join(\".index\");\n\n    if index_path.exists() && index_is_valid(&bilink_dir, &index_path) {\n        lookup_from_index(&index_path, file)\n    } else {\n        lookup_scan(&bilink_dir, file)\n    }\n}\n\n/// Finds all layer roots (directories containing `.bilink/`) under `root`.\npub fn layer_roots(root: &Path) -> Vec<PathBuf> {\n    let mut result = Vec::new();\n    collect_layer_roots(root, &mut result);\n    result\n}\n\n// ── private ──────────────────────────────────────────────────────────────────\n\nfn collect_layer_roots(dir: &Path, out: &mut Vec<PathBuf>) {\n    if dir.join(\".bilink\").is_dir() {\n        out.push(dir.to_path_buf());\n    }\n    let Ok(entries) = std::fs::read_dir(dir) else { return };\n    for entry in entries.flatten() {\n        let path = entry.path();\n        if !path.is_dir() { continue; }\n        let name = path.file_name().and_then(|n| n.to_str()).unwrap_or(\"\");\n        if matches!(name, \"target\" | \"node_modules\" | \".git\") { continue; }\n        collect_layer_roots(&path, out);","start_line":1,"lang":"rust","xi":1,"yi":27},{"id":"crates/bilinker/src/index.rs@.stratum/impl#L17","label":"crates/bilinker/src/index.rs#L17","file_group_id":"fg_crates_bilinker_src_index_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/index.rs","content":"pub fn build(layer_root: &Path) -> Result<usize> {\n    let bilink_dir = layer_root.join(\".bilink\");\n    if !bilink_dir.exists() {\n        return Ok(0);\n    }\n\n    let mut out = String::new();\n    let mut count = 0;\n\n    for path in bilink_files_in(&bilink_dir) {\n        let Ok(bl) = BiLinkFile::load(&path) else { continue };\n        for (n, link) in [(0u8, &bl.link0), (1u8, &bl.link1)] {\n            if let LinkEndpoint::Structural(sref) = link {\n                out.push_str(&sref.file);\n                out.push('\\t');\n                out.push_str(&format!(\"{}.{n}\", bl.uuid));\n                out.push('\\n');\n                count += 1;\n            }\n        }\n    }\n\n    std::fs::write(bilink_dir.join(\".index\"), &out)?;\n    ensure_gitignore(&bilink_dir)?;\n\n    Ok(count)\n}","start_line":17,"lang":"rust","xi":1,"yi":28},{"id":"crates/bilinker/src/link.rs@.stratum/impl#L1","label":"crates/bilinker/src/link.rs","file_group_id":"fg_crates_bilinker_src_link_rs__stratum_impl","layer_id":"L__stratum_impl","layer":".stratum/impl","abs_path":"/home/anibal/Workspace/accreta/subsystems/bilinker/.stratum/impl/crates/bilinker/src/link.rs","content":"use std::fmt;\nuse std::str::FromStr;\nuse anyhow::{bail, Context};\nuse stratum::StratumPath;\n\n#[derive(Debug, Clone, PartialEq)]\npub enum EndpointState {\n    Pending,\n    Ok,\n    Todo,\n    Moved,\n    Displaced,\n    Reanchored,\n (), |s| s.to_string())\n}\n\n/// A parsed bilink endpoint: `file [:: query [:: start~end]]`\n/// or a stratum path pointing to a layer directory.\n///\n/// Disambiguation: if the string contains `::` it is always Structural.\n/// If it has no `::`, it is Structural when the last path component has a\n/// file extension (e.g. `spec.md`, `src/Foo.java`); otherwise it is a Layer.\n#[derive(Debug, Clone, PartialEq)]\npub enum LinkEndpoint {\n    Structural(StructuralRef),\n    Layer(StratumPath),\n    /// `task <id>` — references a worklist task at `<project-root>/.stratum/worklist/<id>.task`.\n    Task(String),\n}\n\n#[derive(Debug, Clone, PartialEq)]\npub struct StructuralRef {\n    pub file: String,\n    pub query: Option<String>,\n    pub range: Option<ByteRange>,\n}\n\n/// A bilink connects exactly two endpoints.\n#[derive(Debug, Clone)]\npub struct BiLink {\n    pub id: String,\n    pub link0: LinkEndpoint,\n    pub link1: LinkEndpoint,\n    pub hash0: Option<String>,\n    pub hash1: Option<String>,\n}\n\n#[derive(Debug, Clone, PartialEq)]\npub struct ByteRange {\n    pub start: usize,","start_line":1,"lang":"rust","xi":1,"yi":30}],"edges":[{"id":"e_0626602e_commands","source":"commands/apply.md@.#L1","target":"crates/bilinker-cli/src/main.rs@.stratum/impl#L1","label":"0626602e","states":"OK↔OK"},{"id":"e_1e318d3a_concepts","source":"concepts/bilink.md@.#L1","target":"crates/bilinker/src/bilink.rs@.stratum/impl#L1","label":"1e318d3a","states":"OK↔OK"},{"id":"e_2527ff84_commands","source":"commands/graph.md@.#L1","target":"crates/bilinker-cli/src/html_graph.rs@.stratum/impl#L65","label":"2527ff84","states":"OK↔OK"},{"id":"e_26aaf542_commands","source":"commands/chain.md@.#L1","target":"crates/bilinker/src/chain.rs@.stratum/impl#L18","label":"26aaf542","states":"OK↔OK"},{"id":"e_298e1b92_commands","source":"commands/graph.md@.#L1","target":"crates/bilinker-cli/src/main.rs@.stratum/impl#L667","label":"298e1b92","states":"OK↔OK"},{"id":"e_2b0c636e_commands","source":" const COL = 540, ROW = 90;
const elements = [];

G.layers.forEach(l =>
  elements.push({ data: { id: l.id, label: l.label, type: 'layer' } })
);

G.file_groups.forEach(fg =>
  elements.push({ data: { id: fg.id, label: fg.label, parent: fg.layer_id, type: 'file-group' } })
);

// Group layers by depth and assign vertical bands
const layerOrder = {};
const depthGroups = {};
G.layers.forEach(l => {
  if (!depthGroups[l.depth]) depthGroups[l.depth] = [];
  depthGroups[l.depth].push(l.id);
});

// Count nodes per layer to compute band heights
const nodesPerLayer = {};
G.nodes.forEach(n => { nodesPerLayer[n.layer_id] = (nodesPerLayer[n.layer_id] || 0) + 1; });

// Assign a y-band start offset to each layer within its depth column
const layerYStart = {};
Object.keys(depthGroups).sort().forEach(depth => {
  let offset = 0;
  depthGroups[depth].forEach(lid => {
    layerYStart[lid] = offset;
    offset += ((nodesPerLayer[lid] || 1) + 2) * ROW; // +2 rows gap between layers
  });
});

const yIdx = {};
G.nodes.forEach(n => {
  const k = n.layer_id;
  yIdx[k] = yIdx[k] || 0;
  const y = (layerYStart[n.layer_id] || 0) + yIdx[k]++ * ROW;
  elements.push({
    data: { id: n.id, label: n.label, parent: n.file_group_id, type: 'file',
            abs_path: n.abs_path, content: n.content, layer: n.layer,
            start_line: n.start_line, lang: n.lang },
    position: { x: n.xi * COL, y: y }
  });
});

G.edges.forEach(e =>
  elements.push({ data: { id: e.id, source: e.source, target: e.target,
                          label: e.label + '\n' + e.states } })
);

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements,
  style: [
    { selector: 'node[type="layer"]', style: {
        'background-color': 'rgba(255,255,255,0.03)', 'background-opacity': 1,
        'border-color': '#30363d', 'border-style': 'dashed', 'border-width': 2,
        'label': 'data(label)', 'text-valign': 'top', 'text-halign': 'center',
        'color': '#6e7681', 'font-family': 'Courier New', 'font-size': 12, 'padding': 28 }},
    { selector: 'node[type="file-group"]', style: {
        'background-color': 'rgba(31,111,235,0.07)', 'background-opacity': 1,
        'border-color': '#1f6feb', 'border-style': 'solid', 'border-width': 1,
        'label': 'data(label)', 'text-valign': 'top', 'text-halign': 'center',
        'color': '#58a6ff', 'font-family': 'Courier New', 'font-size': 10, 'padding': 14 }},
    { selector: 'node[type="file"]', style: {
        'shape': 'round-rectangle', 'background-color': '#161b22',
        'border-color': '#1f6feb', 'border-width': 1.5,
        'label': 'data(label)', 'text-valign': 'center',
        'color': '#c9d1d9', 'font-family': 'Courier New', 'font-size': 11,
        'padding': 10, 'width': 'label', 'cursor': 'pointer' }},
    { selector: 'node[type="file"]:selected', style: {
        'border-color': '#58a6ff', 'border-width': 2.5, 'background-color': '#1c2938' }},
    { selector: 'edge', style: {
        'curve-style': 'bezier', 'target-arrow-shape': 'triangle', 'source-arrow-shape': 'triangle',
        'label': 'data(label)', 'color': '#8b949e', 'font-family': 'Courier New', 'font-size': 9,
        'text-background-color': '#0d1117', 'text-background-opacity': 0.85, 'text-background-padding': 3,
        'line-color': '#30363d', 'target-arrow-color': '#30363d', 'source-arrow-color': '#30363d',
        'width': 1.5, 'text-wrap': 'wrap' }},
    { selector: 'edge:selected', style: {
        'line-color': '#1f6feb', 'target-arrow-color': '#1f6feb', 'source-arrow-color': '#1f6feb' }}
  ],
  layout: { name: 'preset' }
});

cy.fit(undefined, 40);

cy.on('tap', 'node[type="file"]', evt => {
  const n   = evt.target.data();
  const rel = n.abs_path ? relUrl(n.abs_path, n.start_line) : '';
  const url = rel ? `<a class="open-link" href="${rel}" target="_blank">Open file</a>` : '';
  const txt = n.content || '(no content)';

  let contentHtml;
  if (n.lang === 'markdown') {
    contentHtml = `<div class="md-wrap">${marked.parse(txt)}</div>`;
  } else {
    const lang    = n.lang || 'plaintext';
    const hl      = hljs.highlight(txt, { language: lang, ignoreIllegals: true });
    const count   = txt.split('\n').length;
    const start   = n.start_line || 1;
    const nums    = Array.from({ length: count }, (_, i) => start + i).join('\n');
    contentHtml   = `
      <div class="code-wrap">
        <div class="line-nums">${nums}</div>
        <pre><code class="hljs language-${lang}">${hl.value}</code></pre>
      </div>`;
  }

  document.getElementById('panel').innerHTML = `
    <div class="ntitle">${esc(n.label)}</div>
    <div class="nlayer">${esc(n.layer)}</div>
    ${url}
    ${contentHtml}`;
});

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function relUrl(absPath, startLine) {
  const htmlDir = window.location.pathname.replace(/\/[^\/]*$/, '');
  const h = htmlDir.split('/').filter(Boolean);
  const f = absPath.split('/').filter(Boolean);
  let i = 0;
  while (i < h.length && i < f.length && h[i] === f[i]) i++;
  const rel = '../'.repeat(h.length - i) + f.slice(i).join('/');
  const frag = startLine > 1 ? '#L' + startLine : '';
  return rel + frag;
}
