spec: commands/index.md

scenarios:

  - id: index-build-creates-file
    description: index build genera .bilink/index/index con entradas tab-separadas
    given:
      - directorio .bilink/ con bilinks existentes
    when:
      - bilinker index build
    expect:
      - .bilink/index/index creado
      - cada línea: "<file>\t<uuid>.<N>"
    impl: index_build_creates_index_file

  - id: derived-dirs-gitignored
    description: los directorios derivados quedan declarados fuera de git
    given:
      - directorio .bilink/ sin .gitignore
    when:
      - bilinker index build
    expect:
      - .bilink/.gitignore contiene "cache/"
      - .bilink/.gitignore contiene "index/"
    impl: the_derived_directories_are_left_out_of_git

  - id: check-alone-gitignores-cache
    description: check declara la cache ignorada al escribirla, sin esperar a index
    given:
      - directorio .bilink/ sin .gitignore ni cache
    when:
      - bilinker check .
    expect:
      - .bilink/cache/state creado
      - .bilink/.gitignore contiene "cache/"
    impl: check_alone_leaves_the_cache_out_of_git

  - id: index-status-ok-after-build
    description: index status reporta OK cuando el índice está actualizado
    given:
      - .bilink/index/index construido y sin cambios en .bilink/ desde entonces
    when:
      - bilinker index status
    expect:
      - salida: "OK"
      - exit code: 0
    impl: index_status_ok_after_build

  - id: index-status-stale
    description: index status reporta STALE cuando hay bilinks más nuevos que el índice
    given:
      - .bilink/index/index construido
      - nuevo bilink creado después del build
    when:
      - bilinker index status
    expect:
      - salida contiene "STALE"
      - exit code: 1

  - id: index-status-missing
    description: index status reporta MISSING cuando no existe .bilink/index/index
    given:
      - directorio .bilink/ sin archivo index/index
    when:
      - bilinker index status
    expect:
      - salida contiene "MISSING"
      - exit code: 1
