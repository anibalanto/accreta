spec: commands/check.md

scenarios:

  - id: check-pending-new-bilink
    description: Un bilink recién creado sin accept reporta PENDING en ambos endpoints
    given:
      - bilink creado con `bilinker chain new`
      - ningún endpoint fue aceptado
    when:
      - bilinker check .
    expect:
      state: [PENDING, PENDING]

  - id: check-ok-after-accept
    description: Un bilink aceptado reporta OK cuando el contenido no cambió
    given:
      - bilink creado y ambos endpoints aceptados
      - archivo no modificado desde el accept
    when:
      - bilinker check .
    expect:
      state: [OK, OK]
    impl: check_whole_file_ok_when_hash_matches

  - id: check-altered-structural
    description: Endpoint estructural reporta ALTERED cuando el contenido del fragmento cambia
    given:
      - bilink aceptado con hash registrado
      - contenido del archivo modificado dentro del fragmento vinculado
    when:
      - bilinker check .
    expect:
      state: [ALTERED, OK]
    impl: check_whole_file_altered_when_hash_differs

  - id: check-chain-dirty-propagation
    description: Nodo layer detecta CHAIN_DIRTY cuando el bilink adyacente fue re-aceptado
    given:
      - cadena spec ↔ impl con ambos lados OK
      - impl endpoint re-aceptado con nuevo hash
    when:
      - bilinker check . (desde spec layer)
    expect:
      state: [OK, CHAIN_DIRTY]
    impl: check_layer_chain_dirty_when_hash_differs

  - id: check-pending-layer-exists
    description: Endpoint layer reporta PENDING cuando la capa existe pero no fue aceptada
    given:
      - bilink con endpoint layer apuntando a capa existente
      - hash.N ausente
    when:
      - bilinker check .
    expect:
      state: [PENDING, PENDING]
    impl: check_layer_first_time_is_pending

  - id: check-todo-layer-missing
    description: Endpoint layer reporta TODO cuando la capa apuntada no existe
    given:
      - bilink con endpoint layer apuntando a capa no creada
    when:
      - bilinker check .
    expect:
      state: [PENDING, TODO]
    impl: check_layer_todo_when_adjacent_missing_and_no_hash

  - id: check-unresolved-file-missing
    description: El endpoint queda UNRESOLVED cuando el archivo no existe; el detalle lo lleva el capture
    given:
      - bilink aceptado con archivo existente
      - archivo eliminado del filesystem
    when:
      - bilinker check .
    expect:
      state: [UNRESOLVED, OK]
      capture_state: BROKEN
    notes:
      - que el archivo no esté es un problema de ubicación, no del vínculo; el bilink solo registra que no puede evaluarse
      - con historial git del archivo el capture reporta DELETED en lugar de BROKEN, porque la eliminación es rastreable
    impl: check_unresolved_when_file_missing

  - id: check-moved-after-git-rename
    description: El capture reporta MOVED cuando git detecta un rename del archivo
    given:
      - bilink aceptado sobre un archivo commiteado
      - archivo renombrado con git mv
    when:
      - bilinker check .
    expect:
      state: [UNRESOLVED, OK]
      capture_state: MOVED
    impl: check_detects_moved_after_git_rename

  - id: check-deleted-when-file-removed
    description: El capture reporta DELETED cuando git tiene historial del archivo eliminado
    given:
      - bilink aceptado sobre un archivo commiteado
      - archivo borrado del filesystem, sin rename
    when:
      - bilinker check .
    expect:
      capture_state: DELETED
    notes:
      - distingue "alguien borró esto" de "esta referencia nunca ancló a nada"; lo segundo es BROKEN
    impl: check_detects_deleted_when_file_removed_from_git

  - id: check-reanchored-by-similarity
    description: El capture reporta REANCHORED cuando el anchor se renombró y el fragmento se localiza por similitud
    given:
      - bilink aceptado sobre una declaración nombrada
      - la declaración renombrada, su cuerpo intacto
    when:
      - bilinker check .
    expect:
      capture_state: REANCHORED
    notes:
      - no se compara por hash: el nombre está dentro del fragmento capturado, así que renombrar siempre cambia el hash
      - el texto aceptado se recupera de git y se compara por similitud, con umbral del 50%
    impl: check_detects_reanchored_when_anchor_is_renamed

  - id: check-reanchored-tolerates-an-edit
    description: REANCHORED sobrevive a un renombre acompañado de un cambio menor en el cuerpo
    given:
      - bilink aceptado sobre una declaración nombrada
      - declaración renombrada y una línea del cuerpo modificada
    when:
      - bilinker check .
    expect:
      capture_state: REANCHORED
    impl: reanchored_survives_a_rename_plus_small_edit

  - id: check-ambiguous-stays-unanchored
    description: Ante dos candidatos igual de parecidos el capture queda UNANCHORED
    given:
      - bilink aceptado sobre una declaración nombrada
      - dos declaraciones nuevas, ambas casi idénticas al fragmento aceptado
    when:
      - bilinker check .
    expect:
      capture_state: UNANCHORED
    notes:
      - hace falta un margen del 15% sobre el segundo candidato; ante un empate es preferible que lo mire un humano antes que reanclar al nodo equivocado
    impl: ambiguous_candidates_stay_unanchored

  - id: check-expanded-when-fragment-grows
    description: EXPANDED cuando el fragmento contiene el texto aceptado verbatim y algo más
    given:
      - bilink aceptado sobre una sección
      - la sección gana contenido, sin que se modifique lo aceptado
    when:
      - bilinker check .
    expect:
      state: [EXPANDED, OK]
    notes:
      - la frontera con DISPLACED es un test de subcadena contra el texto aceptado, no un umbral
      - que el fragmento contenga lo aceptado verbatim implica que su AST interno no cambió
    impl: check_detects_expanded_when_fragment_grows_around_accepted_text

  - id: check-altered-when-accepted-text-changed
    description: ALTERED cuando el texto aceptado ya no aparece verbatim en el fragmento
    given:
      - bilink aceptado sobre una sección
      - el contenido de la sección modificado
    when:
      - bilinker check .
    expect:
      state: [ALTERED, OK]
    impl: check_says_altered_when_accepted_text_changed

  - id: check-exit-zero-all-ok
    description: Exit code 0 cuando todos los endpoints están en OK
    given:
      - todos los bilinks aceptados y sin cambios
    when:
      - bilinker check .
    expect:
      exit_code: 0

  - id: check-exit-one-any-altered
    description: Exit code 1 cuando al menos un endpoint está en ALTERED
    given:
      - al menos un bilink con estado ALTERED
    when:
      - bilinker check .
    expect:
      exit_code: 1

  - id: check-expanded-with-cold-cache
    description: check distingue EXPANDED de ALTERED sin cache previa
    given:
      - un fragmento que creció alrededor de lo aceptado
      - .bilink/cache/state borrado
    when:
      - bilinker check .
    expect:
      - "EXPANDED"
    notes:
      - sin el texto aceptado, EXPANDED, DISPLACED y REANCHORED degradan a ALTERED
      - el commit se deriva sólo después de que el hash dijo que hay drift
    impl: check_still_tells_expanded_from_altered_with_a_cold_cache

  - id: append-does-not-move-the-item-above
    description: agregar un item de secuencia no toca al que ya estaba
    given:
      - un bilink aceptado sobre el último item de una secuencia YAML
    when:
      - se agrega otro item más abajo
      - bilinker check .
    expect:
      - "OK"
    notes:
      - block_sequence_item empieza en el `-` o en la indentación según qué venga abajo
      - el rango resuelto recorta los dos bordes, así que no depende del contexto
    impl: appending_a_yaml_item_does_not_move_the_one_above
