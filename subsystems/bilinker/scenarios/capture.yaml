spec: commands/capture.md

scenarios:

  - id: capture-identifies-stable-anchor
    description: capture sube en el AST hasta el primer ancestro estable
    given:
      - archivo con una declaración nombrada
      - selección dentro del cuerpo de esa declaración
    when:
      - bilinker capture <file> <start> <end>
    expect:
      - el .capture creado contiene query con el predicado del nombre del anchor
      - el .capture no contiene hashes — describe ubicación, no aceptación
    impl: capture_writes_a_capture_with_the_stable_anchor

  - id: capture-reuses-an-equivalent-capture
    description: capturar el mismo fragmento dos veces reusa el capture existente
    given:
      - archivo sin modificaciones
    when:
      - bilinker capture <file> <start> <end>  (dos veces)
    expect:
      - el mismo UUID en ambas ejecuciones
      - la segunda reporta "reusado" en stderr
      - un solo .capture en la capa
    impl: capturing_the_same_fragment_twice_reuses_the_capture

  - id: capture-reference-survives-a-content-change
    description: cambiar el contenido no cambia la referencia
    given:
      - fragmento capturado
      - el cuerpo de la declaración modificado, su firma intacta
    when:
      - bilinker capture <file> <start> <end>
    expect:
      - el mismo UUID que antes del cambio
    notes:
      - la referencia apunta a un nodo AST, no a un contenido; que sobreviva a
        un cambio de cuerpo es la promesa central de la herramienta
    impl: the_reference_survives_a_content_change

  - id: capture-whole-file-no-position
    description: sin posición captura el archivo completo sin query
    given:
      - archivo existente
    when:
      - bilinker chain new --tip "<file>"
    expect:
      - el .capture no tiene campo `query`
      - hash.N = SHA-256 del archivo completo

  - id: capture-finds-an-equivalent-reference
    description: find_equivalent reconoce una referencia idéntica e ignora las distintas
    given:
      - un capture existente en la capa
    when:
      - buscar un equivalente con la misma (file, query, offset)
      - buscar con otra query, o el mismo query en otro archivo
    expect:
      - la referencia idéntica devuelve el UUID existente
      - las distintas no devuelven nada
    impl: find_equivalent_matches_identical_reference

  - id: capture-orphans-excludes-referenced
    description: orphans lista solo los captures que ningún bilink referencia
    given:
      - dos captures en la capa, uno referenciado por un bilink
    when:
      - consultar los huérfanos
    expect:
      - solo el no referenciado aparece
    notes:
      - un capture huérfano no rompe nada; limpiarlo es higiene, no reparación
    impl: orphans_excludes_referenced_captures

  - id: capture-remove-refuses-with-referents
    description: capture remove se niega a borrar un capture con referentes
    given:
      - un capture referenciado por al menos un bilink
    when:
      - bilinker capture remove <uuid>
    expect:
      - error sugiriendo `bilinker recapture`
      - el capture sigue existiendo
    notes:
      - borrarlo dejaría bilinks apuntando a la nada; --force lo permite igual

  - id: recapture-repoints-and-clears-state
    description: recapture repunta link.N y limpia state.N, sin aceptar
    given:
      - endpoint estructural cuyo capture ya no ancla
    when:
      - bilinker recapture <uuid>.<N> <file> <línea>:<col>
    expect:
      - link.N apunta al capture nuevo
      - state.N vacío — el estado anterior describía el capture viejo
      - hash.N y commit.N intactos
    notes:
      - la misma separación que entre apply y accept, y por el mismo motivo
      - el capture anterior no se borra, se informa si quedó sin referentes

  - id: capture-whole-file-without-selection
    description: capture sin selección captura el archivo entero
    given:
      - un archivo cualquiera de la capa
    when:
      - bilinker capture <file>
    expect:
      - el capture sale sin query y sin offset
      - no hace falta gramática para el lenguaje del archivo
    notes:
      - query ausente = el archivo completo, según concepts/capture.md § Formato
      - es la forma más usada del lado de las specs
    impl: capture_without_a_selection_takes_the_whole_file
