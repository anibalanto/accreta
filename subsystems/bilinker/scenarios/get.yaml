spec: commands/get.md

scenarios:

  - id: get-by-uuid-structural
    description: get <uuid>.N muestra el contenido del fragmento estructural
    given:
      - bilink aceptado con endpoint estructural
    when:
      - bilinker get <uuid>.0
    expect:
      - stdout contiene el texto del fragmento
      - stderr contiene "# <file>  lines <start>–<end>"
    impl: get_content_matches_sed_selection

  - id: get-by-uuid-layer-traverses
    description: get <uuid>.N con endpoint layer atraviesa al fragmento adyacente
    given:
      - bilink con endpoint layer apuntando a capa disponible localmente
    when:
      - bilinker get <uuid>.1 (layer endpoint)
    expect:
      - stdout contiene el fragmento estructural del bilink adyacente
      - no error

  - id: get-by-file-returns-bilinks
    description: get <file> lista todos los bilinks que referencian ese archivo
    given:
      - bilink chequeado con endpoint en archivo conocido
    when:
      - bilinker get <file>
    expect:
      - línea por endpoint: "<uuid>.<N>  <otro-endpoint>  bytes <start>–<end>"
    impl: get_by_file_returns_bilink_after_check

  - id: get-by-position-filters-by-range
    description: get <file>:<line>:<col> lista bilinks cuyo capture tiene un range que cubre esa posición
    given:
      - capture con range conocido
    when:
      - bilinker get <file>:<line>:<col> dentro del range
    expect:
      - UUID listado

  - id: get-by-position-outside-range
    description: get <file>:<line>:<col> fuera del range no retorna ese bilink
    given:
      - capture con range conocido
    when:
      - bilinker get <file>:<line>:<col> fuera del range
    expect:
      - UUID no listado

  - id: get-diff-with-cold-cache
    description: get --diff funciona con la cache borrada
    given:
      - un endpoint aceptado y con drift
      - .bilink/cache/state borrado
    when:
      - bilinker get <uuid>.<N> --diff
    expect:
      - el diff sale, recuperando el texto aceptado
    notes:
      - commit es un derivado y la cache no está en git — un clon fresco no la tiene
    impl: get_diff_works_with_a_cold_cache

  - id: get-diff-from-a-nested-layer
    description: el diff aproximado funciona desde una capa que no es la raíz del repo
    given:
      - una capa con .bilink/ propio y sin .git/ propio
      - un endpoint cuyo hash aceptado ya no verifica en el commit cacheado
    when:
      - bilinker get <uuid>.<N> --diff
    expect:
      - el diff sale, recuperando de git el fragmento de antes
    notes:
      - git show resuelve el path contra la raíz del repo, no contra el -C
      - la capa guarda paths relativos a sí misma
    impl: the_approximate_diff_works_from_a_nested_layer
