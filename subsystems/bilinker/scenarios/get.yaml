spec: commands/get.md

scenarios:

  - id: get-by-uuid-structural
    description: get <uuid>.N muestra el contenido del fragmento estructural
    given:
      - bilink aceptado con endpoint estructural
    when:
      - bilinker get <uuid>.0
    expect:
      - stdout contiene el texto del fragmento
      - stderr contiene "# <file>  lines <start>–<end>"
    impl: get_content_matches_sed_selection

  - id: get-by-uuid-layer-traverses
    description: get <uuid>.N con endpoint layer atraviesa al fragmento adyacente
    given:
      - bilink con endpoint layer apuntando a capa disponible localmente
    when:
      - bilinker get <uuid>.1 (layer endpoint)
    expect:
      - stdout contiene el fragmento estructural del bilink adyacente
      - no error

  - id: get-by-file-returns-bilinks
    description: get <file> lista todos los bilinks que referencian ese archivo
    given:
      - bilink chequeado con endpoint en archivo conocido
    when:
      - bilinker get <file>
    expect:
      - línea por endpoint: "<uuid>.<N>  <otro-endpoint>  bytes <start>–<end>"
    impl: get_by_file_returns_bilink_after_check

  - id: get-by-position-filters-by-range
    description: get <file>:<line>:<col> lista bilinks cuyo capture tiene un range que cubre esa posición
    given:
      - capture con range conocido
    when:
      - bilinker get <file>:<line>:<col> dentro del range
    expect:
      - UUID listado

  - id: get-by-position-outside-range
    description: get <file>:<line>:<col> fuera del range no retorna ese bilink
    given:
      - capture con range conocido
    when:
      - bilinker get <file>:<line>:<col> fuera del range
    expect:
      - UUID no listado

  - id: get-diff-with-cold-cache
    description: get --diff funciona con la cache borrada
    given:
      - un endpoint aceptado y con drift
      - .bilink/cache/state borrado
    when:
      - bilinker get <uuid>.<N> --diff
    expect:
      - el diff sale, recuperando el texto aceptado
    notes:
      - commit es un derivado y la cache no está en git — un clon fresco no la tiene
    impl: get_diff_works_with_a_cold_cache

  - id: get-diff-from-a-nested-layer
    description: el diff aproximado funciona desde una capa que no es la raíz del repo
    given:
      - una capa con .bilink/ propio y sin .git/ propio
      - un endpoint cuyo hash aceptado ya no verifica en el commit cacheado
    when:
      - bilinker get <uuid>.<N> --diff
    expect:
      - el diff sale, recuperando de git el fragmento de antes
    notes:
      - git show resuelve el path contra la raíz del repo, no contra el -C
      - la capa guarda paths relativos a sí misma
    impl: the_approximate_diff_works_from_a_nested_layer

  - id: get-brings-the-neighbourhood
    description: get trae los vecinos de nivel 1 junto con el fragmento
    given:
      - un endpoint cuyo n.1.link declara dos captures
    when:
      - bilinker get <uuid>.<N>
    expect:
      - stdout contiene el fragmento y los dos fragmentos vecinos
      - stderr contiene un encabezado por vecino, con el prefijo del nivel

  - id: get-brings-the-neighbourhood-without-a-provider
    description: traer el vecindario no consulta al proveedor
    given:
      - un endpoint con n.1.link declarado
      - ningún daemon de language servers corriendo
    when:
      - bilinker get <uuid>.<N>
    expect:
      - los vecinos salen igual
    notes:
      - los vecinos son captures del bilink; get los resuelve, no los recalcula

  - id: get-neighbourhood-keeps-the-written-order
    description: los vecinos salen en el orden en que están escritos en n.1.link
    given:
      - un endpoint con tres captures vecinos, ordenados por id
    when:
      - bilinker get <uuid>.<N>
    expect:
      - el orden de salida es el del archivo
    notes:
      - es el orden del fold, y get no lo recalcula

  - id: get-raw-excludes-the-neighbourhood
    description: --raw sigue siendo el fragmento y nada más
    given:
      - un endpoint con n.1.link declarado
    when:
      - bilinker get <uuid>.<N> --raw
    expect:
      - stdout es el mismo texto que check hashea, byte por byte
      - ningún vecino en la salida

  - id: get-brings-the-declared-neighbourhood
    description: se traen los vecinos declarados, no los aceptados
    given:
      - un endpoint cuyo n.1.link difiere del de su accepted (CONTRACT_RELOCATED)
    when:
      - bilinker get <uuid>.<N>
    expect:
      - salen los vecinos de la declaración
    notes:
      - el fragmento que get imprime es el de hoy; contrastar con lo aceptado es --diff

  - id: get-names-a-neighbourhood-it-cannot-bring
    description: no tener vecinos que traer no es un solo caso, y sólo uno es silencio
    given:
      - cuatro endpoints - n ausente, n.1 sin link, n.1.link unknown, n declined
    when:
      - bilinker get <uuid>.<N> sobre cada uno
    expect:
      - el de n ausente no imprime nada del nivel
      - los otros tres se nombran, y con frases distintas
    notes:
      - un silencio que sirve para los cuatro afirma la cobertura que tres no tienen

  - id: get-unresolved-neighbour-does-not-fail
    description: un vecino que no resuelve se imprime con su referencia y el comando sale 0
    given:
      - un endpoint que resuelve, con un capture vecino UNANCHORED
    when:
      - bilinker get <uuid>.<N>
    expect:
      - el fragmento sale
      - el vecino sale con su archivo, su id de capture, su estado y su query
      - código de salida 0
