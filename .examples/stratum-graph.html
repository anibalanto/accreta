const G   = {"layers":[{"id":"L__","label":".","depth":0},{"id":"L__stratum_impl","label":".stratum/impl","depth":1}],"nodes":[{"id":"commands/add.md@.#L1","label":"commands/add.md","layer_id":"L__","layer":".","url":"file:///home/anibal/Workspace/accreta/subsystems/stratum/commands/add.md#L1","content":"# Especificación: `stratum add`\n\n## Propósito\n\nRegistra una nueva sub-capa declarando su repositorio git. Crea el archivo\n`.<nombre>.toml` en `.stratum/` del directorio actual. No clona el repositorio\n— solo deja el mapa para que `stratum pull` lo haga después.\n\n## Sintaxis\n\n```\nstratum add <nombre> <remote> [branch]\n```\n\n| Argumento | Descripción |\n|-----------|-------------|\n| `<nombre>` | Nombre de la sub-capa (debe ser un identificador válido de directorio) |\n| `<remote>` | URL del repositorio git (ssh o https) |\n| `[branch]` | Rama a usar. Default: `main` |\n\n## Ejemplo\n\n```bash\n# Parado en bilinker/\nstratum add impl git@github.com:anibalanto/bilinker.git main\n# → crea .stratum/.impl.toml\n\n# Con branch explícita\nstratum add tech-decisions git@github.com:org/td.git develop\n```\n\n## Archivo creado\n\n`.stratum/.<nombre>.toml`:\n\n```toml\nremote = \"git@github.com:anibalanto/bilinker.git\"\nbranch = \"main\"\n```\n\nSi `.stratum/` no existe, se crea automáticamente.\n\n## Errores\n\n| Condición | Mensaje | Código |\n|-----------|---------|--------|\n| `.stratum/.<nombre>.toml` ya existe | `ya existe — usa --force para sobreescribir` | 1 |\n| `<nombre>` vacío o inválido | `nombre de capa inválido` | 2 |\n\n## Propiedades\n\n- **Idempotente con `--force`**: sobreescribe el `.toml` existente.\n- **No clona**: solo registra. Ver `stratum pull` para clonar.\n- **Crea `.stratum/`** si no existe.","start_line":1,"lang":"markdown","xi":0,"yi":0},{"id":"crates/estrato-cli/src/main.rs@.stratum/impl#L95","label":"crates/estrato-cli/src/main.rs#L95","layer_id":"L__stratum_impl","layer":".stratum/impl","url":"file:///home/anibal/Workspace/accreta/subsystems/stratum/.stratum/impl/crates/estrato-cli/src/main.rs#L95","content":"{e}\"); process::exit(2); }\n            };\n            let root = match resolve(&cwd, &cwd, &tokens) {\n                Ok(p)  => p,\n                Err(e) => { eprintln!(\"error: {e}\"); process::exit(1); }\n            };\n            println!(\"{}\", path);\n            print_stratum_children(&root, \"\");\n        }\n\n        Some(Commands::Query(args)) => {\n            let raw = args.first()\n                .map(|s| s.as_str())\n                .unwrap_or_else(|| { eprintln!(\"error: query vacía\"); process::exit(2); });\n\n            let query = match parse(raw) {\n                Ok(q)  => q,\n                Err(e) => { eprintln!(\"error: {e}\"); process::exit(2); }\n            };\n\n            match query {\n                Query::Path(tokens) => match","start_line":95,"lang":"rust","xi":1,"yi":0},{"id":"concepts/sublayer-config.md@.#L1","label":"concepts/sublayer-config.md","layer_id":"L__","layer":".","url":"file:///home/anibal/Workspace/accreta/subsystems/stratum/concepts/sublayer-config.md#L1","content":"# Configuración de subcapas\n\nCada subcapa de `.stratum/` puede tener un archivo de configuración `.<nombre>.toml` en el directorio `.stratum/` que la contiene. El archivo declara cómo obtener ese repositorio git y cualquier configuración específica de la subcapa.\n\n## Ubicación y nombre\n\nEl archivo se llama `.<nombre>.toml` donde `<nombre>` es exactamente el nombre del directorio de la subcapa. Vive junto a la subcapa en el mismo `.stratum/`:\n\n```\nbilinker/\n  .stratum/\n    .technical-decisions.toml   ← config de la subcapa \"technical-decisions\"\n    technical-decisions/         ← la subcapa (presente si fue clonada)\n      .stratum/\n        .impl.toml               ← config de la subcapa \"impl\" de tech-decisions\n        impl/\n```\n\nSi la subcapa no está clonada localmente, el archivo de config sigue presente — es el mapa que permite obtenerla con `stratum pull`.\n\n## Formato\n\n```toml\n# .stratum/.technical-decisions.toml\n\nrepo   = \"git@github.com:org/bilinker-tech-decisions.git\"\nbranch = \"main\"\n\n# Opcional: sparse checkout — solo estas rutas se clonan\nsparse = [\"concepts/\", \"adr/\"]\n\n# Opcional: clon superficial para repos grandes\ndepth = 1\n```\n\n### Campos\n\n| Campo | Tipo | Requerido | Descripción |\n|-------|------|-----------|-------------|\n| `repo` | string | sí | URL del repositorio git (ssh o https) |\n| `branch` | string | sí | Rama a clonar |\n| `sparse` | array de strings | no | Paths a incluir en sparse checkout. Sin este campo se clona completo. |\n| `depth` | entero | no | Profundidad del clon. Sin este campo se clona el historial completo. |\n\n## Relación con `stratum pull`\n\n`stratum pull` lee los archivos `.toml` del directorio `.stratum/` actual y clona o actualiza cada subcapa declarada:\n\n```bash\nstratum pull                         # todas las subcapas del .stratum/ actual\nstratum pull technical-decisions     # solo esa subcapa\nstratum pull --recursive             # todas las subcapas en todo el árbol\n```\n\nSi la subcapa ya existe localmente, `pull` ejecuta `git fetch` + `git checkout` a la rama declarada. Si no existe, la clona.\n\n## Subcapas opcionales y presencia parcial\n\nUn proyecto puede tener configuradas subcapas que no están clonadas localmente. Esto es normal — se trabaja solo con las capas necesarias:\n\n```bash\n# Trabajando solo en spec, sin clonar impl\nbilinker/\n  .stratum/\n    .technical-decisions.toml   ✓ config presente\n    .impl.toml                  ✓ config presente\n    # technical-decisions/ y impl/ ausentes — no clonadas\n```\n\n`bilinker check` y `bilinker graph` reportan `UNREACHABLE` para los endpoints que apuntan a subcapas no presentes, sin fallar.\n\n## Invariantes\n\n1. El nombre del archivo `.toml` coincide exactamente con el nombre del directorio\n   de la subcapa.\n2. Si existe el directorio de la subcapa, debe existir su `.toml` correspondiente.\n3. El `.toml` puede existir sin que exista el directorio (subcapa no clonada).\n4. Los campos `repo` y `branch` son siempre requeridos.","start_line":1,"lang":"markdown","xi":0,"yi":1},{"id":"commands/tree.md@.#L1","label":"commands/tree.md","layer_id":"L__","layer":".","url":"file:///home/anibal/Workspace/accreta/subsystems/stratum/commands/tree.md#L1","content":"# Especificación: `stratum tree`\n\n## Propósito\n\nMuestra el árbol de capas Stratum a partir de un path dado. Cada nodo del árbol es un directorio común; sus hijos son las sub-capas (`>name`) o los subdirectorios que contienen capas más profundas.\n\n## Sintaxis\n\n```\nstratum tree [<path>]\n```\n\n- `<path>`: expresión Stratum de inicio. Default: `*` (raíz del proyecto).\n\n## Salida\n\nÁrbol en texto con conectores `├──` / `└──` / `│`. La primera línea es la expresión de inicio; cada hijo indentado es una sub-capa (`>name`) o un subdirectorio que contiene capas.\n\n```\n*\n└── subsystems\n    ├── bilinker\n    │   └── >impl\n    └── stratum\n        └── >impl\n```\n\n```\n*/subsystems/stratum\n└── >impl\n```\n\n## Reglas de construcción del árbol\n\n1. **Sub-capas directas** — los directorios dentro de `.stratum/` del nodo actual se muestran como `>name`, ordenados alfabéticamente, antes que los subdirectorios.\n2. **Subdirectorios con contenido Stratum** — los subdirectorios no ocultos que contienen capas (directa o recursivamente) se muestran como nodos intermedios, ordenados alfabéticamente.\n3. **Subdirectorios sin contenido Stratum** — se omiten.\n4. La recursión continúa en cada hijo hasta que no haya más capas.\n\n## Códigos de salida\n\n| Código | Condición |\n|--------|-----------|\n| 0 | Éxito. |\n| 1 | Path no encontrado. |\n| 2 | Expresión Stratum inválida. |\n\n## Propiedades\n\n- **Solo lectura**: no modifica el filesystem.\n- **Composable**: salida a stdout, errores a stderr.","start_line":1,"lang":"markdown","xi":0,"yi":2},{"id":"crates/estrato-cli/src/main.rs@.stratum/impl#L1","label":"crates/estrato-cli/src/main.rs","layer_id":"L__stratum_impl","layer":".stratum/impl","url":"file:///home/anibal/Workspace/accreta/subsystems/stratum/.stratum/impl/crates/estrato-cli/src/main.rs","content":"use clap::{Parser, Subcommand};\nuse stratum::{parse, parse_path, resolve, cwd_as_stratum_path, format_path, Context, Query};\nuse std::path::{Path, PathBuf};\nuse std::process;\n\n#[derive(Parser)]\n#[command(name = \"stratum\", about = \"Navegación y gestión de capas Stratum\")]\nstruct Cli {\n    #[command(subcommand)]\n    command: Option<Commands>,\n}\n\n#[derive(Subcommand)]\nenum Commands {\n    /// Muestra el path Stratum del directorio actual (desde *)\n    Pws,\n    /// Registra una nueva sub-capa con su repositorio git\n    Add {\n        /// Nombre de la sub-capa\n        name: String,\n        /// URL del repositorio git (ssh o https)\n        remote: String,\n        /// Rama (default: main)\n        #[arg(default_value = \"main\")]\n        branch: String,\n        /// Sobreescribir si ya existe\n        #[arg(long)]\n        force: bool,\n    },\n    /// Muestra el árbol de capas a partir de un path Stratum\n    Tree {\n        /// Path Stratum de inicio (default: *)\n        #[arg(default_value = \"*\")]\n        path: String,\n    },\n    /// Clona o actualiza las sub-capas declaradas en .stratum/\n    Pull {\n        /// Nombre de la sub-capa (sin especificar: todas)\n        name: Option<String>,\n        /// Procesar recursivamente todas las sub-capas\n        #[arg(long)]\n        recursive: bool,\n    },\n    /// Path Stratum o consulta de navegación\n    #[command(external_subcommand)]\n    Query(Vec<String>),\n}\n\nfn main() {\n    let cli = Cli::parse();\n\n    let cwd = std::env::current_dir().unwrap_or_else(|e| {\n        eprintln!(\"error: {e}\");\n        process::exit(1);\n    });\n\n    match cli.command {\n        None => {\n            let ctx = Context::from_dir(&cwd);\n            match ctx.up_path() {\n                Some(p) => println!(\"up:   {}  ({})\", ctx.depth, p),\n                None    => println!(\"up:   0\"),\n            }\n            if ctx.sub_layers.is_empty() {\n                println!(\"down: (ninguna)\");\n            } else {\n                println!(\"down: {}\", ctx.sub_layers.join(\"  \"));\n            }\n        }\n\n        Some(Commands::Pws) => {\n            match cwd_as_stratum_path(&cwd) {\n                Some(tokens) => println!(\"{}\", format_path(&tokens)),\n                None => { eprintln!(\"error: no se encontró raíz .git\"); process::exit(1); }\n            }\n        }\n\n        Some(Commands::Add { name, remote, branch, force }) => {\n            if let Err(e) = cmd_add(&cwd, &name, &remote, &branch, force) {\n                eprintln!(\"error: {e}\");\n                process::exit(1);\n            }\n        }\n\n        Some(Commands::Pull { name, recursive }) => {\n            if let Err(e) = cmd_pull(&cwd, name.as_deref(), recursive) {\n                eprintln!(\"error: {e}\");\n                process::exit(1);\n            }\n        }\n\n        Some(Commands::Tree { path }) => {\n            let tokens = match parse_path(&path) {\n                Ok(t)  => t,\n                Err(e) => { eprintln!(\"error: {e}\"); process::exit(2); }\n            };\n            let root = match resolve(&cwd, &cwd, &tokens) {\n                Ok(p)  => p,\n                Err(e) => { eprintln!(\"error: {e}\"); process::exit(1); }\n            };","start_line":1,"lang":"rust","xi":1,"yi":1},{"id":"concepts/layer-model.md@.#L1","label":"concepts/layer-model.md","layer_id":"L__","layer":".","url":"file:///home/anibal/Workspace/accreta/subsystems/stratum/concepts/layer-model.md#L1","content":"# Especificación: Modelo de capas\n\n## Dos tipos de relación entre carpetas\n\nStratum distingue dos tipos de relación entre carpetas de un proyecto:\n\n| Tipo | Carpeta | Relación |\n|---|---|---|\n| **Sub-proyecto** | carpeta plana | proyecto hermano con sus propias specs |\n| **Capa interna** | `.stratum/<nombre>/` | nivel inferior de implementación del mismo proyecto |\n\nLa distinción es fundamental: los sub-proyectos son entidades independientes que comparten un contexto de más alto nivel. Las capas internas son partes del mismo proyecto en distintos niveles de abstracción.\n\n## Sub-proyectos: carpetas planas\n\nUn sub-proyecto es simplemente una subcarpeta con sus propias especificaciones. No requiere ninguna convención de nombre especial.\n\n```\naccreta/\n  stratum/        ← sub-proyecto con sus specs\n  bilinker/       ← sub-proyecto con sus specs\n  README.md\n  general/\n  specific/\n```\n\n`stratum/` y `bilinker/` son proyectos independientes dentro del contexto de `accreta/`. Cada uno tiene su propio README, sus propias specs, su propio git.\n\nNo existe una carpeta `.stratum/` en `accreta/` para agruparlos — eso mezclaría dos conceptos distintos.\n\n## Capas internas: `.stratum/`\n\nLa carpeta `.stratum/` aparece dentro de un proyecto cuando ese proyecto necesita separar sus propias capas de abstracción: decisiones técnicas, implementación, tests, etc.\n\n```\nbilinker/                           ← specs funcionales (capa más alta)\n  general/\n  specific/\n  .stratum/\n    impl/                           ← implementación Rust\n      crates/\n      docs/adr/\n      tests/\n```\n\nLa carpeta `.stratum/` en `bilinker/` no tiene nada que ver con los sub-proyectos de `accreta/`. Es exclusiva del proyecto `bilinker/` y contiene sus capas de implementación.\n\n## Regla de uso de `.stratum/`\n\n`.stratum/` aparece dentro de una carpeta de specs **si y solo si** esa carpeta necesita sus propias capas inferiores de implementación.\n\n**Correcto:**\n```\nbilinker/\n  .stratum/           ← bilinker tiene capas propias\n    impl/\n```\n\n**Incorrecto:**\n```\naccreta/\n  .stratum/           ← INCORRECTO: no agrupa sub-proyectos\n    stratum/\n    bilinker/\n```\n\n## Ejemplo completo\n\n```\naccreta/                             (git — specs Accreta)\n  general/\n  specific/\n  stratum/                          (git — specs Stratum)\n    general/\n    specific/\n    .stratum/                       ← capas internas de Stratum (si las tiene)\n      impl/\n  bilinker/                         (git — specs Bilinker)\n    general/\n    specific/\n    .stratum/                       ← capas internas de Bilinker\n      tech-decisions/               (git — ADRs)\n        adr/\n        .stratum/\n          impl/                     (git — código Rust)\n            crates/\n            tests/\n```\n\n## Profundidad de anidamiento\n\nNo hay límite de profundidad. Una capa interna puede tener a su vez sus propias capas internas con `.stratum/`. La regla es la misma en cada nivel: `.stratum/` solo para capas propias, carpetas planas para sub-proyectos hermanos.\n\n## Git por repositorio\n\nCada proyecto (carpeta de specs) y cada capa interna es un repositorio git independiente. Esto permite:\n\n- Historial separado por nivel de abstracción.\n- Que un proyecto dependa de otro sin acoplar su versionado.\n- Que las capas internas (impl, tests) evolucionen en su propio ritmo.","start_line":1,"lang":"markdown","xi":0,"yi":3},{"id":"crates/stratum/src/up.rs@.stratum/impl#L1","label":"crates/stratum/src/up.rs","layer_id":"L__stratum_impl","layer":".stratum/impl","url":"file:///home/anibal/Workspace/accreta/subsystems/stratum/.stratum/impl/crates/stratum/src/up.rs#L1","content":"use std::path::{Path, PathBuf};\n\n#[derive(Debug, PartialEq)]\npub enum UpError {\n    InsufficientDepth { requested: usize, actual: usize },\n}\n\nimpl std::fmt::Display for UpError {\n    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n        match self {\n            UpError::InsufficientDepth { requested, actual } => write!(\n                f,\n                \"profundidad insuficiente: se pidieron {requested} niveles, actual {actual}\"\n            ),\n        }\n    }\n}\n\n/// Counts how many stratum levels deep `path` is by scanning for `.stratum/<name>` pairs.\npub fn depth(path: &Path) -> usize {\n    let components: Vec<_> = path.components().collect();\n    let mut count = 0;\n    let mut i = 0;\n    while i + 1 < components.len() {\n        let a = components[i].as_os_str();\n        let b = components[i + 1].as_os_str();\n        if a == \".stratum\" && !b.is_empty() && b != \".stratum\" {\n            count += 1;\n            i += 2;\n        } else {\n            i += 1;\n        }\n    }\n    count\n}\n\n/// Returns a relative path going up `levels` stratum levels (each = `../..`),\n/// appending `suffix` if provided. Validates that depth >= levels.\npub fn resolve_up(\n    current: &Path,\n    levels: usize,\n    suffix: Option<&Path>,\n) -> Result<PathBuf, UpError> {\n    if levels == 0 {\n        return Err(UpError::InsufficientDepth { requested: 0, actual: depth(current) });\n    }\n    let actual = depth(current);\n    if levels > actual {\n        return Err(UpError::InsufficientDepth { requested: levels, actual });\n    }\n    let mut path = PathBuf::new();\n    for _ in 0..levels {\n        path = path.join(\"..\").join(\"..\");\n    }\n    if let Some(s) = suffix {\n        path = path.join(s);\n    }\n    Ok(path)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    fn p(s: &str) -> PathBuf { PathBuf::from(s) }\n\n    #[test]\n    fn depth_root() { assert_eq!(depth(&p(\"/home/user/project\")), 0); }\n\n    #[test]\n    fn depth_one() { assert_eq!(depth(&p(\"/project/.stratum/impl\")), 1); }\n\n    #[test]\n    fn depth_two() {\n        assert_eq!(depth(&p(\"/project/.stratum/tech/.stratum/impl\")), 2);\n    }\n\n    #[test]\n    fn up_one() {\n        assert_eq!(resolve_up(&p(\"/project/.stratum/impl\"), 1, None).unwrap(), p(\"../..\"));\n    }\n\n    #[test]\n    fn up_two() {\n        let result = resolve_up(&p(\"/project/.stratum/tech/.stratum/impl\"), 2, None).unwrap();\n        assert_eq!(result, p(\"../../../..\"));\n    }\n\n    #[test]\n    fn up_with_suffix() {\n        let result =\n            resolve_up(&p(\"/project/.stratum/impl\"), 1, Some(Path::new(\"src/main.rs\"))).unwrap();\n        assert_eq!(result, p(\"../../src/main.rs\"));\n    }\n\n    #[test]\n    fn up_exceeds_depth() {\n        let err = resolve_up(&p(\"/project/.stratum/impl\"), 3, None).unwrap_err();\n        assert!(matches!(err, UpError::InsufficientDepth { requested: 3, actual: 1 }));\n    }","start_line":1,"lang":"rust","xi":1,"yi":2},{"id":"commands/estrato.md@.#L1","label":"commands/estrato.md","layer_id":"L__","layer":".","url":"file:///home/anibal/Workspace/accreta/subsystems/stratum/commands/estrato.md#L1","content":"# Especificación: comandos `stratum`\n\n## Propósito\n\nCLI de navegación por el árbol de capas de un proyecto Stratum. Permite obtener paths hacia capas superiores e inferiores desde la posición actual, y visualizar el contexto de profundidad en el árbol.\n\nEl argumento es un path Stratum — ver [paths.md](paths.md) para la gramática completa.\n\nEl argumento de navegación se pasa siempre entre comillas simples porque contiene caracteres especiales del shell (`>`, `<`):\n\n```bash\ncd $(stratum '>tech-decisions>impl')\ncd $(stratum '<<')\n```\n\n## Sintaxis general\n\n```\nstratum '<query>'\n```\n\nUna query es una secuencia de operadores `>` y `<` que describe una navegación relativa en el árbol de capas.\n\n## Operadores\n\n### `>` — bajar una capa\n\n`>name` desciende a la sub-capa `name` dentro del directorio `.stratum/` actual. Varios `>` encadenados descienden múltiples niveles:\n\n```\n'>tech-decisions'              →  .stratum/tech-decisions\n'>tech-decisions>impl'         →  .stratum/tech-decisions/.stratum/impl\n'>a>b>c'                       →  .stratum/a/.stratum/b/.stratum/c\n```\n\n**Validación:** cada segmento del path resultante debe existir en el filesystem. Si algún segmento no existe, imprime error a stderr y sale con código 1.\n\n### `<` — subir una capa\n\nCada `<` sube un nivel Stratum (equivale a `../..` en el filesystem, ya que cada capa ocupa dos directorios: `.stratum/<nombre>/`). Varios `<` encadenados suben múltiples niveles:\n\n```\n'<'    →  ../..\n'<<'   →  ../../../..\n'<<<'  →  ../../../../../../\n```\n\n**Validación:** la cantidad de `<` no puede superar la profundidad actual en el árbol. Si se intenta subir más niveles de los disponibles, imprime error a stderr y sale con código 1.\n\n### `>?` — consultar capas disponibles hacia abajo\n\nLista los nombres de las sub-capas disponibles en `.stratum/` del directorio actual.\n\n```\n'>?'   →  impl  tech-decisions\n```\n\nSi no existe `.stratum/` en el directorio actual, retorna lista vacía.\n\n### `<?` — consultar profundidad hacia arriba\n\nIndica cuántos niveles Stratum hay por encima de la posición actual.\n\n```\n'<?'   →  2\n```\n\n## Sin argumentos\n\nMuestra el contexto completo de la posición actual: profundidad y sub-capas.\n\n```\n$ stratum\nup:   2  (../../../..)\ndown: impl  tech-decisions\n```\n\n```\n$ stratum\nup:   0\ndown: stratum  bilinker\n```\n\n```\n$ stratum\nup:   1  (../..)\ndown: (ninguna)\n```\n\n## Ejemplos de uso\n\n```bash\n# Navegar a una sub-capa\ncd $(stratum '>tech-decisions>impl')\n\n# Volver dos niveles arriba\ncd $(stratum '<<')\n\n# Ver qué sub-capas hay disponibles\nstratum '>?'","start_line":1,"lang":"markdown","xi":0,"yi":4},{"id":"concepts/paths.md@.#L1","label":"concepts/paths.md","layer_id":"L__","layer":".","url":"file:///home/anibal/Workspace/accreta/subsystems/stratum/concepts/paths.md#L1","content":"# Especificación: lenguaje de paths Stratum\n\n## Concepto\n\nUn path Stratum es una expresión que describe un path en el filesystem, opcionalmente usando navegación por layers. Es un superconjunto de los paths relativos tradicionales: cualquier path relativo es un path Stratum válido — la biblioteca lo retorna sin modificación.\n\n## Gramática\n\n```\nstratum-path := traditional-path\n              | down-path\n              | up-path\n              | root-path\n\ntraditional-path := path relativo del filesystem (no comienza con '>' ni '<')\ndown-path        := ('>' layer-name)+ ('/' fs-path)?\nup-path          := '<'+ ('/' fs-path)?\nroot-path        := '<*' root-tail?\nroot-tail        := ('/' fs-segment) (('>' layer-name)+ ('/' fs-path)?)?\n                  | ('>' layer-name)+ ('/' fs-path)?\n\nlayer-name := cualquier carácter excepto '>' y '/'\nfs-path    := path tradicional del filesystem\nfs-segment := componente de path sin '>' ni '<'\n```\n\n## Resolución\n\n### Path tradicional (identidad)\n\nUn path que no comienza con `>` ni `<` es retornado sin cambios.\n\n```\n.stratum/tech-decisions      →  .stratum/tech-decisions\n../..                        →  ../..\nsrc/main.rs                  →  src/main.rs\n```\n\n### Down: `>name1>name2/.../fs-path`\n\nCada segmento `>name` se expande a `.stratum/<name>`. Los segmentos se encadenan. El `fs-path` opcional se concatena al final.\n\n```\n>tech-decisions                    →  .stratum/tech-decisions\n>tech-decisions>impl               →  .stratum/tech-decisions/.stratum/impl\n>tech-decisions>impl/src/main.rs   →  .stratum/tech-decisions/.stratum/impl/src/main.rs\n>tasks/pending.md                  →  .stratum/tasks/pending.md\n```\n\n### Up: `<</fs-path`\n\nCada `<` equivale a `../..` (un nivel Stratum = dos directorios). El `fs-path` opcional se concatena al final.\n\n```\n<                      →  ../..\n<<                     →  ../../../..\n</src/main.rs          →  ../../src/main.rs\n<</docs/api.md         →  ../../../../docs/api.md\n```\n\n### Root: `<*`\n\n`<*` resuelve al directorio raíz del proyecto, definido como el ancestro más cercano que contiene `.git`. La resolución camina hacia arriba desde la layer actual hasta encontrarlo; si no existe, es un error.\n\nDespués de `<*` pueden seguir un fs-path y/o tokens `>` de navegación hacia abajo. Es el único caso donde tokens `<*` y `>` coexisten en la misma expresión.\n\n```\n<*                                          →  <raíz del proyecto>\n<*/subsystems/stratum                       →  <raíz>/subsystems/stratum\n<*>impl                                     →  <raíz>/.stratum/impl\n<*/subsystems/stratum>impl/crates/cli/src   →  <raíz>/subsystems/stratum/.stratum/impl/crates/cli/src\n```\n\n## Invariantes\n\n1. Un path que no comienza con `>` ni `<` es válido y se retorna tal cual.\n2. `<` (Up) y `>` (Down) no se mezclan. `<*` (Root) puede ir seguido de tokens `>`.\n3. El `fs-path` no contiene `>` ni `<`.\n4. Cada `layer-name` es no vacío.\n5. `<*` solo puede aparecer al inicio de la expresión.\n\n## Uso en herramientas\n\nEl path Stratum es el lenguaje de expresión de paths del ecosistema. Lo usan:\n\n- **`stratum` CLI** — como argumento de navegación interactiva.\n- **bilinker** — en endpoints layer de archivos `.bilink`.\n- Cualquier herramienta del ecosistema que necesite referenciar paths dentro\n  de un árbol de layers Stratum.","start_line":1,"lang":"markdown","xi":0,"yi":5},{"id":"crates/stratum/src/path.rs@.stratum/impl#L1","label":"crates/stratum/src/path.rs","layer_id":"L__stratum_impl","layer":".stratum/impl","url":"file:///home/anibal/Workspace/accreta/subsystems/stratum/.stratum/impl/crates/stratum/src/path.rs#L1","content":"use std::path::{Path, PathBuf};\n\n/// A single token in a stratum path expression.\n#[derive(Debug, PartialEq, Clone)]\npub enum PathToken {\n    Down(String),    // `>name`  — navigate into `.stratum/<name>`\n    Up,              // `<`      — go up one stratum level (`../..`)\n    Root,            // `<*`     — project root (nearest `.git` ancestor)\n    TopRoot,         // `*`      — outermost `.git` ancestor (top of the whole project)\n    Simple(PathBuf), // traditional path component — joined as-is\n}\n\n/// A parsed stratum path: a sequence of tokens.\n/// Tokens are resolved left to right.\npub type StratumPath = Vec<PathToken>;\n\n#[derive(Debug, PartialEq)]\npub enum ParseError {\n    Empty,\n    InvalidSegment(String),\n    InvalidSyntax(String),\n}\n\nimpl std::fmt::Display for ParseError {\n    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n        match self {\n            ParseError::Empty => write!(f, \"path vacío\"),\n            ParseError::InvalidSegment(s) => write!(f, \"segmento inválido: '{s}'\"),\n            ParseError::InvalidSyntax(s) => write!(f, \"sintaxis inválida: '{s}'\"),\n        }\n    }\n}\n\n/// Parses a stratum path string into a token sequence.\n///\n/// Rules:\n/// - Starts with `>`: sequence of `Down` tokens, terminated by a `/` which begins a `Simple`.\n/// - Starts with `<*`: `Root` token, followed by optional `Simple` and `Down` tokens.\n/// - Starts with `<`: sequence of `Up` tokens, terminated by a `/` which begins a `Simple`.\n/// - Starts with `*`: `TopRoot` token (outermost `.git`), followed by optional `Simple`/`Down`.\n/// - Anything else: a single `Simple` token (traditional path, returned as-is).\npub fn parse_path(s: &str) -> Result<StratumPath, ParseError> {\n    if s.is_empty() {\n        return Err(ParseError::Empty);\n    }\n\n    if s.starts_with('>') {\n        return parse_down_tokens(s);\n    }\n\n    // `<*` must be checked before `<` to avoid consuming the `*`\n    if s.starts_with(\"<*\") {\n        return parse_root_token(s);\n    }\n\n    if s.starts_with('<') {\n        return parse_up_tokens(s);\n    }\n\n    if s.starts_with('*') {\n        return parse_top_root_token(s);\n    }\n\n    Ok(vec![PathToken::Simple(PathBuf::from(s))])\n}\n\n/// Formats a `StratumPath` back to its string representation.\npub fn format_path(tokens: &StratumPath) -> String {\n    let mut s = String::new();\n    for token in tokens {\n        match token {\n            PathToken::Down(name) => { s.push('>'); s.push_str(name); }\n            PathToken::Up        => s.push('<'),\n            PathToken::Root      => s.push_str(\"<*\"),\n            PathToken::TopRoot   => s.push('*'),\n            PathToken::Simple(p) => s.push_str(&p.display().to_string()),\n        }\n    }\n    s\n}\n\nfn parse_root_token(s: &str) -> Result<StratumPath, ParseError> {\n    // s starts with \"<*\"\n    let rest = &s[2..];\n    let mut tokens = vec![PathToken::Root];\n\n    if rest.is_empty() {\n        return Ok(tokens);\n    }\n\n    if rest.starts_with('/') {\n        if let Some(gt_pos) = rest.find('>') {\n            let simple_part = &rest[..gt_pos];\n            let down_part   = &rest[gt_pos..]; // starts with '>'\n            if !simple_part.is_empty() && simple_part != \"/\" {\n                tokens.push(PathToken::Simple(PathBuf::from(simple_part)));\n            }\n            tokens.extend(parse_down_tokens(down_part)?);\n        } else {\n            tokens.push(PathToken::Simple(PathBuf::from(rest)));","start_line":1,"lang":"rust","xi":1,"yi":3},{"id":"commands/pull.md@.#L1","label":"commands/pull.md","layer_id":"L__","layer":".","url":"file:///home/anibal/Workspace/accreta/subsystems/stratum/commands/pull.md#L1","content":"# Comando: `stratum pull`\n\nClona o actualiza las subcapas declaradas en los archivos `.<nombre>.toml` del directorio `.stratum/` actual.\n\n## Uso\n\n```\nstratum pull [<nombre>] [--recursive]\n```\n\n| Argumento / Flag | Descripción |\n|-----------------|-------------|\n| `<nombre>` | Nombre de una subcapa específica. Sin este argumento, procesa todas las subcapas del `.stratum/` actual. |\n| `--recursive` | Procesa también los `.stratum/` de las subcapas clonadas, en profundidad. |\n\n## Comportamiento\n\nPara cada subcapa con `.toml` encontrado:\n\n1. Si el directorio de la subcapa **no existe**: clona el repo declarado en `repo`\n   a la rama `branch`, aplicando `sparse` y `depth` si están presentes.\n2. Si el directorio **ya existe**: ejecuta `git fetch` + `git checkout` a la rama\n   declarada. No destruye cambios locales — falla si hay conflicto.\n\n## Ejemplos\n\n```bash\n# Clonar todas las subcapas del .stratum/ actual\nstratum pull\n\n# Clonar solo tech-decisions\nstratum pull technical-decisions\n\n# Clonar todas las subcapas en todo el árbol recursivamente\nstratum pull --recursive\n\n# Actualizar impl ya clonada\ncd .stratum/technical-decisions\nstratum pull impl\n```\n\n## Salida\n\n```\n$ stratum pull --recursive\n\npulling technical-decisions  git@github.com:org/bilinker-tech-decisions.git  main\n  cloned  .stratum/technical-decisions/\n\npulling impl  git@github.com:org/bilinker-impl.git  main\n  cloned  .stratum/technical-decisions/.stratum/impl/\n```\n\nSi una subcapa ya está actualizada:\n\n```\npulling technical-decisions  already up to date\n```\n\n## Exit codes\n\n| Código | Condición |\n|--------|-----------|\n| `0` | Todas las subcapas procesadas correctamente |\n| `1` | Error de red, autenticación, o conflicto local |\n| `2` | `.toml` con formato inválido |","start_line":1,"lang":"markdown","xi":0,"yi":6}],"edges":[{"id":"e_125971da_commands","source":"commands/add.md@.#L1","target":"crates/estrato-cli/src/main.rs@.stratum/impl#L95","label":"125971da","states":"OK↔OK"},{"id":"e_35cbef68_concepts","source":"concepts/sublayer-config.md@.#L1","target":"crates/estrato-cli/src/main.rs@.stratum/impl#L95","label":"35cbef68","states":"OK↔OK"},{"id":"e_38962614_commands","source":"commands/tree.md@.#L1","target":"crates/estrato-cli/src/main.rs@.stratum/impl#L1","label":"38962614","states":"OK↔OK"},{"id":"e_6d8b8502_concepts","source":"concepts/layer-model.md@.#L1","target":"crates/stratum/src/up.rs@.stratum/impl#L1","label":"6d8b8502","states":"OK↔OK"},{"id":"e_8e2e749a_commands","source":"commands/estrato.md@.#L1","target":"crates/estrato-cli/src/main.rs@.stratum/impl#L1","label":"8e2e749a","states":"OK↔OK"},{"id":"e_9cfe0db7_concepts","source":"concepts/paths.md@.#L1","target":"crates/stratum/src/path.rs@.stratum/impl#L1","label":"9cfe0db7","states":"OK↔OK"},{"id":"e_b95021d2_commands","source":"commands/pull.md@.#L1","target":"crates/estrato-cli/src/main.rs@.stratum/impl#L1","label":"b95021d2","states":"OK↔OK"},{"id":"e_c0feab23_commands","source":"commands/pull.md@.#L1","target":"crates/estrato-cli/src/main.rs@.stratum/impl#L1","label":"c0feab23","states":"OK↔OK"}]};
const COL = 540, ROW = 90;
const elements = [];

G.layers.forEach(l =>
  elements.push({ data: { id: l.id, label: l.label, type: 'layer' } })
);

const yIdx = {};
G.nodes.forEach(n => {
  const k = n.xi;
  yIdx[k] = yIdx[k] || 0;
  elements.push({
    data: { id: n.id, label: n.label, parent: n.layer_id, type: 'file',
            url: n.url, content: n.content, layer: n.layer,
            start_line: n.start_line, lang: n.lang },
    position: { x: n.xi * COL, y: yIdx[k]++ * ROW }
  });
});

G.edges.forEach(e =>
  elements.push({ data: { id: e.id, source: e.source, target: e.target,
                          label: e.label + '\n' + e.states } })
);

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements,
  style: [
    { selector: 'node[type="layer"]', style: {
        'background-color': 'rgba(255,255,255,0.03)', 'background-opacity': 1,
        'border-color': '#30363d', 'border-style': 'dashed', 'border-width': 2,
        'label': 'data(label)', 'text-valign': 'top', 'text-halign': 'center',
        'color': '#6e7681', 'font-family': 'Courier New', 'font-size': 12, 'padding': 28 }},
    { selector: 'node[type="file"]', style: {
        'shape': 'round-rectangle', 'background-color': '#161b22',
        'border-color': '#1f6feb', 'border-width': 1.5,
        'label': 'data(label)', 'text-valign': 'center',
        'color': '#c9d1d9', 'font-family': 'Courier New', 'font-size': 11,
        'padding': 10, 'width': 'label', 'cursor': 'pointer' }},
    { selector: 'node[type="file"]:selected', style: {
        'border-color': '#58a6ff', 'border-width': 2.5, 'background-color': '#1c2938' }},
    { selector: 'edge', style: {
        'curve-style': 'bezier', 'target-arrow-shape': 'triangle', 'source-arrow-shape': 'triangle',
        'label': 'data(label)', 'color': '#8b949e', 'font-family': 'Courier New', 'font-size': 9,
        'text-background-color': '#0d1117', 'text-background-opacity': 0.85, 'text-background-padding': 3,
        'line-color': '#30363d', 'target-arrow-color': '#30363d', 'source-arrow-color': '#30363d',
        'width': 1.5, 'text-wrap': 'wrap' }},
    { selector: 'edge:selected', style: {
        'line-color': '#1f6feb', 'target-arrow-color': '#1f6feb', 'source-arrow-color': '#1f6feb' }}
  ],
  layout: { name: 'preset' }
});

cy.fit(undefined, 40);

cy.on('tap', 'node[type="file"]', evt => {
  const n   = evt.target.data();
  const url = n.url ? `<a class="open-link" href="${n.url}" target="_blank">Open file</a>` : '';
  const txt = n.content || '(no content)';

  let contentHtml;
  if (n.lang === 'markdown') {
    contentHtml = `<div class="md-wrap">${marked.parse(txt)}</div>`;
  } else {
    const lang    = n.lang || 'plaintext';
    const hl      = hljs.highlight(txt, { language: lang, ignoreIllegals: true });
    const count   = txt.split('\n').length;
    const start   = n.start_line || 1;
    const nums    = Array.from({ length: count }, (_, i) => start + i).join('\n');
    contentHtml   = `
      <div class="code-wrap">
        <div class="line-nums">${nums}</div>
        <pre><code class="hljs language-${lang}">${hl.value}</code></pre>
      </div>`;
  }

  document.getElementById('panel').innerHTML = `
    <div class="ntitle">${esc(n.label)}</div>
    <div class="nlayer">${esc(n.layer)}</div>
    ${url}
    ${contentHtml}`;
});

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
